# Render Blueprint — deploys the Poel Life LE report service as a Docker web service.
# Push this folder to GitHub, then in Render: New → Blueprint → pick the repo.
services:
  - type: web
    name: poel-le-report-service
    runtime: docker
    plan: starter            # 512 MB RAM. Use "standard" if you OCR very large scanned APS files.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # paste in the Render dashboard; never commit it
      - key: APP_API_KEY
        generateValue: true  # Render generates a strong key; copy it into your main app
      - key: ANTHROPIC_MODEL
        value: claude-opus-5
      - key: RETENTION_HOURS
        value: "24"
      - key: KEEP_UPLOADS
        value: "0"
      - key: DATA_DIR
        value: /data
    disk:
      name: poel-cases
      mountPath: /data
      sizeGB: 5
