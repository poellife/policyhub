/* Two ways to check a reading. The recogniser asks "what word is this?", which
   forces the audio through a modern-Israeli-Hebrew language model that has never
   met שָׁוְעָתָם. Comparing against the parent's own recording asks "does this sound
   like that?" — no vocabulary, no accent assumption, so it works on every word.
   When the parent has recorded the word and the family has calibrated, we use the
   comparison; otherwise we fall back to the recogniser. */
/* A parent can send the ear back to the old computer matching whenever they like,
   without throwing away the calibration — the switch is separate from the tuning,
   so turning it back on later does not mean testing again. */
function vmOn(){ return S.settings.voiceMatch!==false && !!(+(S.settings.vmMargin||0)); }
function vmSet(on){
  if(on){ S.settings.voiceMatch=true; save();
    if(!(+(S.settings.vmMargin||0))){ startVoiceTest(); return; }
    toast('🎤 Comparing to your recording'); }
  else { S.settings.voiceMatch=false; save(); toast('🤖 Back to the old computer matching'); }
  render();
}
function earUseMatch(word){
  try{ return vmOn() && REC.ids.has(word.id)
       && !!(navigator.mediaDevices && window.MediaRecorder); }catch(e){ return false; }
}
function earRecordBlob(ms){
  return new Promise((resolve,reject)=>{
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}).then(stream=>{
      const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4',''].find(m=>!m||MediaRecorder.isTypeSupported(m));
      const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); const chunks=[];
      mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
      mr.onstop=()=>{ try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} resolve(new Blob(chunks)); };
      mr.onerror=e=>{ try{ stream.getTracks().forEach(t=>t.stop()); }catch(x){} reject(e.error||new Error('recorder')); };
      mr.start();
      setTimeout(()=>{ try{ if(mr.state==='recording') mr.stop(); }catch(e){} }, ms);
    }).catch(reject);
  });
}
/* An absolute distance threshold does not work here, and it is why the ear started
   waving everything through: how close two recordings score depends on the room,
   the microphone and how the child sounds today, so any fixed number is either too
   tight one day or too loose the next.
   Instead we ask a RELATIVE question — the same one the calibration screen asks.
   Score the child's reading against the target word AND against several other words
   the parent has recorded. The target has to come first, and by a clear margin.
   A wrong word can be close to the target, but it cannot beat five decoys as well. */
function earDecoys(word, n){
  const pool = WORDS.filter(w => w.id !== word.id && REC.ids.has(w.id));
  const out = [], seen = {};
  for(let g=0; g<80 && out.length<n && pool.length; g++){
    const w = pool[Math.floor(Math.random()*pool.length)];
    if(seen[w.id]) continue; seen[w.id]=1; out.push(w);
  }
  return out;
}
async function earVoiceMatch(word, blob){
  try{
    const margin=+(S.settings.vmMargin||0);
    if(!margin||!blob||!REC.ids.has(word.id)) return null;
    const feats=vmFeatures(await vmDecode(await blob.arrayBuffer()));
    if(feats.length<8) return null;
    const target=await vmCompare(feats, word.id);
    if(!isFinite(target)) return null;
    const decoys=earDecoys(word, 5);
    if(decoys.length<3) return null;               /* not enough recordings to judge fairly */
    let best=Infinity;
    for(const d of decoys){
      try{ const v=await vmCompare(feats, d.id); if(isFinite(v)&&v<best) best=v; }catch(e){}
    }
    if(!isFinite(best)) return null;
    return (target < best) && ((best - target) >= margin);
  }catch(e){ return null; }
}
function earSay(msg, good){
  if(good){ sfx('turbo'); flashMatch(true); } else sfx('tap');
  ls.earMsg=msg;
  if(!ls.heard){ ls.heard=true; renderListen(); }
  if(good) setTimeout(()=>{ const b=document.getElementById('mk1'); if(b) b.style.outline='4px solid var(--accent)'; },50);
  const el=document.getElementById('earsay'); if(el) el.textContent=msg; else renderListen();
}
async function earListenMatch(){
  if(earBusy) return; earBusy=true;
  earBtnBusy(true);
  const finish=(msg,good)=>{ earBusy=false; earBtnBusy(false); earSay(msg,good); };
  try{
    const blob=await earRecordBlob(2600);
    const m=await earVoiceMatch(ls.word, blob);
    if(m===true) finish('🤖 That sounded just like the recording — nice! 👍', true);
    else { earBusy=false; earBtnBusy(false); earUnsure(msg=>earSay(msg,false)); }
  }catch(e){ finish('🤖 Couldn\'t use the microphone just now — try again'); }
}
/* The robot is not a judge. It hears Modern Israeli Hebrew, it has never met an
   Ashkenazi havara, and it throws the nekudos away before it answers - so when it
   is unsure that says nothing about the child, and telling him he read it wrong
   when he read it right is the one thing that must never happen here. So it has
   two things it may say: "that sounded right", or "I'm not sure - press 🔊 and
   YOU decide". Every unsure answer sends him to the button that settles it, and
   the button is highlighted so a child who cannot read the sentence still knows
   where to go. His own 👍/👎 remains the only thing that is recorded. */
function earUnsure(sayFn){
  sayFn('🤖 I\'m not sure — press 🔊 to hear it, then you say if it matched 👂');
  const b=document.getElementById('hearbtn')||document.getElementById('speakbtn');
  if(b && !b.hidden){ b.classList.add('nudge'); setTimeout(()=>b.classList.remove('nudge'), 4000); }
}
function earListen(){
  if(earUseMatch(ls.word)) return earListenMatch();
  robotEar(ls.word, (ok, heard, info)=>{
    const v=(info&&info.verdict)||(ok?'yes':'unsure');
    if(ok===null) earSay('🤖 '+heard, false);
    else if(v==='yes') earSay('🤖 That sounded right! 👍', true);
    else earUnsure(m=>earSay(m, false));
  });
}
function markListen(ok){
  const l=ls; record(l.word, ok); l.results[l.i]=ok;
  if(ok){ l.streak++; const p=pv('ptsWord',8)+Math.min(l.streak-1,5)*2; l.pts+=p; addPoints(p); sfx(l.streak===3?'turbo':'ok'); } else { l.streak=0; l.missed.push(l.word); sfx('no'); }
  l.i++;
  if(l.i>=l.len){ finish('listen', l); }
  else { nextListen(); l.autoplay=S.settings.autoHear; renderListen(); }
}
function finish(kind, r){
  const c=r.results.filter(Boolean).length; const secs = r.secs!=null ? r.secs : Math.round((Date.now()-r.start)/1000);
  logSession(kind,r.len,c,secs,r.pts); save();
  go({name:'result',kind,n:r.len,c,secs,pts:r.pts,missed:r.missed,slow:r.slow,per:r.per,
    again:{listen:startListen,read:startDrill,speed:startSpeed,sheet:startSheetRun}[kind]});
}

/* ============ READ IT (multiple choice) ============ */
let round=null;
function startDrill(){ if(wordGamesLock()){ recLockMsg(); return; } round={i:0,len:S.settings.roundLen,results:[],missed:[],pts:0,streak:0,start:Date.now(),locked:false}; nextQ(); go({name:'drill'}); }
function nextQ(){ const it=pickWeighted(pool()); round.q={it, answer:it.t, choices:shuffle([it.t, ...translitDistractors(it,3)])}; round.locked=false; round.feedback=''; }
function renderDrill(){
  const r=round, q=r.q;
  app.innerHTML = topbar() + `<div class="drill">
    ${trackHTML(100*r.i/r.len, dotsHTML(r), r.streak>=3)}
    <div class="prompt" style="font-size:18px">Which one sounds right? 🎯</div>
    <div class="stage" id="stage"><button class="speak" id="speakbtn" onclick="speakId('${q.it.id}')" aria-label="Hear it" ${r.locked?'':'hidden'}>🔊</button><div class="heb bigword">${q.it.h}</div></div>
    <div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="answer(${i})">${esc(c)}</button>`).join('')}</div>
    <div class="feedback ${r.fbClass||''}" id="fb">${r.feedback||''}</div>
    <div class="hint">${r.streak>=3?`🔥 ${r.streak} in a row — turbo!`:'&nbsp;'}</div>
    <div class="toolbar" style="justify-content:center"><button class="btn ghost" onclick="go({name:'home'})">🏠 Home</button></div></div>`;
}
function answer(i){
  const r=round,q=r.q; if(r.locked) return; r.locked=true;
  const ok=q.choices[i]===q.answer; record(q.it,ok); r.results[r.i]=ok;
  const btns=[...document.querySelectorAll('.choice')]; btns.forEach(b=>b.disabled=true);
  const stage=document.getElementById('stage'); document.getElementById('speakbtn').hidden=false;
  if(ok){ r.streak++; const p=pv('ptsWord',8)+2+Math.min(r.streak-1,5)*2; r.pts+=p; addPoints(p); sfx(r.streak===3?'turbo':'ok'); btns[i].classList.add('ok'); stage.classList.add('flash-ok'); r.feedback=`+${p}`; r.fbClass='ok'; }
  else { r.streak=0; r.missed.push(q.it); sfx('no'); btns[i].classList.add('no'); btns[q.choices.indexOf(q.answer)].classList.add('ok'); stage.classList.add('flash-no'); r.feedback=`It's <b>${esc(q.answer)}</b>`; r.fbClass='no'; }
  const fb=document.getElementById('fb'); fb.className='feedback '+r.fbClass; fb.innerHTML=r.feedback;
  speak(q.it);
  setTimeout(()=>{ r.i++; if(r.i>=r.len){ finish('read', r); } else { nextQ(); renderDrill(); } }, ok?1400:2400);
}

/* ============ PRACTICE SHEET ============ */
/* ---- the practice sheet ------------------------------------------------
   A page of his words, laid out the way a rebbi's kriah chart is: read down,
   right to left, out loud, as fluently as you can. It used to be only that -
   a page to look at - so nothing a child did here was ever counted.

   Now he reads it word by word and each one is marked right or wrong exactly
   as the Time Trial is marked. The seconds he took on EACH word are kept too -
   a word read in one second and a word stared at for nine are both "right",
   and only this screen can tell you which is which.

   But the child is never shown a clock. A stopwatch ticking in front of a
   six-year-old who is already unsure of a word makes him worse at reading it,
   not better, and the number is not for him anyway - it is for the parent, who
   sees it in the progress report. So the timing is always on and always
   invisible. Everything else lands where every other kriah exercise lands: his
   mastery of that word, his accuracy for the day, his minutes, the weak-spot
   list, the report. */
let sh = null;
function sheetFlat(){ return (view.cells||[]).reduce((a,r)=>a.concat(r), []); }
function startSheetRun(){
  const items = sheetFlat(); if(!items.length) return;
  sh = { items, i:0, marks:[], secs:[], pts:0, started:true, start:Date.now(),
         wordStart:Date.now(), elapsed:0, earMsg:'' };
  sfx('tap'); renderSheet();
}
function sheetStop(){ clearInterval(timerInt); timerInt=null; sh=null; renderSheet(); }
function sheetMark(ok){
  if(!sh || sh.i>=sh.items.length) return;
  const w=sh.items[sh.i]; sh.earMsg='';
  const took = Math.round((Date.now()-sh.wordStart)/100)/10;
  sh.secs[sh.i] = took;
  sh.marks[sh.i]=ok; record(w, ok);
  /* a smoothed reading time per word - the parent's view of which words he is
     still labouring over, whether or not he ends up getting them right */
  if(took>0 && took<30){ const st=stat(w.id); st.rt = st.rt ? Math.round((st.rt*0.6 + took*0.4)*10)/10 : took; }
  if(ok){ const p=pv('ptsWord',8); sh.pts+=p; addPoints(p); sfx('ok'); } else sfx('no');
  sh.i++; sh.wordStart=Date.now();
  if(sh.i>=sh.items.length) return sheetFinish();
  save(); renderSheet();
  const el=document.querySelector('.cell.cur'); if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
}
function sheetFinish(){
  const r=sh; clearInterval(timerInt); timerInt=null;
  r.elapsed=Date.now()-r.start;
  const c=r.marks.filter(Boolean).length;
  const bonus = c===r.items.length ? 25 : 0; r.pts+=bonus; if(bonus) addPoints(bonus);
  /* The words he laboured over, whether or not he got them right - that is what
     a reading sheet is for. "Slow" only means slow FOR HIM: half again his own
     pace on this sheet, so a child who reads everything in two seconds is not
     told off for it and a fast child's one hesitation still shows up. */
  const all = r.items.map((it,i)=>({ id:it.id, h:it.h, t:it.t, secs:r.secs[i]||0, ok:r.marks[i]===true }));
  const per = r.items.length ? Math.round(10*(r.elapsed/1000)/r.items.length)/10 : 0;
  const bar = Math.max(0.8, per*1.5);
  const slow = all.filter(x=>x.secs>=bar).sort((a,b)=>b.secs-a.secs).slice(0,6);
  sh=null;
  finish('sheet', { len:r.items.length, results:r.marks, pts:r.pts,
    secs:Math.round(r.elapsed/100)/10, missed:r.items.filter((_,i)=>!r.marks[i]),
    slow, per });
}
function renderSheet(){
  if(!view.cells){ view.cells=[]; const p=pool(); for(let r=0;r<5;r++) view.cells.push(view.bias?pickMany(p,4):shuffle(p.slice()).slice(0,4)); }
  const run = sh && sh.started;
  const flat = sheetFlat();
  let n=-1;
  app.innerHTML = topbar() + `<div class="drill">
    <div class="toolbar"><span class="eyebrow" style="flex:1">${LEVELS[S.settings.level].name} · practice sheet</span>
      ${run?'':`<button class="btn ${view.bias?'on':''}" onclick="view.bias=!view.bias;view.cells=null;render()">${view.bias?'● Weak spots':'○ Weak spots'}</button>
      <button class="btn" onclick="view.cells=null;render()">↻ New sheet</button>
      <button class="btn" onclick="document.querySelectorAll('.cell').forEach(c=>c.classList.add('show'))">Show all sounds</button>`}</div>
    ${run?`<div class="shrun">
        <div class="shrun-n">${sh.i+1}<small>of ${sh.items.length}</small></div>
        <div class="shrun-tx"><b>Read the lit-up word out loud</b><small>Then ✓ if he got it, ✗ if it needs work. Take as long as he likes.</small></div>
      </div>`
     : `<p class="sub" style="margin:0">Read each row right to left. Tap a word to hear it and see how it sounds.</p>`}
    <div class="sheet ${run?'running':''}">${view.cells.map(row=>`<div class="row">${row.map(it=>{
        n++;
        if(!run) return `<button class="cell" onclick="this.classList.add('show');speakId('${it.id}')"><span class="heb g">${it.h}</span><span class="t">${esc(it.t)}</span></button>`;
        const mk = sh.marks[n]; const cls = (n===sh.i?'cur ':'') + (mk===true?'ok':mk===false?'no':'') + (n<sh.i?' done':'');
        /* a tick or a cross, never a number of seconds - he is not racing anybody */
        return `<button class="cell ${cls}" onclick="${n===sh.i?`speakId('${it.id}')`:''}"><span class="heb g">${it.h}</span>
          <span class="t">${mk===true?'✓':mk===false?'✗':''}</span></button>`;
      }).join('')}</div>`).join('')}</div>
    ${run?`<div class="marks"><button class="mark bad" id="mkH0" onclick="sheetMark(false)">✗<small>needs work</small></button>
        <button class="mark good" id="mkH1" onclick="sheetMark(true)">✓<small>got it</small></button></div>
      <div class="toolbar" style="justify-content:center"><button class="btn" id="hearbtn" onclick="speakId('${(flat[sh.i]||{}).id||''}')">🔊 Hear this word</button>
        ${earAvailable()?`<button class="btn" id="earbtn" onclick="earSheet()">🎤 Read it to the robot</button>`:''}
        ${cloudAvailable()&&familyCode()?`<button class="btn" onclick="sendWordClip(sh.items[sh.i],this)" ${RVW.saving?'disabled':''}>👂 Read it to ${esc(S.settings.parentWord||'my parent')}</button>`:''}
        <button class="btn ghost" onclick="sheetStop()">Stop</button></div>
      <div class="hint" id="shsay">${sh.earMsg||EAR_IOS_WARN||'Keyboard: ← for ✗, → for ✓'}</div>`
     : `<div class="toolbar" style="justify-content:center">
        <button class="btn primary" onclick="startSheetRun()">📖 Read this sheet out loud</button>
        <button class="btn" onclick="startListen()">Read &amp; Listen round →</button>
        <button class="btn ghost" onclick="go({name:'home'})">Back</button></div>
      <p class="sub" style="text-align:center;margin:8px 0 0">Go through the page word by word — every one counts towards his day, like any other exercise.</p>`}
  </div>`;
}
function earSheet(){
  if(!sh) return;
  const w=sh.items[sh.i];
  robotEar(w, (ok, heard)=>{
    if(!sh) return;
    if(ok===null){ sh.earMsg='🤖 '+heard; }
    else if(ok){ sh.earMsg='🤖 That sounded right! ✓'; sfx('turbo'); flashMatch(true);
      setTimeout(()=>{ const b=document.getElementById('mkH1'); if(b) b.style.outline='4px solid var(--accent)'; },50); }
    else { sh.earMsg='🤖 I\'m not sure — press 🔊 to hear it, then you decide 👂';
      const b=document.getElementById('hearbtn'); if(b){ b.classList.add('nudge'); setTimeout(()=>b.classList.remove('nudge'),4000); } }
    const el=document.getElementById('shsay'); if(el) el.textContent=sh.earMsg;
  });
}
document.addEventListener('keydown',e=>{ if(view.name!=='sheet'||!sh||!sh.started) return; if(e.key==='ArrowRight') sheetMark(true); if(e.key==='ArrowLeft') sheetMark(false); });


/* ============ SHABBOS SHEETS ============
   The one day the app cannot help him. A parent prints these on Friday and the
   learning carries on over Shabbos on paper: the words he keeps getting wrong,
   a fresh page of kriah, and whatever his rebbi sent home that week — the same
   material the app would have given him, in the same order of difficulty.

   Nothing on these pages asks anybody to write. He reads out loud and somebody
   listens; the answers for the listener sit at the foot of each page, small and
   upside of the way, so he is not reading them off the sheet. */
let SHB = { at:0 };
function shbLevelWords(){ return (BY_LEVEL[S.settings.level]||[]).slice(); }
/* the ones he gets wrong, worst first — and if he is new, the ones he has not met */
function shbWeak(n){
  const p=shbLevelWords();
  const seen=p.filter(w=>{ const s=S.stats[w.id]; return s && s.n>=2; });
  const weak=seen.filter(w=>S.stats[w.id].r<0.75).sort((a,b)=>S.stats[a.id].r-S.stats[b.id].r);
  const unseen=p.filter(w=>!S.stats[w.id] || !S.stats[w.id].n);
  return weak.concat(unseen).slice(0, n);
}
function shbFresh(n, skip){
  const used={}; (skip||[]).forEach(w=>used[w.id]=1);
  const p=shbLevelWords().filter(w=>!used[w.id]);
  return shuffle(p).slice(0, n);
}
function shbHomework(){
  return hwEntries().slice(0, 4).map(x=>({ name:x.name, lines:x.lines.slice(0, 40) }));
}
function shabbosGo(){ try{ hwFetch(); }catch(e){} SHB.at=Date.now(); view.shbPrinted=false; go({name:'shabbos'}); }

function shbPage(title, sub, body, key){

}

  return fri.toLocaleDateString(undefined,{month:'long', day:'numeric', year:'numeric'});

/* a grid of words to read, numbered, with the sounds for the listener at the foot */
function shbWordGrid(words, opts){
  const o=opts||{};
  if(!words.length) return `<p class="shb-sub">Nothing to put here yet — once he has practised a few rounds this page fills itself.</p>`;
  const cls='heb'+(o.rashi?' rashi':'');

function shbLineList(lines){

function renderShabbos(){

/* ============ PARENT ============ */
function mclass(m){ if(m==null) return 'm0'; if(m<0.45) return 'm1'; if(m<0.75) return 'm2'; return 'm3'; }

/* ============ PROGRESS REPORT ============ */
function repAcc(k){ const a=(S.acc||{})[k]; if(a&&a.n) return a; let n=0,c=0,sec=0; for(const x of S.sessions){ if(x.kind!=='bonus'&&x.n>0&&dkey(new Date(x.t))===k){ n+=x.n; c+=x.c; sec+=(x.secs||0); } } return n?{n,c,s:sec}:null; }
function repRange(){
  if(view.from&&view.to){ // custom calendar range, inclusive
    let a=new Date(view.from+'T12:00'), b=new Date(view.to+'T12:00');
    if(a>b){ const t=a; a=b; b=t; }
    const out=[]; const d=new Date(a); let guard=0;
    while(dkey(d)<=dkey(b)&&guard++<366){ const k=dkey(d); out.push({k, min:Math.round((S.time[k]||0)/60), words:S.days[k]||0, acc:repAcc(k)}); d.setDate(d.getDate()+1); }
    return out;
  }
  let days=view.range||14; if(!days){ const ks=Object.keys(S.time).concat(Object.keys(S.days)).sort(); if(ks.length){ const first=new Date(ks[0]); days=Math.min(365, Math.round((Date.now()-first.getTime())/86400000)+1); } else days=14; } const out=[]; const d=new Date(); d.setDate(d.getDate()-(days-1)); for(let i=0;i<days;i++){ const k=dkey(d); out.push({k, min:Math.round((S.time[k]||0)/60), words:S.days[k]||0, acc:repAcc(k)}); d.setDate(d.getDate()+1); } return out; }
function repSetCustom(){ const f=document.getElementById('repfrom'), t=document.getElementById('repto'); if(!f||!f.value||!t||!t.value) return; view.from=f.value; view.to=t.value; view.range=undefined; render(); }
function repDelta(cur, prev, unit, higherGood){ if(prev==null||cur==null) return ''; const d=cur-prev; if(Math.abs(d)<0.005) return '<small style="color:var(--ink3)">— same as before</small>'; const good=higherGood? d>0 : d<0; return `<small style="color:${good?'var(--good)':'var(--bad)'};font-weight:700">${d>0?'▲':'▼'} ${Math.abs(unit==='%'?Math.round(d*100):Math.round(d*10)/10)}${unit==='%'?' pts':unit} vs the period before</small>`; }
/* ---- how quickly he actually reads ----
   The child is never shown a clock. He reads the practice sheet at whatever
   pace he reads it at, and nothing on his screen ever counts the seconds -
   a stopwatch in front of a six-year-old who is unsure of a word makes him
   worse at it, not better. But the seconds are the most useful thing on that
   page for a PARENT: a word read in one second and a word laboured over for
   nine are both "right", and only this tells you which is which. So it is all
   kept, and all of it surfaces here instead. */
function sheetPaceHTML(days){
  const dset=new Set(days.map(d=>d.k));
  let n=0, sec=0, rounds=0;
  for(const x of (S.sessions||[])) if(x.kind==='sheet' && x.n>0 && dset.has(dkey(new Date(x.t)))){ n+=x.n; sec+=(x.secs||0); rounds++; }
  /* the words he labours over, from every sheet he has ever read, not just the last */
  const slow=WORDS.filter(w=>{ const st=S.stats[w.id]; return st && st.rt; })
    .map(w=>({ w, rt:S.stats[w.id].rt, m:mastery(w.id) }))
    .sort((a,b)=>b.rt-a.rt);
  if(!rounds && !slow.length) return '';
  const pace = n ? Math.round(10*sec/n)/10 : 0;
  const typical = slow.length ? slow.map(x=>x.rt).sort((a,b)=>a-b)[Math.floor(slow.length/2)] : 0;
  const labour = slow.filter(x=>x.rt >= Math.max(1.2, typical*1.8)).slice(0,12);

const SKILL_FEATS=[

  ['Patach — the "ah" sound', h=>/\u05B7/.test(h)],
  ['Tzeirei — the "ay" sound', h=>/\u05B5/.test(h)],
  ['Segol — the "eh" sound', h=>/\u05B6/.test(h)],
  ['Sheva', h=>/\u05B0/.test(h)],
  ['Chirik — the "ee" sound', h=>/\u05B4/.test(h)],
  ['Cholam — the "oh" sound', h=>/[\u05B9\u05BA]/.test(h)],
  ['Shuruk & Kubutz — the "oo" sound', h=>/\u05BB/.test(h)||/\u05D5\u05BC/.test(h)],
  ['Chataf (short) vowels', h=>/[\u05B1-\u05B3]/.test(h)],
  ['Shin vs Sin dots', h=>/\u05E9\u05C2/.test(h)],
  ['Veis — ב without a dagesh ("v")', h=>/\u05D1(?!\u05BC)/.test(h)],
  ['Chaf — כ without a dagesh ("kh")', h=>/[\u05DA]|\u05DB(?!\u05BC)/.test(h)],
  ['Fey — פ without a dagesh ("f")', h=>/[\u05E3]|\u05E4(?!\u05BC)/.test(h)],
  ['Sav — ת without a dagesh ("s")', h=>/\u05EA(?!\u05BC)/.test(h)],
  ['Final letters (ם ן ץ ף ך)', h=>/[\u05DD\u05DF\u05E5\u05E3\u05DA]/.test(h)],
  ['Longer words (5+ letters)', h=>h.replace(/[^\u05D0-\u05EA]/g,'').length>=5],

function skillAnalysis(){
  const attempted=WORDS.filter(w=>{ const st=S.stats[w.id]; return st&&st.n>=2; });
  let N=0,C=0; for(const w of attempted){ N+=S.stats[w.id].n; C+=S.stats[w.id].c; }
  if(N<30) return { ready:false, need:30-N };
  const overall=C/N; const rows=[];
  for(const [name,test] of SKILL_FEATS){
    let n=0,c=0,words=0;
    for(const w of attempted){ if(test(w.heb||w.h)){ const st=S.stats[w.id]; n+=st.n; c+=st.c; words++; } }
    if(words>=4&&n>=12) rows.push({ name, words, n, acc:c/n, delta:c/n-overall });
  }
  rows.sort((a,b)=>a.acc-b.acc);

      ${gone}

}

/* ============ AI weekly note (parent-facing) ============ */
/* The note is written on the server. The child's name is substituted there from
   the name we send, and is never given to the model itself. */
let AIN = { key:'', state:'idle', text:'', week:'' };   // idle | loading | ready | empty | off | error
function aiNoteFetch(){
  if(!cloudAvailable() || !familyCode()) { AIN={key:'',state:'off',text:'',week:''}; return; }
  const key = docKey();
  if(AIN.key===key && AIN.state!=='idle') return;
  AIN={ key, state:'loading', text:'', week:'' };
  fetch(API+'/ai/summary?family='+encodeURIComponent(key)+'&name='+encodeURIComponent(kidName()))
    .then(r=>r.json().then(j=>({ok:r.ok,j})))
    .then(({ok,j})=>{
      if(AIN.key!==key) return;
      if(!ok) AIN={key,state:'error',text:j.error||'not available',week:''};
      else if(j.off) AIN={key,state:'off',text:'',week:''};
      else if(j.empty) AIN={key,state:'empty',text:'',week:j.week||''};
      else AIN={key,state:'ready',text:j.text||'',week:j.week||''};
      if(view.name==='report') render();
    })
    .catch(e=>{ if(AIN.key===key){ AIN={key,state:'error',text:e.message,week:''}; if(view.name==='report') render(); } });
}
function aiNoteHTML(){
  if(AIN.state==='off') return '';           // no key configured — show nothing at all
  if(AIN.state==='loading') return `<div class="card ainote"><div class="ainote-h">✨ This week</div><p style="color:var(--ink3);margin:0">Writing this week's note…</p></div>`;
  if(AIN.state==='empty') return `<div class="card ainote"><div class="ainote-h">✨ This week</div><p style="color:var(--ink3);margin:0">Once he's practised a few rounds there'll be a short note here about how it's going.</p></div>`;
  if(AIN.state==='error') return `<div class="card ainote"><div class="ainote-h">✨ This week</div><p style="color:var(--ink3);margin:0">The note couldn't be written just now — it'll be back.</p></div>`;
  if(AIN.state!=='ready'||!AIN.text) return '';
  return `<div class="card ainote"><div class="ainote-h">✨ This week</div><p>${esc(AIN.text).replace(/\n+/g,'</p><p>')}</p></div>`;
}

/* ============ THE PARENT PORTAL ============
   Five tabs and eighteen headings asked a parent to go looking for the job they
   came to do. Four screens, each named for a job: what needs me today, what he
   practises, my recordings, everything else. Nothing was removed — the rare
   settings live behind a closed row instead of being scrolled past. */
const PTABS = [['today','🏠','Today'],['day','🗺️','His day'],['voice','🎙','My voice'],['feedback','💬','Feedback'],['more','⋯','More']];
const PTAB_MAP = { overview:'today', learning:'day', rewards:'more', account:'more',

/* A founding family's note is worth more to us than any setting on this page, so
   it gets a screen of its own rather than a box at the bottom of one. */
function fbPrompt(q){ const el=document.getElementById('fbtext');
  if(el){ el.value=(el.value?el.value.replace(/\s*$/,'')+'\n\n':'')+q+'\n'; el.focus();
    el.setSelectionRange(el.value.length, el.value.length); el.scrollIntoView({block:'center'}); } }
function ptabNorm(t){ return PTAB_MAP[t] || 'today'; }
/* The short list of things actually waiting for a parent — nothing else belongs
   at the top of the screen. Each one says what it is and has one button. */
function parentNeeds(){
  const out=[];
  try{
    /* Count only the level he is ON. The total across every level is a four-figure
       number that reads as an impossible chore; what actually matters today is the
       handful of words his own games will draw from. */
    const lvl=S.settings.level, mine=BY_LEVEL[lvl]||[];
    const left=mine.filter(w=>!REC.ids.has(w.id)).length;
    if(REC.loaded && left>0) out.push({ ic:'🎙', b:left+' words still to record for his level',
      s:(REC.house.size&&houseOK())?'Our standard voice is filling in until you do'

        <b>3. The lines</b>

        ${x.status==='ready'&&hwEntryOf('HW_'+x.id)?(()=>{ const t=hwEntryOf('HW_'+x.id), n=hwPickedLines(t).length, tot=t.lines.length;

      <div class="setrow" style="border-top:1px dashed var(--line);margin-top:10px;padding-top:12px;flex-wrap:wrap">

      <div class="setrow"><div><b>Sound effects</b></div><div class="seg"><button class="${S.settings.sfx!==false?'on':''}" onclick="S.settings.sfx=true;save();render()">On</button><button class="${S.settings.sfx===false?'on':''}" onclick="S.settings.sfx=false;save();render()">Off</button></div></div>
      <div class="setrow"><div><b>Weekly progress note</b><br><small>A short write-up of how the week went — at the top of the report, and emailed to you on Sunday morning. Only his practice numbers are used; his name never leaves our server.</small></div><div class="seg"><button class="${S.settings.aiEmail!==false?'on':''}" onclick="S.settings.aiEmail=true;save();toast('Weekly note on');render()">On</button><button class="${S.settings.aiEmail===false?'on':''}" onclick="S.settings.aiEmail=false;save();toast('Weekly email off');render()">Off</button></div></div>
      <div class="setrow"><div><b>Words per round</b></div><div class="seg">${[6,10,15].map(n=>`<button class="${S.settings.roundLen===n?'on':''}" onclick="S.settings.roundLen=${n};save();render()">${n}</button>`).join('')}</div></div>
      ${LANGS_ENABLED?`<div class="setrow"><div><b>Language / שפה / Idioma</b><br><small>English · עברית · Español</small></div><div class="seg">${[['en','English'],['he','עברית'],['es','Español']].map(([k,l])=>`<button class="${appLang()===k?'on':''}" onclick="setLang('${k}')">${l}</button>`).join('')}</div></div>`:''}
      <div class="setrow"><div><b>Racing coach</b><br><small>Who shows ${esc(kidName())} around and cheers him on</small></div><div class="seg"><button class="${S.settings.mascot==='boy'?'on':''}" onclick="S.settings.mascot='boy';save();render()">🏎️ Uri</button><button class="${S.settings.mascot==='girl'?'on':''}" onclick="S.settings.mascot='girl';save();render()">🏎️ Rivky</button></div></div>
      <div class="setrow"><div><b>App version</b><br><small>If a fix doesn't seem to show up, check this changed after deploying</small></div><span class="pill">${APP_VERSION}</span></div>
      <div class="setrow"><div><b>Reset all progress</b><br><small>Clears mastery, points, time and history on this device</small></div><div>${view.confirmAll?`<button class="btn danger" onclick="resetAll()">Yes, erase everything</button> <button class="btn ghost" onclick="view.confirmAll=false;render()">Cancel</button>`:`<button class="btn" onclick="view.confirmAll=true;render()">Reset…</button>`}</div></div>
    </div>
    </details>
    `:''}<div class="toolbar" style="justify-content:center;margin-top:16px"><button class="btn primary" onclick="go({name:'home'})">Back to practice</button></div>`;
}
function addSkipDay(){ const k=document.getElementById('skipdate').value; if(!/^\d{4}-\d{2}-\d{2}$/.test(k)){ toast('Pick a date first'); return; } const why=(document.getElementById('skipwhy').value||'').trim(); S.excused[k]=why||1; save(); toast('Marked '+fmtDay(k)+' as a day off'); render(); }
function resetDay(k){ delete S.time[k]; delete S.days[k]; delete S.chores[k]; delete S.celebrated[k]; if(S.forced) delete S.forced[k]; view.confirmReset=null; save(); toast('Reset '+fmtDay(k)); render(); }
async function sendFeedback(){
  const el=document.getElementById('fbtext'); const text=((el&&el.value)||'').trim();
  if(text.length<3){ toast('Write us a note first 🙂'); return; }
  try{
    await api('/feedback',{ text, cat:view.fbcat||'other', child:kidName(), page:view.name||'parent', version:APP_VERSION, code:familyCode() });
    view.fbdraft=''; view.fbcat=null; view.fbsent=1; if(view.name==='parent') render();
    toast('💌 Sent — thank you!');
    setTimeout(()=>{ if(view.fbsent){ delete view.fbsent; if(view.name==='parent') render(); } },5000);
  }catch(e){ view.fbdraft=text; toast("Couldn't send it: "+e.message); }
}
function markDayDone(k){ S.forced=S.forced||{};
  const need=Math.max(0, goalSecs()-(S.time[k]||0)); // fill the timer to the full goal, remembering how much was added
  if(need) S.time[k]=(S.time[k]||0)+need;
  S.forced[k]=need||1;
  if(!S.celebrated[k]){ S.celebrated[k]=1; const gp=pv('ptsGoal',50); if(gp) addPoints(gp); toast('✓ '+fmtDay(k)+' — full '+S.settings.goalMin+' minutes credited'+(gp?' · +'+gp+' ★':'')); } else toast('✓ '+fmtDay(k)+' — full '+S.settings.goalMin+' minutes credited');
  save(); render(); }
function unmarkDayDone(k){ const add=S.forced?S.forced[k]:0;
  if(add>1){ const t2=Math.max(0,(S.time[k]||0)-add); if(t2) S.time[k]=t2; else delete S.time[k]; }
  if(S.forced) delete S.forced[k];
  if((S.time[k]||0)<goalSecs() && S.celebrated[k]){ delete S.celebrated[k]; const gp=pv('ptsGoal',50); if(gp) addPoints(-gp); }
  save(); toast('Un-marked '+fmtDay(k)); render(); }
function upcomingDaysOff(n){ const out=[]; const d=new Date(); for(let i=0;i<90&&out.length<n;i++){ const k=dkey(d); const h=dayOff(k); if(h) out.push([k,h]); d.setDate(d.getDate()+1); } return out; }
async function addChild(){ const n=(document.getElementById('newchild').value||'').trim(); if(!n) return; try{ const r=await api('/children',{action:'add',name:n}); const a=account(); a.children=r.children; setAccount(a); toast('Added '+n); render(); }catch(e){ toast(e.message); } }
async function renameChild(id){ const c=childList().find(x=>x.id===id); const n=prompt('Name for this child:', c?c.name:''); if(n===null) return; try{ const r=await api('/children',{action:'rename',id,name:n.trim()}); const a=account(); a.children=r.children; setAccount(a); if(id===childId()){ S.settings.childName=n.trim(); save(); } render(); }catch(e){ toast(e.message); } }
async function dropChild(id){
  if(view.confirmChild!==id){ view.confirmChild=id; render(); return; }
  view.confirmChild=null;
  try{ const r=await api('/children',{action:'remove',id}); const a=account(); a.children=r.children; setAccount(a); toast('Removed'); render(); }
  catch(e){ toast('Could not remove: '+e.message); render(); } }
async function carPickFile(){ const inp=document.getElementById('carfile'); if(inp) inp.click(); }
async function carUpload(input){
  const file=input.files&&input.files[0]; input.value=''; if(!file) return;
  const used=customCars(); if(used.length>=8){ toast('You already have 8 custom cars — delete one first.'); return; }
  let slot=null; for(let k=1;k<=8;k++){ const id='p'+String(k).padStart(4,'0'); if(!REC.ids.has(id)){ slot=id; break; } }
  try{
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
    const scale=Math.min(1, 512/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.max(1,Math.round(img.width*scale)); cv.height=Math.max(1,Math.round(img.height*scale));
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
    const r=await fetch(API+'/audio/'+slot,{method:'PUT',headers:{'Content-Type':'image/png','X-Family':familyCode()},body:blob});
    if(!r.ok) throw new Error('upload failed');
    REC.ids.add(slot); REC.v=Date.now(); toast('🏎️ Car added — he can pick it in the Garage!'); render();
  }catch(e){ toast('Could not add that picture: '+(e.message||'try a different one')); }
}
async function carDelete(id){
  try{ const r=await fetch(API+'/audio/'+id,{method:'DELETE',headers:{'X-Family':familyCode()}}); if(!r.ok) throw 0;
    REC.ids.delete(id); if(S.car===id){ S.car=0; save(); } REC.v=Date.now(); toast('Removed'); render(); }
  catch(e){ toast('Could not remove it — try again'); }
}
function addChore(){ const el=document.getElementById('newchore'); const v=(el.value||'').trim(); if(!v) return; S.settings.choreList.push(v);
  const pe=document.getElementById('newchorepts'); const p=pe?parseInt(pe.value,10):NaN;
  if(!isNaN(p)&&p>=0&&p!==pv('chorePts',5)){ S.settings.chorePtsMap=S.settings.chorePtsMap||{}; S.settings.chorePtsMap[v]=p; }
  save(); render(); }
function modeName(k){ return {listen:'Read & Listen',read:'Read it',speed:'Speed Row',rashi:'Rashi letters',rwords:'Rashi words',gemara:'Gemara words',siddur:'Siddur',bonus:'⭐ From my parent'}[k]||k; }
function fmtWhen(t){ const d=new Date(t), now=new Date(); const same=d.toDateString()===now.toDateString(); return (same?'Today':d.toLocaleDateString(undefined,{month:'short',day:'numeric'}))+' '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function resetAll(){ try{localStorage.removeItem(KEY);}catch(e){} S=load(); save(); go({name:'home'}); }

/* ============ CONFETTI ============ */
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'); c.hidden=false; c.width=innerWidth; c.height=innerHeight; const x=c.getContext('2d');
  const cols=['#F0C458','#B07C0A','#1F8A4C','#4CC57F','#FFFFFF','#2F6BFF','#E63946']; const ps=Array.from({length:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,v:2+Math.random()*3,r:4+Math.random()*5,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*2-1}));
  let f=0; const t=setInterval(()=>{ x.clearRect(0,0,c.width,c.height); for(const p of ps){ p.y+=p.v; p.x+=Math.sin(p.a+=0.05)*p.w; x.fillStyle=p.c; x.fillRect(p.x,p.y,p.r,p.r*1.6);} if(++f>110){clearInterval(t);c.hidden=true;} },16);
}
/* ============ DEMO MODE ============
   mytorahhelper.com/?demo=1 fills a brand-new family with four weeks of realistic
   practice so the whole app — reports, charts, weak spots, the weekly note — can be
   tried without signing up. It never touches an existing family: it makes its own
   code, and asks first if one is already in use. */
function seedDemo(){
  const existing = (typeof familyCode==='function' && familyCode()) || '';
  if(existing && !/^DEMO-/.test(existing) &&
     !confirm('Load the demo family?\n\nYour own family ('+existing+') stays exactly as it is — this just switches this device over to a demo. Enter your family code again to switch back.')) return false;
  const code='DEMO-'+Math.random().toString(36).slice(2,7).toUpperCase();
  /* Put the real account somewhere safe first. The demo needs its own family code,
     and familyCode() prefers the account's code, so the account has to step aside —
     but it must come back, not be destroyed. */
  try{ const acc=account(); if(acc) localStorage.setItem('my-torah-helper.demo-backup', JSON.stringify({acc, code:existing||''})); }catch(e){}
  try{ setAccount(null); }catch(e){}
  setFamilyCode(code); setChildId('c1');
  try{ localStorage.removeItem(KEY); }catch(e){}
  S=load();
  S.settings.demo=true; S.settings.mascot='boy'; S.settings.obBasics=true;
  S.settings.childName='Uri'; S.settings.level='m'; S.settings.goalMin=15;
  S.settings.rashi=true; S.settings.gemara=true; S.settings.pin='';
  S.points=430; S.lifetime=1180; S.unlocked=[0,1,2,3]; S.car=2;
  S.prizes=[{id:'p1',name:'Ice cream trip',cost:500,given:false,claimed:false},
            {id:'p2',name:'Motzei Shabbos late night',cost:900,given:true,claimed:false}];
  /* four weeks of days: gradually more minutes, gradually better accuracy, faster answers */
  const d=new Date(); S.acc=S.acc||{}; S.time=S.time||{}; S.days=S.days||{}; S.timeAct={}; S.timeEx={};
  for(let i=0;i<28;i++){
    const k=dkey(d); const dow=new Date(k+'T12:00').getDay();
    d.setDate(d.getDate()-1);
    if(dow===6) continue;                       // Shabbos
    if(i>2 && i%9===0) continue;                // the odd day off
    const f=(28-i)/28;                           // 0 = a month ago, 1 = today
    const mins=Math.round(9+9*f), n=Math.round(16+16*f);
    S.time[k]=mins*60; S.days[k]=Math.round(14+22*f);
    S.acc[k]={ n, c:Math.round(n*(0.62+0.26*f)), s:Math.round(n*(5.2-2.3*f)) };
    S.timeAct[k]={ kriah:Math.round(mins*60*0.6), siddur:Math.round(mins*60*0.25), chumash:Math.round(mins*60*0.15) };
    S.timeEx[k]={ listen:Math.round(mins*60*0.3), drill:Math.round(mins*60*0.2), speed:Math.round(mins*60*0.1) };
  }
  /* word history — deliberately weak on the sheva so the skills analysis has something true to find */
  S.stats={};
  WORDS.slice(0,150).forEach((w,i)=>{
    const hard=/ְ/.test(w.h);                       // sheva
    const seen=3+(i%4);
    const rate=hard ? 0.25+((i%3)*0.05) : 0.72+((i%5)*0.05);
    S.stats[w.id]={ n:seen, c:Math.round(seen*rate), r:Math.min(0.97,Math.max(0.08,rate+(i%7===0?-0.2:0.04))), last:Date.now()-(i%9)*864e5 };
  });
  RLETTERS.slice(0,18).forEach((l,i)=>{ S.stats[l.id]={ n:4, c:i%6?3:1, r:i%6?0.85:0.3, last:Date.now() }; });
  S.sessions=[]; const now=Date.now();
  for(let i=0;i<26;i++) S.sessions.push({ kind:['listen','drill','speed','siddur','rashi'][i%5],
    n:10, c:7+(i%4), secs:150+(i%5)*30, t:now-i*0.7*864e5 });
  save();
  try{ if(typeof cloudConnect==='function') cloudConnect(); }catch(e){}
  go({name:'home'});
  setTimeout(()=>toast('🎬 Demo family '+code+' — four weeks of practice loaded'),400);
  return true;
}
function demoBackup(){ try{ return JSON.parse(localStorage.getItem('my-torah-helper.demo-backup')||'null'); }catch(e){ return null; } }
function exitDemo(){
  const b=demoBackup();
  try{ localStorage.removeItem(KEY); }catch(e){}
  try{ localStorage.removeItem('my-torah-helper.demo-backup'); }catch(e){}
  if(b&&b.acc){ setAccount(b.acc); if(b.code) setFamilyCode(b.code); toast('👋 Back to your own family'); }
  else { try{ localStorage.removeItem(CODE_KEY); }catch(e){} }
  S=load(); window.parentOK=false; go({name:'home'});
  try{ if(typeof cloudConnect==='function') cloudConnect(); }catch(e){}
}
try{ if(/[?&]demo=1/.test(location.search)) seedDemo(); }catch(e){ console.error('demo seed failed', e); }
/* a family that came back from the demo the short way (typing their code again,
   rather than pressing "Leave demo") should not be told they are in a demo */
demoClean();

if('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged=()=>{loadVoices(); if(view.name==='home'||view.name==='parent') render();}; }
cloudConnect();
if(typeof loadRecordings==='function') loadRecordings();
render();
</script>
