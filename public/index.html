.phero-big span{font-size:17px;font-weight:700;opacity:.85}
.phero-sub{font-size:14px;font-weight:600;opacity:.95}
.phero-bar{height:10px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;margin:10px 0 8px}
.phero-bar i{display:block;height:100%;background:#fff;border-radius:99px}
.phero-car{width:76px;height:44px;flex:0 0 auto}
.phero-car .carimg,.phero-car .carimg img{width:100%;height:100%;object-fit:contain}
.pneed-ic{flex:0 0 auto;width:36px;height:36px;border-radius:12px;background:var(--sun-soft);
  display:flex;align-items:center;justify-content:center;font-size:18px}
/* everything a parent touches once a year, one tap deeper */
.foldrow{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 10px;
  box-shadow:var(--shadow-sm);overflow:hidden}
.foldrow > summary{cursor:pointer;padding:13px 16px;font-weight:800;font-size:15px;list-style:none;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.foldrow > summary::-webkit-details-marker{display:none}
.foldrow > summary::after{content:"⌄";margin-left:auto;color:var(--ink3);font-weight:900;font-size:17px}
.foldrow[open] > summary::after{content:"⌃"}
.foldrow > summary small{color:var(--ink3);font-weight:600;font-size:12.5px;flex-basis:100%}
.foldrow[open] > summary{border-bottom:1px solid var(--line);background:var(--card2)}
.foldrow > :not(summary){margin-left:14px;margin-right:14px}
.foldrow > h2{font-size:17px;margin:14px 0 8px}
/* the parent's route builder */
.rt-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.rt-row:first-child{border-top:0}
.rt-n{flex:0 0 26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.rt-row.rt-sub{margin-left:4px;border-top:0;padding:5px 0}
/* the second-level choice: which games sit inside kriah */
.rt-exbox{margin:2px 0 8px 26px;padding:10px 12px;border-left:3px solid var(--accent-soft);
  background:var(--card2);border-radius:0 12px 12px 0}
.rt-n.small{background:none;color:var(--ink3);font-size:15px}
.rt-subhead{margin:6px 0 2px 26px;color:var(--ink3);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
.rt-name{flex:1;min-width:120px;font-weight:700}
.rt-ar{display:flex;flex-direction:column;gap:2px}
.rt-ar button{padding:1px 7px;font-size:11px;line-height:1.4;border-radius:6px}

@media (max-width:400px){
  .s-go-tx b{font-size:33px} .s-go-ic{font-size:48px} .s-grid{gap:9px} .s-tile{min-height:100px}
}
/* today's missions checklist on the kid home */
.missionbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin:14px 0;box-shadow:var(--shadow-sm)}
.missionbox h3{margin:0 0 10px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
.missionbox h3 span{font-size:12.5px;font-weight:800;color:var(--accent)}
.missions{display:flex;flex-wrap:wrap;gap:8px}
.mission{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:999px;font-size:13.5px;font-weight:700;border:1.5px solid}
.mission.todo{background:#FEE9E9;border-color:#E8737D;color:#B3242F}
.mission.ok{background:#E3F6EA;border-color:#4CBB78;color:#177A43;text-decoration:none}
.mascotwrap{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:44;display:flex;align-items:flex-end;gap:9px}
/* the invitation: small, readable, and it bobs a little so a child notices it */
.mascotwrap.quiet .mbubble{padding:8px 11px;max-width:150px}
.mcta{display:block;font-size:14px;font-weight:900;color:var(--accent-ink,#4036B6);line-height:1.25}
.magain{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:4px}
.mascotwrap.quiet img{animation:coachbob 2.6s ease-in-out infinite}
@keyframes coachbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){ .mascotwrap.quiet img{animation:none} }
.mascotwrap img{height:132px;width:132px;border-radius:50%;border:4px solid var(--card);box-shadow:0 10px 26px rgba(30,40,90,.28);cursor:pointer;background:#EEE9FF;object-fit:cover}
.mbubble{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 4px 18px;padding:11px 13px;max-width:215px;font-size:14px;line-height:1.4;color:var(--ink);box-shadow:var(--shadow);margin-bottom:34px;cursor:pointer}
.mbubble b{color:var(--accent-ink)}
.mbubble small{display:block;color:var(--ink3);font-size:11px;margin-top:4px}
@media(max-width:560px){.mascotwrap img{height:96px;width:96px}.mbubble{max-width:165px;font-size:12.5px;margin-bottom:22px}}
.mascotwrap.mini img{height:82px;width:82px;border-width:3px}
.mascotwrap.mini .mbubble{max-width:172px;font-size:12.5px;padding:8px 10px;margin-bottom:14px}
@media(max-width:560px){.mascotwrap.mini img{height:64px;width:64px}.mascotwrap.mini .mbubble{max-width:135px;font-size:11.5px}}
.coachpick{position:fixed;inset:0;background:rgba(16,22,50,.55);backdrop-filter:blur(6px);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.coachpick .inner{background:var(--card);border-radius:26px;padding:28px 24px;max-width:560px;width:100%;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.coachpick h2{margin:0 0 4px;font-size:26px}
.coachpick p{color:var(--ink2);margin:0 0 18px}
.coachcards{display:flex;gap:16px;justify-content:center}
.coachcard{flex:1;max-width:220px;background:var(--card2);border:2px solid var(--line);border-radius:22px;padding:18px 12px;cursor:pointer;transition:.15s ease;font:inherit}
.coachcard:hover{transform:translateY(-3px);border-color:var(--accent)}
.coachcard img{width:132px;height:132px;border-radius:50%;object-fit:cover;background:#EEE9FF;box-shadow:0 8px 20px rgba(30,40,90,.2)}
.coachcard b{display:block;font-size:19px;margin:10px 0 3px}
.coachcard small{color:var(--ink2)}
/* full-bleed topbar that blends with the page (no boxy corners) */
#app>.topbar{background:transparent!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important;border-bottom:0!important}
#app>.topbar::before{content:'';position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100vw;background:color-mix(in srgb,var(--ground) 60%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--line) 45%,transparent);z-index:-1}
/* ---- landing / cover page ---- */
.landing{max-width:1020px;margin:0 auto;animation:fadein .4s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hero{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:30px;align-items:center;background:linear-gradient(130deg,var(--card) 30%,var(--accent-soft) 160%);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:36px 36px 32px;margin-top:14px;position:relative;overflow:hidden}
@media (max-width:700px){.hero{grid-template-columns:1fr;padding:26px 20px 24px}.hero .floaty{display:none}}
.hero::after{content:'תּוֹרָה';position:absolute;right:-30px;bottom:-58px;font-size:190px;font-weight:800;opacity:.05;pointer-events:none;font-family:'Frank Ruhl Libre','Noto Serif Hebrew',serif}
.hero h1{font-size:clamp(30px,4.8vw,46px);line-height:1.1;margin:10px 0 14px;letter-spacing:-.01em}
.hero h1 em{color:var(--accent-ink);font-style:normal}
.hero .lead{font-size:clamp(15px,2vw,18px);color:var(--ink2);margin:0 0 22px;max-width:48ch;line-height:1.55}
.herocta{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn.big{font-size:17px;padding:15px 24px;border-radius:15px}
.heropill{display:inline-block;background:var(--accent-soft);color:var(--accent-ink);border-radius:16px;padding:7px 15px;font-size:13.5px;font-weight:700;line-height:1.45;max-width:48ch}
.phonemock{flex:0 0 235px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:18px 16px 16px;transform:rotate(2.5deg);position:relative;z-index:1}
.phonemock .mtrack{height:34px;border-radius:10px;background:var(--track);position:relative;overflow:hidden;margin-top:12px}
.phonemock .mtrack::before{content:'';position:absolute;left:0;right:0;top:50%;border-top:2px dashed var(--track-line);opacity:.8}
.phonemock .mcar{position:absolute;top:58%;transform:translateY(-52%);animation:drive 5s linear infinite}
@keyframes drive{from{left:-26px}to{left:105%}}
.featgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
@media(max-width:860px){.featgrid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.featgrid{grid-template-columns:1fr}}
.feat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;box-shadow:var(--shadow);transition:transform .15s ease}
.feat:hover{transform:translateY(-3px)}
.feat .femoji{font-size:34px;line-height:1}
.feat b{display:block;margin:10px 0 5px;font-size:16px}
.feat small{color:var(--ink2);font-size:13.5px;line-height:1.5;display:block}
.landsec{margin-top:26px}
.landsec h2{text-align:center;font-size:clamp(20px,3vw,27px);margin:0 0 4px}
.landsec .sub{text-align:center;margin:0 auto 14px}
.ctaband{margin:28px 0 20px;background:linear-gradient(130deg,var(--track),#1c2740);color:#F0F3FA;border-radius:24px;padding:0 0 34px;text-align:center;box-shadow:var(--shadow);overflow:hidden}
.ctaband .inner{padding:26px 26px 0}
.ctaband h2{margin:0 0 8px;font-size:clamp(21px,3vw,28px)}
.ctaband p{color:#B7C0D3;margin:0 auto 18px;max-width:52ch}
/* racing extras */
.checker{height:14px;background:conic-gradient(#10182B 90deg,#F5F7FB 0 180deg,#10182B 0 270deg,#F5F7FB 0) 0 0 / 18px 18px}
.racestrip{position:relative;height:78px;border-radius:18px;background:linear-gradient(180deg,#182042 0%,#10162e 55%,#0c1226 100%);overflow:hidden;margin:28px 0 4px;box-shadow:inset 0 2px 10px rgba(0,0,0,.55),0 14px 30px rgba(16,22,46,.25)}
.racestrip::before{content:'';position:absolute;left:0;right:0;top:50%;height:0;border-top:2px dashed rgba(255,255,255,.30)}
.racestrip::after{content:'';position:absolute;right:14px;top:0;bottom:0;width:16px;background:conic-gradient(#0c1226 90deg,#EDF1FA 0 180deg,#0c1226 0 270deg,#EDF1FA 0) 0 0/8px 8px;opacity:.9}
.racestrip{border-top:3px solid #FFD54A;border-bottom:3px solid #FFD54A}
.racestrip .rcar{position:absolute;top:50%;transform:translateY(-58%);animation:drive linear infinite;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.racestrip .rcar.lane2{top:26%}
.racestrip .rcar.lane3{top:74%}
.floaty{position:absolute;font-size:32px;opacity:.55;animation:floaty 5s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-14px) rotate(8deg)}}
.feat{position:relative}
.feat:nth-child(1){background:linear-gradient(0deg,rgba(240,196,88,.14),rgba(240,196,88,.14)),var(--card)}
.feat:nth-child(2){background:linear-gradient(0deg,rgba(122,162,247,.13),rgba(122,162,247,.13)),var(--card)}
.feat:nth-child(3){background:linear-gradient(0deg,rgba(76,197,127,.13),rgba(76,197,127,.13)),var(--card)}
.feat:nth-child(4){background:linear-gradient(0deg,rgba(240,101,90,.11),rgba(240,101,90,.11)),var(--card)}
.feat:nth-child(5){background:linear-gradient(0deg,rgba(186,130,240,.13),rgba(186,130,240,.13)),var(--card)}
.feat:nth-child(6){background:linear-gradient(0deg,rgba(240,160,70,.14),rgba(240,160,70,.14)),var(--card)}
.feat .femoji{font-size:40px;display:inline-block;animation:floaty 6s ease-in-out infinite}
.feat:nth-child(2n) .femoji{animation-delay:1.2s}.feat:nth-child(3n) .femoji{animation-delay:2.4s}
.phonemock .mcar2{position:absolute;top:16%;transform:translateY(-40%);animation:drive 6.6s linear infinite;animation-delay:1s}
/* auth (sign in / sign up) */
.authwrap{width:100%;max-width:470px;min-width:0;margin:0 auto;animation:fadein .4s ease}
.authcard{background:linear-gradient(155deg,var(--card) 55%,var(--accent-soft) 175%);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:30px 28px 26px;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;margin-top:6px}
.authcard::after{content:'תּוֹרָה';position:absolute;right:-24px;bottom:-44px;font-size:130px;font-weight:800;opacity:.05;pointer-events:none;font-family:'Frank Ruhl Libre','Noto Serif Hebrew',serif}
.authhead{text-align:center;position:relative;z-index:1}
.authhead .heb{font-size:44px;color:var(--accent);font-weight:900;line-height:1}
.authhead h1{margin:8px 0 4px;font-size:25px;letter-spacing:-.01em}

    <circle cx="168" cy="49" r="10.5" fill="#0B0F1B"/><circle cx="168" cy="49" r="6" fill="#1E2536"/><circle cx="168" cy="49" r="3" fill="#A7B1C7"/>

/* ============ SPEECH (Ashkenazi via English voice) ============ */
function englishPhonetic(t){
  return t.split('-').map(syl=>{
    let s=syl;
    s=s.replace(/ch/g,'kh').replace(/tz/g,'ts');
    s=s.replace(/'/g,'UH');
    s=s.replace(/aw/g,'AW').replace(/ay/g,'AY').replace(/ee/g,'EE').replace(/eh/g,'EH').replace(/ah/g,'AH').replace(/ai/g,'AI').replace(/oy/g,'OY');
    s=s.replace(/o/g,'OH').replace(/u/g,'OO');
    s=s.replace(/i$/,'EE').replace(/i/g,'IH');
    s=s.replace(/a$/,'AH');
    s=s.replace(/e/g,'EH');
    return s.toLowerCase();
  }).join('-');
}
const CHOLAM='ֹ', KAMATZ='ָ', TZEIREI='ֵ', SEGOL='ֶ', CH_KAMATZ='ֳ';
function ashkenaziSpelling(h){
  let s=h.replace(/ת(?![֑-ׇֻֽֿׁׂׅׄ]*ּ)/g,'ס');
  s=s.replace(new RegExp(KAMATZ,'g'),CHOLAM).replace(new RegExp(CH_KAMATZ,'g'),CHOLAM);
  s=s.replace(new RegExp(TZEIREI+'(?!י)','g'),SEGOL+'י');
  return s;
}
function wholeWordSpelling(h){
  const MARK=/[֑-ׇֻֽֿׁׂׅׄ]/; let out='';
  for(let i=0;i<h.length;){
    const base=h[i++]; let marks='';
    while(i<h.length && MARK.test(h[i])) marks+=h[i++];
    const next=h[i]||''; let mater='';
    if(marks.includes(CHOLAM)) mater='ו'; else if(marks.includes('ֻ')) mater='ו'; else if(marks.includes('ִ')) mater='י';
    if(mater && (base===mater || next===mater)) mater='';
    out+=base+mater;
  }
  return out;
}
/* ---- recorded audio (parent's own voice) ---- */
const REC = {ids:new Set(), house:new Set(), loaded:false, cache:{}, fam:null, busy:false};
/* Two questions that are NOT the same, and were conflated before:
   - hasOwn(id)  : did THIS parent record it? The robot ear may only ever compare a
                   child to their own parent, so it must ask this one.
   - canPlay(id) : is there any recording to play? Own first, then the house voice,
                   which is what lets a family use the app on day one. */
function hasOwn(id){ return REC.ids.has(id); }
function houseOK(){ try{ return S.settings.houseVoice!==false; }catch(e){ return true; } }
function canPlay(id){ return REC.ids.has(id) || (houseOK() && REC.house.has(id)); }
function usingHouse(id){ return !REC.ids.has(id) && houseOK() && REC.house.has(id); }
function loadRecordings(tryN){ if(typeof API==='undefined'||!API) return;
  const fam=familyCode();
  if(!fam){ setTimeout(()=>loadRecordings(0), 3000); return; }
  if(REC.busy) return; REC.busy=true;
  fetch(API+'/audio?family='+encodeURIComponent(fam)+'&t='+Date.now()).then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(r=>{ REC.ids=new Set(r.ids||[]); REC.house=new Set(r.house||[]); REC.loaded=true; REC.fam=fam; REC.busy=false; if(view.name==='voicetest'&&!vt.word) vtPick(); if(view.name==='parent'||view.name==='record'||view.name==='voicetest'||view.name==='home') render(); })
    .catch(()=>{ // e.g. app opened while the server is restarting after a deploy: NEVER give up —

/* automatic Hebrew -> Ashkenazi-English transliteration for whole lines, so the
   "Ashkenazi" (English) voice can read siddur/tehillim lines with an American havara */
function hebLineTranslit(h){
  const C={'\u05d0':'','\u05d1':'v','\u05d2':'g','\u05d3':'d','\u05d4':'h','\u05d5':'v','\u05d6':'z','\u05d7':'ch','\u05d8':'t','\u05d9':'y','\u05db':'ch','\u05da':'ch','\u05dc':'l','\u05de':'m','\u05dd':'m','\u05e0':'n','\u05df':'n','\u05e1':'s','\u05e2':'','\u05e4':'f','\u05e3':'f','\u05e6':'tz','\u05e5':'tz','\u05e7':'k','\u05e8':'r','\u05e9':'sh','\u05ea':'s'};

  return words.map(w=>{
    let out='';
    for(let i=0;i<w.length;i++){
      const ch=w[i];
      if(C[ch]===undefined) continue;
      let cons=C[ch], dagesh=false, sin=false; const marks=[];
      while(i+1<w.length && /[\u05b0-\u05bc\u05c1\u05c2\u05c7]/.test(w[i+1])){ const m=w[++i];
        if(m==='\u05bc') dagesh=true; else if(m==='\u05c2') sin=true; else if(m!=='\u05c1') marks.push(m); }

      if(ch==='\u05e9') cons=sin?'s':'sh';
      if(ch==='\u05d5'&&dagesh&&!marks.length){ out+='oo'; continue; }          /* shuruk */
      if(ch==='\u05d5'&&marks.includes('\u05b9')){ out+='oy'; continue; }      /* cholam-vav */
      if(ch==='\u05d9'&&!marks.length&&/(ee|ay)$/.test(out)) continue;          /* mater yud */
      if(ch==='\u05d9'&&!marks.length&&/eh$/.test(out)){ out=out.slice(0,-2)+'ay'; continue; } /* segol-yud -> ay */
      if(ch==='\u05d4'&&!marks.length&&i===w.length-1) continue;                 /* silent final hey */

/* ---- the letter that says he has finished ---------------------------------
   The one message worth sending on an ordinary evening. A parent who is out
   gets it on their phone and knows the console can be handed over, or the bike,
   or whatever the deal is in that house, without opening anything or asking
   anybody. The server sends it once a day however many times we ask, and this

function dayDoneEmail(k){
  if(!API || !familyCode()) return;
  const day = k || todayKey();
  S.dayMailed = S.dayMailed || {};
  if(S.dayMailed[day]) return;
  S.dayMailed[day]=1; save();
  const parts=[];
  try{
    const g=actGoals(); for(const b in g){ const m=Math.round(actSecs(day,b)/60); if(m>0) parts.push((ACT_META[b]?ACT_META[b][1]:b)+' — '+m+' min'); }
    if(!parts.length){ const eg=exGoals(); for(const e in eg){ const m=Math.round(exSecs(day,e)/60); if(m>0) parts.push((EX_META[e]?EX_META[e][1]:e)+' — '+m+' min'); } }
  }catch(e){}
  fetch(API+'/day-done',{ method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ family:familyCode(), child:kidName(), day,
      minutes:Math.round((S.time[day]||0)/60), words:S.days[day]||0, streak:dayStreak(), parts })
  }).catch(()=>{});
}

let actx=null;
function tone(f,t,dur,type='sine',vol=.18){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type=type; o.frequency.setValueAtTime(f,actx.currentTime+t); g.gain.setValueAtTime(0,actx.currentTime+t); g.gain.linearRampToValueAtTime(vol,actx.currentTime+t+.01); g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+t+dur); o.connect(g).connect(actx.destination); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+dur+.05); }catch(e){} }
function sfx(kind){ if(S.settings.sfx===false) return;
  if(kind==='ok'){ tone(660,0,.12); tone(880,.1,.18); }
  else if(kind==='no'){ tone(220,0,.25,'triangle',.12); }
  else if(kind==='turbo'){ tone(523,0,.1); tone(659,.09,.1); tone(784,.18,.1); tone(1047,.27,.25); }
  else if(kind==='win'){ [523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.2)); }
  else if(kind==='tap'){ tone(440,0,.05,'square',.05); } }

/* ============ SELECTION ============ */
const recent=[];
function weight(it){ const s=S.stats[it.id]; if(!s||s.n===0) return 1.6; return 0.15+(1-s.r)*2.2; }
function pickWeighted(items, avoid=[]){
  const p=items.filter(i=>!avoid.includes(i.id)&&!recent.slice(-8).includes(i.id)); const list=p.length?p:items;
  let tot=0; const w=list.map(i=>{const x=weight(i); tot+=x; return x;});
  let r=Math.random()*tot; for(let i=0;i<list.length;i++){ r-=w[i]; if(r<=0){ recent.push(list[i].id); return list[i]; } }
  const x=list[list.length-1]; recent.push(x.id); return x;
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function pickMany(items,n){ const out=[],ids=[]; for(let i=0;i<Math.min(n,items.length);i++){ const it=pickWeighted(items,ids); out.push(it); ids.push(it.id);} return out; }
/* ---- wrong answers a child could actually believe ----------------------------
   A good distractor is what he WOULD say if he made one specific reading mistake:
   a kamatz read as a patach, a sav read as a tav, a sheva swallowed. Each rule is
   gated on the Hebrew actually containing that letter or vowel, so the wrong
   answers are always real misreadings of THIS word — never random letter soup he
   can rule out without reading. Second choice is a different real word that reads
   almost the same. Random words are only ever the last resort. */
/* optional: reviewed wrong answers generated offline (see gen_distractors.js).
   null when the file was never generated — the rules below cover the rest. */
const AI_DISTRACT = /*DISTRACT_JSON*/;
const KRIAH_SLIPS = [
  [/ָ/, 'aw', 'ah'],   [/ָ/, 'aw', 'o'],     /* kamatz read as patach / cholam */
  [/ַ/, 'ah', 'aw'],                              /* patach read as kamatz */
  [/ֵ/, 'ay', 'eh'],   [/ֶ/, 'eh', 'ay'],    /* tzeirei <-> segol */
  [/ִ/, 'ee', 'eh'],   [/ִ/, 'ee', 'ay'],    /* chirik flattened */
  [/[ֹֺ]/, 'o', 'oo'], [/וּ/, 'oo', 'o'],
  [/ת(?!ּ)/, 's', 't'], [/תּ/, 't', 's'],   /* sav <-> tav */
  [/ב(?!ּ)/, 'v', 'b'], [/בּ/, 'b', 'v'],   /* veis <-> beis */
  [/[ך]|כ(?!ּ)/, 'ch', 'k'], [/כּ/, 'k', 'ch'],
  [/[ף]|פ(?!ּ)/, 'f', 'p'], [/פּ/, 'p', 'f'],
  [/שׂ/, 's', 'sh'], [/שׁ/, 'sh', 's'],
  [/ג(?!ּ)/, 'g', 'j'],
];
function kriahSlips(it){
  const h = it.h || '', t = it.t || '', out = [];
  for(const [inHeb, right, wrong] of KRIAH_SLIPS){
    if(!inHeb.test(h)) continue;
    const i = t.indexOf(right); if(i < 0) continue;
    const s = t.slice(0, i) + wrong + t.slice(i + right.length);
    if(s !== t) out.push(s);
  }
  /* swallowing a sheva, or adding a syllable break that isn't there */
  if(/ְ/.test(h) && t.includes('-')) out.push(t.replace('-', ''));
  return [...new Set(out)];
}
let NEAR_CACHE = {};
function nearWords(it){
  if(NEAR_CACHE[it.id]) return NEAR_CACHE[it.id];
  const t = it.t || '', hits = [];
  for(const w of WORDS){ if(w.t === t) continue; const d = lev(w.t, t); if(d > 0 && d <= 2) hits.push({ t: w.t, d }); }
  hits.sort((a, b) => a.d - b.d);
  return NEAR_CACHE[it.id] = hits.map(x => x.t);
}
function mutateTranslit(t){
  const swaps=[['aw','ah'],['ah','aw'],['ay','eh'],['eh','ay'],['o','u'],['u','o'],['i','eh'],['ee','ay'],['s','t'],['v','b'],['ch','k'],['sh','s'],['tz','s'],['m','n'],['d','r'],['aw','o'],['e','a'],['a','aw'],['a','eh'],['k','g'],['f','p'],['y','v'],['l','r'],['n','m'],['t','s'],['b','v'],['oy','ay']];
  const parts=t.split('-'); const order=shuffle(parts.map((_,i)=>i));
  for(const idx of order){ for(const [a,b] of shuffle(swaps.slice())){ if(parts[idx].includes(a)){ const p=parts.slice(); p[idx]=p[idx].replace(a,b); const out=p.join('-'); if(out!==t) return out; } } }
  return t+'h';
}
function translitDistractors(it,n){
  const set=new Set(); const add=s=>{ if(s&&s!==it.t) set.add(s); };
  for(const s of shuffle(kriahSlips(it))){ if(set.size>=n) break; add(s); }
  if(set.size<n&&AI_DISTRACT&&AI_DISTRACT[it.id]) for(const s of shuffle(AI_DISTRACT[it.id].slice())){ if(set.size>=n) break; add(s); }
  if(set.size<n) for(const s of nearWords(it)){ if(set.size>=n) break; add(s); }
  /* only take a blind mutation if it still looks like something sayable */
  const sayable=s=>s&&!/(.)\1\1|ww|hh|yy|zz/.test(s)&&s!==it.t+'h';
  let g=0; while(set.size<n&&g++<60){ const m=mutateTranslit(it.t); if(sayable(m)) add(m); }
  let g2=0; while(set.size<n&&g2++<80){ const o=WORDS[Math.floor(Math.random()*WORDS.length)]; add(o.t); }
  return [...set].slice(0,n);
}

/* ---- Rashi: two things, not one ------------------------------------------
   Learning to READ the Rashi alphabet and learning to read WORDS printed in it
   are two different jobs, and a cheder does not always start them together -
   one class does letters all year, another is already reading Rashi inside the
   Chumash. So they are two switches. Either, both, or neither.

   Words were locked behind fourteen solid letters, which made sense while there
   was one switch and no way to say otherwise. A parent who turns the words on
   has said otherwise, so the lock goes.

   Old families have a single `rashi` flag; it decides both until a parent
   touches either switch, so nothing changes underneath anybody. */
function rashiLettersOn(){ const v=S.settings.rashiLetters; return v===undefined ? !!S.settings.rashi : !!v; }
function rashiWordsOn(){ const v=S.settings.rashiWords; return v===undefined ? !!S.settings.rashi : !!v; }
function rashiAnyOn(){ return rashiLettersOn() || rashiWordsOn(); }
function rashiExOn(k){ return k==='rletters' ? rashiLettersOn() : k==='rwords' ? rashiWordsOn() : true; }
function rashiSet(which, on){
  /* the first touch of either switch freezes what the old single flag meant, so
     turning words on cannot silently turn letters off */
  if(S.settings.rashiLetters===undefined) S.settings.rashiLetters=!!S.settings.rashi;
  if(S.settings.rashiWords===undefined) S.settings.rashiWords=!!S.settings.rashi;
  if(which==='letters') S.settings.rashiLetters=!!on; else S.settings.rashiWords=!!on;
  S.settings.rashi = rashiAnyOn();
  save();
  /* A switch that only unlocks a screen is not what a parent means by turning
     Rashi on — they mean the child should be doing it. Once his day is laid out
     as a lineup, nothing reaches his screen unless it is ON that lineup, so the
     switch puts it there (five minutes, tucked under kriah with the other kriah
     games) and takes it off again. The minutes are his to change afterwards. */
  rashiStopSet(which==='letters'?'rletters':'rwords', !!on);
  render();
}
/* five minutes a day unless the parent has already said otherwise */
function rashiStopSet(key, on){
  try{
    if(on){
      const l=route();
      /* a family with no lineup at all is left alone — everything open to him
         already shows on his home screen, and inventing a one-stop lineup would
         shut the rest of it */
      if(!l.length) return;
      if(l.some(x=>x.k===key)) return;
      const j=l.findIndex(x=>x.k===EX_PARENT);
      if(j<0) l.push({k:key, min:5});
      else { let p=j; while(p+1<l.length && ROUTE_STOPS[l[p+1].k] && ROUTE_STOPS[l[p+1].k].kind==='ex') p++;
             l.splice(p+1, 0, {k:key, min:5}); }
      routeSave(l);
    } else {
      /* only the lineup is touched. The old per-exercise minutes are left exactly
         as the parent set them — with the switch off it is filtered out of his day
         everywhere anyway, and turning it back on should find his minutes intact. */
      const raw=routeRaw();
      if(raw && raw.some(x=>x.k===key)) routeSave(raw.filter(x=>x.k!==key));
    }
  }catch(e){}
}

   But a child must never meet "the LORD spoke unto Moses" in the middle of his
   parsha, and there are two ways it can still happen: the five pages that carry
   a built-in word-by-word teitch were glossed with "Moses" and "Jacob", and if

const TEITCH_NAMES=[

  [/\b[Tt]he L-rd\b/g,'Hashem'], [/\bL-rd\b/g,'Hashem'],

  [/\bMoses\b/g,'Moshe'], [/\bAaron\b/g,'Aharon'], [/\bAbraham\b/g,'Avraham'], [/\bAbram\b/g,'Avram'],
  [/\bIsaac\b/g,'Yitzchok'], [/\bJacob\b/g,'Yaakov'], [/\bIsrael\b/g,'Yisroel'], [/\bJoseph\b/g,'Yosef'],
  [/\bJudah\b/g,'Yehudah'], [/\bReuben\b/g,'Reuven'], [/\bSimeon\b/g,'Shimon'], [/\bLevi\b/g,'Levi'],
  [/\bIssachar\b/g,'Yissochor'], [/\bZebulun\b/g,'Zevulun'], [/\bBenjamin\b/g,'Binyomin'],
  [/\bNaphtali\b/g,'Naftoli'], [/\bEphraim\b/g,'Efraim'], [/\bManasseh\b/g,'Menashe'],
  [/\bSarah\b/g,'Soroh'], [/\bRebecca\b/g,'Rivkah'], [/\bRachel\b/g,'Rochel'], [/\bLeah\b/g,'Leah'],
  [/\bEsau\b/g,'Eisov'], [/\bNoah\b/g,'Noach'], [/\bPharaoh\b/g,'Pharaoh'],
  [/\bEgypt\b/g,'Mitzrayim'], [/\bEgyptians\b/g,'Mitzriyim'], [/\bEgyptian\b/g,'Mitzri'],
  [/\bthe tabernacle\b/gi,'the Mishkan'], [/\bTabernacle\b/g,'Mishkan'],
  [/\bthe sabbath\b/gi,'Shabbos'], [/\bSabbath\b/g,'Shabbos'],
  [/\bunto\b/g,'to'], [/\bthou shalt\b/g,'you shall'], [/\bthee\b/g,'you'], [/\bthy\b/g,'your'],

function teitchNames(t){ let x=String(t||''); for(const [re,to] of TEITCH_NAMES) x=x.replace(re,to); return x; }
function splitPasuk(h){ // break each pasuk at its trop (esnachta, zakef…) — real phrase boundaries, mishna-style
  const segs=String(h).split('|').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x);
  const merged=[]; // fold tiny fragments into their neighbor
  for(const s of segs){
    if(merged.length && (s.split(' ').length<3 || merged[merged.length-1].split(' ').length<3)) merged[merged.length-1]+=' '+s;
    else merged.push(s); }
  const out=[];
  for(const s of merged){ const words=s.split(' ');
    if(words.length<=8){ out.push(s); continue; }
    const n=Math.ceil(words.length/6), size=Math.ceil(words.length/n);
    for(let i=0;i<words.length;i+=size) out.push(words.slice(i,i+size).join(' ')); }

function chumashLineList(pi,si){ const sec=CHUMASH[pi].sections[si];

function sefariaDirectTorah(book,c,key){
  const base='/api/texts/'+book+'.'+c+'?context=0&commentary=0';
  const tryV=p=>sefFetch(p).then(j=>{ const en=(Array.isArray(j.text)?j.text:[]).map(SEF_STRIP); if(!en.some(x=>x)) throw 0;
    if(Array.isArray(j.he)&&j.he.length&&en.length!==j.he.length) throw 0; // versification mismatch (e.g. Aseres Hadibros)
    return en; });

    .catch(()=>tryV(base).then(en=>chumashEnGot(key,en,'Sefaria'))
    .catch(()=>{ CHEN[key]='error'; if(sd&&sd.kind==='chumash'&&view.name==='siddur-read') render();

/* ---- Rashi, under the pasuk -----------------------------------------------

   as one thing. It is off until a parent switches it on, it opens only when the
   child asks for it, and it is never tested - Rashi is what you read once you
   can already read the pasuk, not another thing to be marked on. */
let CHR={}, CHRSRC={}, CHRTRY={};
function chumashRashiOn(){ return S.settings.chumashRashi===true; }
function fetchChumashRashi(book,c){ const key=book+'_'+c; if(CHR[key]||!API) return; CHR[key]='loading';
  /* ?v=2 since the Rashi began coming back in Hebrew as well as English — the
     answer is cached in his browser for a day, so without this he would keep
     being served yesterday's English-only copy long after the app was updated */
  fetch(API+'/text/rashi/'+book+'/'+c+'?v=2').then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(d=>{ CHR[key]=Array.isArray(d.rashi)?d.rashi:[]; CHRSRC[key]=d.src||'Sefaria';
      if(view.name==='siddur-read') render(); })
    .catch(()=>{ CHR[key]='error';
      CHRTRY[key]=(CHRTRY[key]||0)+1;
      if(CHRTRY[key]<=2) setTimeout(()=>{ if(CHR[key]==='error'){ delete CHR[key]; fetchChumashRashi(book,c); } }, 4000*CHRTRY[key]);
      if(view.name==='siddur-read') render(); }); }
function chumashRashiFor(d, line){

  fetchChumashRashi(sec.b, sec.c);
  const rows=CHR[sec.b+'_'+sec.c];
  if(rows==='loading') return {state:'loading'};
  if(rows==='error') return {state:'error'};
  if(!Array.isArray(rows)) return null;

  if(r.state==='error') return `<div class="chrashi"><small style="color:var(--ink3)">Rashi could not be loaded.</small></div>`;

let CHRETRY={};
function fetchChumashEn(book,c){ const key=book+'_'+c; if(CHEN[key]||!API) return; CHEN[key]='loading';
  fetch(API+'/text/torah/'+book+'/'+c+'?v=4').then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(d=>{ if(!d.en||!d.en.some(x=>x)) throw 0; chumashEnGot(key,d.en.map(SEF_STRIP),d.src||'Sefaria'); })

function chumashEnRetry(){ const sec=CHUMASH[sd.pi].sections[sd.si]; delete CHEN[sec.b+'_'+sec.c]; fetchChumashEn(sec.b,sec.c); render(); }
function attachChumashEn(){ if(!sd||sd.kind!=='chumash') return; const sec=CHUMASH[sd.pi].sections[sd.si];

/* Chumash is organised by parsha, and a parsha runs across two or three perakim.

function chumashPerakim(){ const pa=chumashPa(); if(!pa) return [];
  const all=chumashPerakimOf(pa); const p=S.settings.chumashPerakim;

/* ============ "READ IT TO MY PARENT" ============

   have a minute and marks it. It is not a robot judging him — it is a real ear,

let RD = { on:false, mr:null, chunks:[], t0:0, saving:false, msg:'', lastRef:'', tid:'', name:'', i0:0, i1:0, tick:null };

function rdSupported(){ try{ return !!(navigator.mediaDevices && window.MediaRecorder && cloudAvailable() && familyCode()); }catch(e){ return false; } }

function rdRange(){
  const a=Math.min(RD.i0,RD.i1), b=Math.max(RD.i0,RD.i1);

function rdLabel(){
  const r=rdRange();

function rdHeb(){
  try{
    const t=(pg&&pg.t&&pg.t.id===RD.tid)?pg.t:null; if(!t||!t.lines) return '';

function rdPaint(){
  const b=document.getElementById('rdbtn'), m=document.getElementById('rdmsg');

  const sec=rdElapsed(), r=rdRange(), left=RD_MAX_SECS-sec;
  if(b) b.textContent='⏹ Stop and save · '+rdClock(sec);

      +' — keep going, tap Next line as you read. Tap Stop when you are finished.'

function rdMark(){ if(RD.on && pg && pg.t && pg.t.id===RD.tid && typeof pg.i==='number' && pg.i>=0) RD.i1=pg.i; }

async function rdToggle(){
  if(RD.saving) return;
  if(RD.on){ rdStopIfOn(); return; }
  if(!rdSupported()){ rdSay('This device can\'t record.'); return; }
  const t=(pg&&pg.t)?pg.t:null;
  if(!t){ rdSay('Open a Tehillim page first.'); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4',''].find(m=>!m||MediaRecorder.isTypeSupported(m));
    const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined);
    RD.mr=mr; RD.chunks=[]; RD.on=true; RD.t0=Date.now();
    RD.tid=t.id; RD.name=t.name; RD.i0=Math.max(0, pg.i||0); RD.i1=RD.i0;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) RD.chunks.push(e.data); };
    mr.onstop=async()=>{
      try{ stream.getTracks().forEach(x=>x.stop()); }catch(e){}
      clearInterval(RD.tick); RD.tick=null;
      const secs=(Date.now()-RD.t0)/1000;
      const r=rdRange(), ref=RD.tid+':'+r.a+(r.n>1?'-'+r.b:''), label=rdLabel(), heb=rdHeb();
      RD.on=false; RD.saving=true; rdSay('Saving…'); renderSiddurPage();
      try{
        const blob=new Blob(RD.chunks, {type:(mr.mimeType||'audio/webm').split(';')[0]});
        if(blob.size<800){ RD.saving=false; rdSay('That was too short — hold on a bit longer.'); return renderSiddurPage(); }
        const res=await fetch(API+'/reading', { method:'POST',
          headers:{ 'Content-Type':blob.type||'audio/webm', 'X-Family':familyCode(),
                    'X-Child':kidName().slice(0,40), 'X-Ref':ref,
                    'X-Label':encodeURIComponent(label), 'X-Text':encodeURIComponent(String(heb).slice(0,300)),
                    'X-Secs':String(Math.round(secs*10)/10) },

        RD.saving=false;
        if(res.ok&&j.ok){ sfx('turbo'); rdSay('✅ '+(r.n>1?r.n+' lines saved':'Saved')+' for '+(S.settings.parentWord||'my parent')+' to hear!'); }

  if(q.kind==='flash'){

        ${earAvailable()?`<div class="toolbar" style="justify-content:center"><button class="btn" id="earbtn" onclick="earGemara()">🎤 Say the teitch to the robot</button></div>`:''}`
      :`<div class="toolbar" style="flex-direction:column;align-items:stretch;gap:10px"><button class="bigbtn hear" onclick="gr.flipped=true;renderGemaraRound()">🔄 Flip<small>after you've said what it means</small></button>${earAvailable()?`<button class="btn" id="earbtn" style="align-self:center" onclick="earGemara()">🎤 Say the teitch to the robot</button>`:''}</div>`}
      <div class="hint" id="gearsay">${r.earMsg||EAR_IOS_WARN}</div>`;
  } else if(q.kind==='meaning'){
    body=`<div class="stage" id="stage" style="min-height:200px"><div class="heb bigword" style="${big}">${q.it.h}</div></div>
      <div class="choices">${q.choices.map((c,i)=>`<button class="choice" style="font-size:18px" onclick="answerG(${i})">${esc(c)}</button>`).join('')}</div>`;
  } else {
    body=`<div class="stage" id="stage" style="min-height:160px"><div class="bigtext" style="font-size:clamp(26px,6vw,40px);font-weight:900;text-align:center">${esc(q.it.m)}</div></div>
      <div class="choices">${q.choices.map((c,i)=>`<button class="choice heb" style="font-size:34px" onclick="answerG(${i})">${c}</button>`).join('')}</div>`;
  }

    ${trackHTML(100*r.i/r.len, dotsHTML(r), r.streak>=3)}

    <div class="toolbar" style="justify-content:center"><button class="btn ghost" onclick="go({name:'gemara'})">🏠 Back</button></div></div>`;
}
function gRecord(it,ok){ const st=stat(it.id); st.n++; if(ok) st.c++; st.r=st.r*0.65+(ok?0.35:0); st.last=Date.now(); S.days[todayKey()]=(S.days[todayKey()]||0)+1; save(); }
function gFinish(){ const r=gr; const c=r.results.filter(Boolean).length; logSession('gemara',r.len,c,Math.round((Date.now()-r.start)/1000),r.pts); save(); go({name:'result',kind:'gemara',n:r.len,c,secs:0,pts:r.pts,missed:r.missed.map(m=>({id:m.id,h:m.h,t:m.m,rashi:true})),again:()=>startGemara(r.kind)}); }
function markG(ok){ const r=gr; gRecord(r.q.it,ok); r.results[r.i]=ok; if(ok){ r.streak++; const p=pv('ptsWord',8)+Math.min(r.streak-1,5)*2; r.pts+=p; addPoints(p); sfx(r.streak===3?'turbo':'ok'); } else { r.streak=0; r.missed.push(r.q.it); sfx('no'); } r.i++; if(r.i>=r.len) gFinish(); else { nextG(); renderGemaraRound(); } }
function answerG(i){
  const r=gr,q=r.q; if(r.locked) return; r.locked=true;
  const ok=q.choices[i]===q.answer; gRecord(q.it,ok); r.results[r.i]=ok;
  const btns=[...document.querySelectorAll('.choice')]; btns.forEach(b=>b.disabled=true);
  if(ok){ r.streak++; const p=pv('ptsWord',8)+2+Math.min(r.streak-1,5)*2; r.pts+=p; addPoints(p); sfx(r.streak===3?'turbo':'ok'); btns[i].classList.add('ok'); r.feedback=`+${p}`; r.fbClass='ok'; }
  else { r.streak=0; r.missed.push(q.it); sfx('no'); btns[i].classList.add('no'); btns[q.choices.indexOf(q.answer)].classList.add('ok'); r.feedback=`<span class="heb">${q.it.h}</span> = <b>${esc(q.it.m)}</b>`; r.fbClass='no'; }
  const fb=document.getElementById('fb'); fb.className='feedback '+r.fbClass; fb.innerHTML=r.feedback;
  setTimeout(()=>{ r.i++; if(r.i>=r.len) gFinish(); else { nextG(); renderGemaraRound(); } }, ok?1200:2600);
}

async function recToggle(){
  if(rec.state==='recording'){ rec.mr.stop(); return; }
  if(rec.state!=='idle') return;
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus',''].find(m=>!m||MediaRecorder.isTypeSupported(m));
    rec.mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); rec.chunks=[];
    rec.mr.ondataavailable=e=>{ if(e.data.size) rec.chunks.push(e.data); };
    rec.mr.onstop=async()=>{ stream.getTracks().forEach(t=>t.stop()); const blob=new Blob(rec.chunks,{type:rec.mr.mimeType||'audio/webm'}); rec.state='uploading'; render(); await recUpload(blob); };
    rec.mr.start(); rec.state='recording'; rec.msg=''; render();
  }catch(e){
    const denied = e && (e.name==='NotAllowedError'||e.name==='SecurityError');
    rec.msg = denied
      ? 'Microphone blocked. On iPhone: tap “AA” in the address bar → Website Settings → Microphone → Allow (or Settings → Safari → Microphone), then try again.'
      : 'Microphone not available: '+e.message;
    rec.msgClass='no'; render();
  }
}
async function recUpload(blob){

    const r=await fetch(API+'/audio/'+w.id,{method:'PUT',headers:{'Content-Type':blob.type||'audio/webm','X-Family':familyCode()},body:blob});
    if(!r.ok){ let d=''; try{ d=(await r.json()).error||''; }catch(e){} throw new Error('server '+r.status+(d?' — '+d:'')); }
    REC.ids.add(w.id); delete REC.cache[w.id]; REC.v=Date.now(); rec.state='idle'; rec.msg='Saved '+w.id; rec.msgClass='ok';
    setTimeout(()=>{ if(view.name==='record'){ recJumpMissing(false); } }, 500);
  }catch(e){ rec.state='idle'; rec.msg='Could not save: '+e.message; rec.msgClass='no'; render(); }
}

  if(!Object.keys(g).length){ const left=Math.ceil(Math.max(0,goalSecs()-secsToday())/60);
    if(left>0) out.push({p:2,msg:`<b>${left} minutes</b> left on today's clock — one more round gets us closer! ⛽`}); }
  try{ const weak=WORDS.filter(w=>{const st=S.stats[w.id]; return st&&st.n>=3&&st.r<0.5;}).length;
    if(weak>=3) out.push({p:1,msg:`🎯 <b>${weak} tricky words</b> are waiting for a rematch — Word Speedway will beat them!`}); }catch(e){}
  try{ const rep=levelReport(S.settings.level), nl=nextLevel(S.settings.level);
    if(rep&&rep.ready&&nl) out.push({p:3,msg:`🏆 You BEAT this level! Ask to move up to <b>${LEVELS[nl].name}</b>!`}); }catch(e){}
  try{ // subjects gone quiet for 3+ days
    const dts=[]; const d=new Date(); for(let i=0;i<3;i++){ dts.push(dkey(d)); d.setDate(d.getDate()-1); }
    const quiet=b=>dts.every(kk=>actSecs(kk,b)===0);

  listen:"startListen()", drill:"startDrill()", speed:"startSpeed()",

   outranked the new default for ever — including on every other device, and with no
   way back to "whatever the app thinks best". That stale choice is cleared once, and
   a parent now has an Automatic setting to return to. */
const SIMPLE_MIGRATION = 3;   // bump to move every family back to Automatic once
function kidSimpleMigrate(){
  try{
    const done=+(S.settings.simpleKidV2||0);
    if(done>=SIMPLE_MIGRATION) return;
    const had = S.settings.simpleKid===false;
    delete S.settings.simpleKid;
    S.settings.simpleKidV2=SIMPLE_MIGRATION;
    if(had) S.settings.simpleKidTold=0;   // they had chosen Full: make sure they are told
    save();
  }catch(e){}
}
/* Everyone was moved to the plain screen at once, so every parent is told once —
   in the app rather than by email — that an older child can have the full one back. */
function simpleNoticeDue(){
  try{ return !!account() && !S.settings.simpleKidTold; }catch(e){ return false; }
}
function simpleNoticeSeen(){ S.settings.simpleKidTold=1; save(); render(); }
function kidSimple(){
  try{
    kidSimpleMigrate();
    const v=S.settings.simpleKid;
    if(v===true||v===false) return v;
    return true;   // everyone starts here; a parent switches on the full academy screen
  }catch(e){ return true; }
}
function kidSimpleMode(){
  try{ kidSimpleMigrate(); const v=S.settings.simpleKid; return (v===true)?'simple':(v===false)?'full':'auto'; }catch(e){ return 'auto'; }
}
function kidSimpleSet(mode){
  /* Stamp the CURRENT migration, not 1 — otherwise a choice made before the move has
     run gets wiped by it a moment later, and the switch appears not to work. */
  kidSimpleMigrate();
  if(mode==='auto') delete S.settings.simpleKid; else S.settings.simpleKid=(mode==='simple');
  S.settings.simpleKidV2=SIMPLE_MIGRATION; save();
  toast(mode==='auto'?'Back to whatever suits him':mode==='simple'?'Simple screen on':'Full screen on');
  render();
}
/* What should happen when he taps the big button: the first goal he has not met
   today, so the button is always the right next thing without him choosing. */

  kriah:  ['🅰️','Kriah',      "startListen()"],
  siddur: ['🙏','Davening',   "go({name:'siddur'})"],
  tehillim:['📜','Tehillim',  "go({name:'tehillim'})"],
  chumash:['📖','Chumash',    "go({name:'chumash'})"],
  mishna: ['📚','Mishnayos',  "go({name:'mishna'})"],
  gemara: ['💬','Gemara',     "go({name:'gemara'})"]
};
const SIMPLE_EX = {
  listen:  ['🎧','Read & Listen', "startListen()"],
  drill:   ['🎯','Word game',     "startDrill()"],
  speed:   ['⚡','Speed race',    "startSpeed()"],
  rletters:['✍️','Rashi letters', "startRashiLetters()"],
  rwords:  ['🖊️','Rashi words',   "startRashiWords()"],
  sheet:   ['📄','Practice sheet',"go({name:'sheet'})"]
};
/* The word games need recordings. Sending a six-year-old into one that is locked
   gives him a toast he cannot read and a button that appears broken, so the big
   button skips anything shut and only ever points at something that will open. */
const SIMPLE_NEEDS_VOICE = { kriah:1, listen:1, drill:1, speed:1 };
function simpleUsable(key){ return !(SIMPLE_NEEDS_VOICE[key] && wordGamesLock()); }
function nextThing(){
  const k=todayKey();
  for(const [b,m] of Object.entries(actGoals()))
    if(actSecs(k,b) < m*60 && SIMPLE_ACT[b] && simpleUsable(b))
      return { ic:SIMPLE_ACT[b][0], lb:SIMPLE_ACT[b][1], act:SIMPLE_ACT[b][2] };
  for(const [e,m] of Object.entries(exGoals()))
    if(exSecs(k,e) < m*60 && SIMPLE_EX[e] && simpleUsable(e))
      return { ic:SIMPLE_EX[e][0], lb:SIMPLE_EX[e][1], act:SIMPLE_EX[e][2] };
  if(secsToday() < goalSecs()){
    if(!wordGamesLock()) return { ic:'🎧', lb:'Read & Listen', act:'startListen()' };
    if(API) return { ic:'🙏', lb:'Davening', act:"go({name:'siddur'})" };
  }
  return null;   // everything for today is done, or nothing is open yet
}
/* If the games are shut AND there is nothing else to send him to, say so in words a
   parent will understand, rather than showing a child a button that does nothing. */
function simpleBlocked(){
  const st=routeSteps();
  if(st.length) return !st.some(x=>!x.done && x.open) && st.some(x=>!x.done);
  return wordGamesLock() && !nextThing() && secsToday() < goalSecs();
}
/* The buttons under the track are the parent's own route — nothing appears on a
   child's screen that a parent did not put there. Take Tehillim off the route and
   the Tehillim button goes with it. A family with no route yet gets a small
   sensible set until they build one. */
function simpleTiles(){
  const steps=routeSteps();
  const t = steps.length
    ? steps.filter(x=>x.open).map(x=>[x.ic, esc(x.kid).replace(/ &amp; /,' &amp;<br>').replace(/ /,'<br>'), x.act])
    : (()=>{ const d=[];
        if(!wordGamesLock()) d.push(['🎧','Read &amp;<br>Listen',"startListen()"],['🎯','Word<br>game',"startDrill()"]);
        if(API) d.push(['🙏','Davening',"go({name:'siddur'})"],['📜','Tehillim',"go({name:'tehillim'})"]);
        if(rashiAnyOn()) d.push(['אב','Rashi',"go({name:'rashi'})"]);
        return d; })();
  /* the garage is not a practice button — it lives at the top of the screen now */
  return t;
}
/* The buttons under the track had the same fault the track itself had: kriah stood
   in the row as if it were a fifth game, when the games in that row ARE kriah. So
   kriah becomes a headed box and its games sit inside it; everything else — davening,
   tehillim, the garage — stays an ordinary button outside. */
function simpleTileGroups(){
  const steps=routeSteps().filter(x=>x.open);
  const lab = x => esc(x.kid).replace(/ &amp; /,' &amp;<br>').replace(/ /,'<br>');
  const tile = x => [x.ic, lab(x), x.act, routeAllowNow(x.k) && x.open, x.done];
  const goal = steps.find(x=>x.k===EX_PARENT);
  const games = steps.filter(x=>x.kind==='ex');
  const rest  = steps.filter(x=>x.kind==='act' && x.k!==EX_PARENT).map(tile);

  if(!steps.length) return { kriah:null, rest:simpleTiles() };
  if(!goal || !games.length){
    // no kriah goal, or no games under it — nothing to nest
    return { kriah:null, rest:(goal?[tile(goal)]:[]).concat(games.map(tile)).concat(rest) };
  }
  const secs=goal.secs, mins=Math.min(Math.floor(secs/60), goal.min);
  return { kriah:{ ic:goal.ic, name:esc(goal.kid), mins, need:goal.min, done:goal.done,
                   pct:Math.min(100,Math.round(100*secs/Math.max(1,goal.need))), tiles:games.map(tile) },
           rest };
}

   became every child's home, they went with it — nobody meant to take them away.
   Here they are again, as big tappable jobs a six-year-old can tick off himself. */

/* The prize shelf lived on the full academy screen. When the plain screen became
   every child's home it went with it — and a shelf he cannot see is no reason to
   earn points. Here it is again, sized for him: what each prize costs, how close
   he is, and a button to choose one the moment he can afford it. */
function simplePrizesHTML(){
  const ps=prizes().slice().sort((a,b)=>a.cost-b.cost);
  if(!ps.length) return '';
  const canAny=ps.some(p=>prizeState(p)==='afford');
  return `<div class="s-prizes ${canAny?'ready':''}">
    <div class="s-prizes-hd"><b>🎁 ${canAny?'You can choose a prize!':'My prizes'}</b><span>⭐ ${S.points} to spend</span></div>
    <div class="s-prize-list">${ps.map(p=>{ const st=prizeState(p), pct=Math.min(100,Math.round(100*S.points/Math.max(1,p.cost)));
      const asking=view.confirmPrize===p.id;
      if(st==='afford') return `<div class="s-prize can">
        <span class="s-prize-ic">🎁</span>
        <span class="s-prize-tx"><b>${esc(p.name)}</b><small>you have enough!</small></span>
        ${asking?`<span class="s-prize-ask">
            <button class="s-prize-yes" onclick="claimPrize('${p.id}')">Yes! ⭐ ${p.cost}</button>
            <button class="s-prize-no" onclick="view.confirmPrize=null;render()">not yet</button></span>`
          :`<button class="s-prize-get" onclick="sfx('tap');view.confirmPrize='${p.id}';render()">Get it! ⭐ ${p.cost}</button>`}
      </div>`;
      if(st==='claimed') return `<div class="s-prize done"><span class="s-prize-ic">🎉</span>
        <span class="s-prize-tx"><b>${esc(p.name)}</b><small>you chose it — tell a parent!</small></span></div>`;
      if(st==='given') return `<div class="s-prize done"><span class="s-prize-ic">🏆</span>
        <span class="s-prize-tx"><b>${esc(p.name)}</b><small>you got it!</small></span></div>`;
      return `<div class="s-prize"><span class="s-prize-ic">🎁</span>
        <span class="s-prize-tx"><b>${esc(p.name)}</b><small>${p.cost-S.points} more star${p.cost-S.points===1?'':'s'} to go</small>
          <span class="s-prize-bar"><i style="width:${pct}%"></i></span></span>
        <span class="s-prize-cost">⭐ ${p.cost}</span></div>`;
    }).join('')}</div>
  </div>`;
}
/* ---- trophies ----

   are worked out from what he has already done rather than stored, so nothing can
   be lost, and a locked one says exactly what it takes — a six-year-old should be
   able to read the shelf and know what to go and do. */
function totalMinutesEver(){ let s=0; for(const k in S.time) s+=S.time[k]||0; return Math.floor(s/60); }
function wordsSolid(){ return WORDS.filter(w=>(mastery(w.id)||0)>=0.75).length; }
function choresEver(){ let n=0; for(const k in S.chores) n+=((S.chores[k]||{}).done||[]).length; return n; }
function daysMet(){ let n=0; for(const k in S.time){ if(dayStatus(k)==='met') n++; } return n; }
function tefillosMastered(){ try{ return TEFILLOS.filter(t=>{ const p=tefProgress(t); return p.total && p.solid===p.total; }).length; }catch(e){ return 0; } }
const TROPHIES = [
  { id:'t_streak3',  ic:'🔥', name:'Three days running',  need:'practise 3 days in a row',    at:()=>[dayStreak(),3] },

  { id:'t_words25',  ic:'🅰️', name:'Twenty-five words',   need:'know 25 kriah words really well',  at:()=>[wordsSolid(),25] },

  { id:'t_chores200',ic:'🧺', name:'Two hundred jobs',    need:'tick off 200 jobs',           at:()=>[choresEver(),200] },
];
function trophyRows(){
  return TROPHIES.map(t=>{ let have=0, need=1;
    try{ const a=t.at()||[]; have=a[0]||0; need=a[1]||1; }catch(e){}
    return Object.assign({}, t, { have, needN:need, got:have>=need, pct:Math.min(100,Math.round(100*have/need)) }); });
}
/* A trophy is announced once, the moment it is earned. */
function trophyCheck(){
  try{
    const got=trophyRows().filter(t=>t.got).map(t=>t.id);
    const had=new Set(S.trophies||[]);
    const fresh=got.filter(id=>!had.has(id));
    if(!(S.trophies||[]).length && !fresh.length){ S.trophies=got; return false; }
    if(!fresh.length){ if((S.trophies||[]).length!==got.length){ S.trophies=got; save(); } return false; }
    S.trophies=got; save();
    const first=TROPHIES.find(t=>t.id===fresh[0]);
    toast(`🏆 New trophy: ${first.ic} ${first.name}${fresh.length>1?' (+'+(fresh.length-1)+' more)':''}`);
    confetti(); sfx('win');
    return true;
  }catch(e){ return false; }
}
function trophyHTML(){
  const rows=trophyRows(), got=rows.filter(t=>t.got).length;
  const order=rows.slice().sort((a,b)=>(a.got===b.got)?(b.pct-a.pct):(a.got?-1:1));
  return `<div class="s-prizes" style="margin-top:16px">
    <div class="s-prizes-hd"><b>🏆 My trophies</b><span>${got} of ${rows.length}</span></div>
    <div class="s-trophies">${order.map(t=>`
      <div class="s-trophy ${t.got?'got':''}">
        <span class="s-trophy-ic">${t.got?t.ic:'🔒'}</span>
        <span class="s-trophy-nm">${esc(t.name)}</span>
        <small>${t.got?'earned!':esc(t.need)}</small>
        ${t.got?'':`<span class="s-trophy-bar"><i style="width:${t.pct}%"></i></span>`}
      </div>`).join('')}</div>
  </div>`;
}

function simpleJump(sel){
  const el=document.querySelector(sel);
  if(!el) return;
  try{ el.scrollIntoView({behavior:'smooth', block:'center'}); }catch(e){ el.scrollIntoView(); }
  el.classList.add('flashme'); setTimeout(()=>el.classList.remove('flashme'), 1400);
}
function renderHomeSimple(){
  hwPoll(); trophyCheck();
  const t=secsToday(), g=goalSecs(), pct=Math.min(100,Math.round(100*t/g));
  const open=dayGoalsMet(todayKey())||!!dayOff(todayKey())||S.raceOverride===todayKey();
  if(open) try{ localStorage.setItem('mth.racepass',todayKey()); }catch(e){}
  const steps=routeSteps();
  /* routeNext walks the goals AND their steps, so the button lands in the exercise
     rather than on the goal that contains it. The flat scan used to pick the goal. */
  const nx=routeNext();
  app.innerHTML = topbar() + `
  <div class="simple">
    ${simpleHeroHTML(pct, open, nx)}
    ${simpleQuadHTML(open, nx)}

    ${hwHomeHTML()}

    ${steps.length ? (()=>{
      const pts=routeTrack(), n=pts.length;
      const GAP=122, TOP=96, BOT=112;
      const xs=pts.map((_,i)=> i%2 ? 72 : 28);
      /* a checkpoint is a banner across the road, not a 56px dot — it needs more room
         above and below it than a step does */
      const ys=[]; let y=TOP;
      for(let i=0;i<n;i++){
        if(i) y += GAP + ((pts[i].sums?34:0) + (pts[i-1].sums?34:0));
        ys.push(y);
      }
      const H=(ys[n-1]||TOP) + BOT + (pts[n-1]&&pts[n-1].sums?26:0);
      /* The road comes in from the far side of the first stop and leaves on the far
         side of the last one. With four stops that is just a longer circuit; with ONE
         stop it is the difference between a racetrack and a grey stripe, which is what
         a family with only kriah on the route was looking at. */
      const inX = xs[0]===28 ? 72 : 28, outX = xs[n-1]===28 ? 72 : 28;
      const seg=i=>{ const px=i?xs[i-1]:inX, py=i?ys[i-1]:10, span=(ys[i]-py);
        return ` C ${px} ${py+span*0.5}, ${xs[i]} ${ys[i]-span*0.5}, ${xs[i]} ${ys[i]}`; };
      let d='M '+inX+' 10';
      for(let i=0;i<n;i++) d+=seg(i);
      const endY=H-16, tail=endY-ys[n-1];
      d+=` C ${xs[n-1]} ${ys[n-1]+tail*0.5}, ${outX} ${endY-tail*0.5}, ${outX} ${endY}`;
      const nxi = nx ? pts.findIndex(p=>p.k===nx.k) : -1;
      /* the road he has already driven is its own path, drawn on top — a dash pattern
         measured in percentages of a curve is guesswork, and it painted the last bend
         purple as well */
      let dDone=''; if(nxi>0){ dDone='M '+inX+' 10'; for(let i=0;i<nxi;i++) dDone+=seg(i); }
      return `<div class="s-circuit" style="height:${H}px">
        <svg class="s-road" viewBox="0 0 100 ${H}" preserveAspectRatio="none" aria-hidden="true">
          <path class="rd-edge" d="${d}" vector-effect="non-scaling-stroke"/>
          <path class="rd-top"  d="${d}" vector-effect="non-scaling-stroke"/>
          <path class="rd-mid"  d="${d}" vector-effect="non-scaling-stroke"/>
          ${dDone?`<path class="rd-done" d="${dDone}" vector-effect="non-scaling-stroke"/>`:''}
        </svg>
        <div class="s-flag start" style="left:${inX}%;top:6px">START</div>
        <div class="s-flag finish ${routeLeft()?'':'won'}" style="left:${outX}%;top:${H-14}px">🏁 FINISH</div>
        ${pts.map((x,i)=>{
          const allow = routeAllowNow(x.k) && x.open;
          const state = x.done ? 'done' : (nx && x.k===nx.k ? 'now' : (allow ? '' : 'shut'));
          const here = !!(nx && x.k===nx.k);
          const mins = Math.min(Math.floor(x.secs/60), x.min);
          const pc = Math.min(100, Math.round(100*x.secs/Math.max(1,x.need)));
          if(x.sums){
            /* the checkpoint: everything above adds up here. Only tappable when the
               steps are finished and it is genuinely where he has to go next. */
            const tag = here?'button':'div';
            return `<${tag} class="s-gate ${state}" style="top:${ys[i]}px"
              ${here?`onclick="sfx('tap');${x.act}"`:''}>
              <span class="s-gate-in">
                <span class="s-gate-hd">${x.done?'✓':'🏁'} ${esc(x.kid)}${x.done?' — done!':''}</span>
                <span class="s-gate-sub">${x.done?'you finished the whole thing':'the '+x.sums+' step'+(x.sums===1?'':'s')+' above add up to this'}</span>
                <span class="s-gate-bar"><i style="width:${pc}%"></i></span>
                <span class="s-gate-min">${mins} / ${x.min} min</span>
              </span>
              ${here?`<span class="mk-car">${carHTML(S.car)}</span>`:''}
            </${tag}>`;
          }
          const side = xs[i]<50 ? 'r' : 'l';
          return `<button class="s-mark ${x.node} ${state} lbl-${side}" style="left:${xs[i]}%;top:${ys[i]}px"
            ${allow?`onclick="sfx('tap');${x.act}"`:'disabled'}>
            <span class="mk">${x.done?'✓':!allow&&x.open?'🔒':x.node==='goal'?'🏁':x.ic}</span>
            <span class="mk-lbl"><b>${esc(x.kid)}</b><small>${x.done?'done':!x.open?'needs recordings':allow?mins+' / '+x.min+' min':'not yet — '+x.min+' min'}</small></span>
            ${here?`<span class="mk-car">${carHTML(S.car)}</span><span class="mk-here">START HERE</span>`:''}
          </button>`;}).join('')}
      </div>` ; })() : ''}

    ${nx ? `<button class="s-go" onclick="sfx('tap');${nx.act}">
        <span class="s-go-ic">${nx.ic}</span>
        <span class="s-go-tx"><b>START</b><small>${esc(nx.kid)} · ${nx.min} min</small></span>
      </button>
      <div class="s-tap">👉 Tap here to start your practice</div>`
      : simpleBlocked()
        ? `<div class="s-done" style="background:var(--warn-soft,#FDF3D7);color:var(--warn,#B7791F)"><span style="font-size:56px">🎙</span><b>Nearly ready</b><small>A parent needs to record the words first — Parental Controls → Voice.</small></div>`
        : `<div class="s-done"><span style="font-size:56px">🏆</span><b>All done today!</b><small>Great learning.</small></div>`}

    ${steps.length ? '' : `<div class="s-fuel">
      <div class="s-fuel-bar"><i style="width:${pct}%"></i></div>
      <div class="s-fuel-tx">⛽ ${Math.min(Math.floor(t/60), Math.round(g/60))} / ${Math.round(g/60)} minutes</div>
    </div>`}

    <button class="s-race ${open?'':'shut'}" ${open?`onclick="sfx('tap');go({name:'racegame'})"`:'disabled'}>
      <span style="font-size:38px">${open?'🏁':'🔒'}</span>
      <span><b>${open?'RACE!':'Race track'}</b><small>${open?'The track is open':'Finish your practice first'}</small></span>
    </button>

    ${(()=>{ const G=simpleTileGroups();
      const grid=list=>`<div class="s-grid">${list.map(([ic,lb,act,allow,done])=>
        allow===false
          ? `<button class="s-tile shut ${done?'fin':''}" onclick="routeNudge()"><span class="s-tile-ic">${done?'✓':'🔒'}</span><span>${lb}</span></button>`
          : `<button class="s-tile" onclick="sfx('tap');${act}"><span class="s-tile-ic ${ic==='אב'?'heb':''}">${ic}</span><span>${lb}</span></button>`).join('')}</div>`;
      return (G.kriah?`<div class="s-goalbox ${G.kriah.done?'done':''}">
          <div class="s-goalhd"><span class="s-goalic">${G.kriah.done?'✓':G.kriah.ic}</span>
            <span class="s-goalnm">${G.kriah.name}<small>${G.kriah.done?'done today!':'do these to get there'}</small></span>
            <span class="s-goalmin">${G.kriah.mins} / ${G.kriah.need} min</span></div>
          <div class="s-goalbar"><i style="width:${G.kriah.pct}%"></i></div>
          ${grid(G.kriah.tiles)}
        </div>`:'') + (G.rest.length?grid(G.rest):''); })()}

    ${simpleChoresHTML()}

    <div class="s-pts">⭐ ${S.points}</div>
  </div>`;
}

function translateDom(root){

    const rx=I18N_RX[l]||[];

    let n; while(n=walk.nextNode()){
      const raw=n.nodeValue, t=raw.trim(); if(!t) continue;
      if(d[t]!==undefined){ n.nodeValue=raw.replace(t,d[t]); continue; }
      let cur=t, changed=false;
      for(const [re,out] of rx){ if(re.test(cur)){ cur=cur.replace(re,out); changed=true; } }
      if(changed) n.nodeValue=raw.replace(t,cur);

function earAvailable(){ return !!SR && S.settings.robotEar!==false; } /* on by default */
/* Two views of a word. The bare one drops א ה ו י because a speech recogniser
   often does too; the full one keeps them, and those letters are exactly the
   ones carrying the vowel sounds. Comparing the two tells us something useful:
   if the bare forms match but the full ones don't, the consonants were right
   and the vowels were not — which is the single most common kriah slip. */
function skelFull(h){ return h.replace(/[ְ-ׇ]/g,'').replace(/[םןץףך]/g,m=>({'ם':'מ','ן':'נ','ץ':'צ','ף':'פ','ך':'כ'}[m])).replace(/[^א-ת]/g,''); }
/* The recogniser is trained on modern ISRAELI Hebrew, but our children read with
   ASHKENAZI pronunciation. "es-chem" for אֶתְכֶם reaches it as an /s/, so it writes
   ס where the text has ת; ches and chaf are the same sound to it. Folding those
   letters together is what lets a correct Ashkenazi reading match an Israeli
   transcript. It makes matching a little generous — which is the right way to be
   wrong, since the robot only ever encourages. */
const EAR_FOLD = { 'ט':'ת', 'ס':'ת', 'ש':'ת', 'ח':'כ', 'ך':'כ', 'ק':'כ' };
function earFold(s){ return s.replace(/./g, c => EAR_FOLD[c] || c); }
function skeleton(h){ return earFold(skelFull(h).replace(/[ויאה]/g,'')); }
/* What the recogniser gives us back is UNPOINTED and spelled the modern way, so
   לְעֹלָם comes back as לעולם — with a vav the pointed text doesn't have. That is an
   orthography difference, not a child's mistake, which is why comparing the vowel
   letters marked correct readings wrong. We compare consonants only (the part a
   recogniser preserves reliably) and, just as importantly, the robot NEVER tells a
   child he read it wrong: it either confirms, or admits it didn't catch it. The
   child's own 👍/👎 stays the source of truth. */
function earJudge(targetHeb, heardText, confidence){
  const tB=skeleton(targetHeb);
  const words=String(heardText).split(/\s+/).filter(Boolean);
  let best=99;
  for(const w of words){ const d=lev(skeleton(w),tB); if(d<best) best=d; }
  const slack=tB.length>=5?1:0;                      // long words earn a little forgiveness
  if(best<=slack) return { verdict:'yes' };
  if(best===slack+1 && tB.length>=4) return { verdict:'close' };
  return { verdict:'unsure' };                       // never a confident "you got it wrong"
}
function lev(a,b){ const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length)]); for(let j=0;j<=b.length;j++) m[0][j]=j; for(let i=1;i<=a.length;i++) for(let j=1;j<=b.length;j++) m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1)); return m[a.length][b.length]; }
const TUTORIAL_URL='/tutorial-full.mp4?v=3';
let earBusy=false;
// --- English meaning matching (gemara "say the teitch") ---
function enBare(s){ return String(s).toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-z']+/g,' ').split(/\s+/).filter(Boolean); }
const EN_STOP=new Set('a an the of to is it he she they and or in on that this you i we his her its was were are am be with for at by from'.split(' '));
function enWordHit(w,hws){ if(hws.has(w)) return true; for(const h of hws){ if(h.length>2&&w.length>2&&lev(h,w)<=(Math.min(h.length,w.length)>=4?2:1)) return true; if(w.length>=5&&h.startsWith(w.slice(0,4))) return true; } return false; }
function meaningMatch(m,heard){
  const hws=new Set(enBare(heard)); if(!hws.size) return false;
  for(const part of String(m).split(/[\/;,•]|\bor\b/)){
    const t=enBare(part); if(!t.length) continue;
    let need=t.filter(w=>!EN_STOP.has(w)); if(!need.length) need=t;
    const hit=need.filter(w=>enWordHit(w,hws)).length;
    if(hit>=Math.max(1,Math.ceil(need.length/2))) return true;
  }
  return false;
}
// Chrome/Firefox/Edge on iPhone or iPad can't use Apple's speech service — only Safari can.
const EAR_IOS_WARN = /CriOS|FxiOS|EdgiOS|OPiOS|OPT\//.test(navigator.userAgent) ? '🤖 On iPhone and iPad the robot can only hear in the Safari app — open mytorahhelper.com in Safari to use it' : '';
/* The microphone button is a small chip on some screens and the big primary button
   on Read & Listen. Swap only its icon, never the button's insides — the big one
   carries words a child needs. */
function earBtnBusy(on){
  const btn=document.getElementById('earbtn'); if(!btn) return;
  btn.classList.toggle('playing', !!on);
  const ic=btn.querySelector('.ear-ic');
  if(ic) ic.textContent = on?'👂':'🎤'; else btn.textContent = on?'👂':'🎤';
}
function robotEar(word, cb, mode){
  if(!earAvailable()||earBusy) return;
  try{
    const r=new SR(); r.lang=mode==='en'?'en-US':'he-IL'; r.maxAlternatives=5; r.interimResults=true; r.continuous=false; earBusy=true;
    earBtnBusy(true);
    const btn=document.getElementById('earbtn');
    let answered=false; const heardAll=new Set(); let quietTimer=null; let bestConf=0;
    const reset=()=>{ earBusy=false; earBtnBusy(false); };
    const finish=()=>{ if(answered) return; answered=true; clearTimeout(watchdog); clearTimeout(quietTimer); reset(); try{r.abort();}catch(x){}
      const alts=[...heardAll];
      if(!alts.length) return cb(null,'(didn\'t hear anything — tap 🎤 and say it right away, nice and loud)');
      if(mode==='en'){ const hit=alts.find(t=>meaningMatch(word.m,t)); return cb(!!hit, hit||alts[alts.length-1]||''); }
      let pick={ v:{verdict:'no'}, t:alts[0]||'' }; const rank={yes:0,close:1,unsure:2,no:3};
      for(const a of alts){ const v=earJudge(word.h, a, bestConf); if(rank[v.verdict]<rank[pick.v.verdict]) pick={v,t:a}; }
      cb(pick.v.verdict==='yes', pick.t, pick.v); };
    // Safari on iPhone often never sends a "final" result, so collect every partial
    // result and settle 1.2s after the child stops talking (or on end/error/timeout).
    r.onresult=e=>{ if(answered) return;
      for(const res of e.results) for(const a of [...res]){ const t=(a.transcript||'').trim(); if(t) heardAll.add(t);
        if(typeof a.confidence==='number'&&a.confidence>bestConf) bestConf=a.confidence; }
      clearTimeout(quietTimer); quietTimer=setTimeout(finish,1200);
      const last=e.results[e.results.length-1]; if(last&&last.isFinal) finish(); };
    r.onerror=e=>{ if(answered) return;
      if(heardAll.size||e.error==='no-speech'||e.error==='aborted') return finish();
      answered=true; clearTimeout(watchdog); clearTimeout(quietTimer); reset(); const iosOtherBrowser=/CriOS|FxiOS|EdgiOS|OPiOS|OPT\//.test(navigator.userAgent);
      cb(null, ({
      'not-allowed': iosOtherBrowser?'(on iPhone the robot can only listen in Safari — open mytorahhelper.com in the Safari app for this game)':'(microphone blocked — allow the mic for this site, and on iPhone also turn on Settings → General → Keyboard → Enable Dictation)',
      'service-not-allowed': iosOtherBrowser?'(on iPhone the robot can only listen in Safari — open mytorahhelper.com in the Safari app for this game)':'(the phone\'s dictation is off — turn on Settings → General → Keyboard → Enable Dictation and make sure Siri is enabled, then reopen the app)',
      'language-not-supported':'(this phone can\'t do Hebrew speech — add the Hebrew keyboard in Settings → General → Keyboard → Keyboards, then reopen the app)',
      'audio-capture':'(no microphone found)',
      'network':'(no internet for the speech check — check the connection)'
    })[e.error]||'(didn\'t catch it — '+e.error+')'); };
    r.onend=()=>{ finish(); };
    const watchdog=setTimeout(finish,8000);
    r.start();
  }catch(e){ earBusy=false; cb(null,''); }
}

   Measures whether comparing a child's reading to the parent's recording actually

   own threshold from those measurements instead of a number I guessed. */
let vt = { word:null, decoys:[], busy:false, rows:null, err:'', log:(function(){ try{ return (S&&S.settings&&S.settings.vmLog)||[]; }catch(e){ return []; } })(), mr:null, stream:null, waiting:false, poll:null };

function startVoiceTest(){
  try{ clearTimeout(vt.poll); }catch(e){}
  vt={ word:null, decoys:[], busy:false, rows:null, err:'', log:vt.log||[], mr:null, stream:null, waiting:false, poll:null };

/* The recordings arrive from the server a moment after the page does. Picking a
   word before they land used to leave the screen stuck on "record a few more
   first" with a dead button, so wait for them and pick again when they arrive. */
function vtPick(){
  const pool=vtWords();
  if(pool.length>=4){
    const shuffled=shuffle(pool.slice());
    vt.word=shuffled[0]; vt.decoys=shuffled.slice(1,6); vt.rows=null; vt.err=''; vt.waiting=false;
    return;
  }
  vt.word=null;
  const settling = !REC.loaded || REC.fam!==familyCode() || REC.busy;
  if(settling){
    vt.waiting=true; vt.err='';
    try{ if(!REC.busy) loadRecordings(); }catch(e){}
    if(!vt.poll) vt.poll=setTimeout(()=>{ vt.poll=null; if(view.name==='voicetest'){ vtPick(); render(); } }, 1200);
    return;
  }
  vt.waiting=false;
  vt.err='This test needs at least 4 words recorded in your voice, and '+pool.length+
         (pool.length===1?' is recorded so far.':' are recorded so far.');
}
function vtNext(){ vtPick(); render(); }
async function vtRecord(){
  if(vt.busy) return;
  if(!vt.word){ vtPick(); return render(); }
  if(!(navigator.mediaDevices&&window.MediaRecorder)){ vt.err='This browser can\'t record audio.'; return render(); }
  vt.busy=true; vt.rows=null; vt.err=''; render();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    const mime=['audio/webm;codecs=opus','audio/webm','audio/mp4',''].find(m=>!m||MediaRecorder.isTypeSupported(m));
    const mr=new MediaRecorder(stream, mime?{mimeType:mime}:undefined); const chunks=[];
    vt.mr=mr; vt.stream=stream;
    mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    mr.onstop=async()=>{
      try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){}
      try{
        const buf=await new Blob(chunks).arrayBuffer();
        const feats=vmFeatures(await vmDecode(buf));
        if(feats.length<8){ vt.err='That was too short or too quiet — hold the button while you read.'; vt.busy=false; return render(); }
        const list=[vt.word].concat(vt.decoys);
        const rows=[];
        for(const w of list){
          let d=Infinity; try{ d=await vmCompare(feats, w.id); }catch(e){}
          rows.push({ id:w.id, heb:w.h, say:w.t, dist:d, correct:w.id===vt.word.id });
        }
        rows.sort((a,b)=>a.dist-b.dist);
        vt.rows=rows;
        const rank=rows.findIndex(r=>r.correct)+1;
        const right=rows.find(r=>r.correct).dist;
        const bestWrong=rows.filter(r=>!r.correct).reduce((m,r)=>Math.min(m,r.dist),Infinity);
        vt.truth=null; vt.labId=null;
        vt.log.push({ rank, right, bestWrong, gap:bestWrong-right, word:vt.word.h, truth:null });
        try{ S.settings.vmLog=vt.log.slice(-40); save(); }catch(e){}
        vtLabSend(buf, rows, rank, right, bestWrong, feats.length);
      }catch(e){ vt.err='Could not read that recording: '+e.message; }
      vt.busy=false; render();
    };
    mr.start();
    setTimeout(()=>{ try{ if(mr.state==='recording') mr.stop(); }catch(e){} }, 3000);
  }catch(e){ vt.err='Microphone not available: '+e.message; vt.busy=false; render(); }
}

/* Keep the clip and the six numbers it produced, so a change to the matcher can be
   replayed against real recordings instead of argued about from screenshots. */
async function vtLabSend(buf, rows, rank, right, bestWrong, frames){
  if(!labOn() || !cloudAvailable() || !familyCode()) return;
  try{
    const blob=new Blob([buf], {type:(vt.mr&&vt.mr.mimeType||'audio/webm').split(';')[0]});
    const slim=rows.map(r=>({ id:r.id, heb:r.heb, say:r.say, d:Math.round(r.dist*1000)/1000, ok:!!r.correct }));
    const enc=x=>encodeURIComponent(String(x==null?'':x));
    const r = await fetch(API+'/lab', { method:'POST',
      headers:{ 'Content-Type':blob.type||'audio/webm', 'X-Family':familyCode(),
        'X-Word':vt.word.id, 'X-Heb':enc(vt.word.h), 'X-Say':enc(vt.word.t),
        'X-Rank':String(rank), 'X-Target':String(right), 'X-Bestwrong':String(bestWrong),
        'X-Gap':String(bestWrong-right), 'X-Rows':enc(JSON.stringify(slim)),
        'X-Sr':String((()=>{ try{ return vmCtx().sampleRate; }catch(e){ return 0; } })()),
        'X-Secs':String(Math.round((blob.size/8000)*10)/10), 'X-Frames':String(frames),
        'X-Tag':enc(S.settings.vmLabTag||'') },
      body: blob });
    try{ const j=await r.json(); if(j&&j.id) vt.labId=j.id; }catch(e){}
    vt.labN=(vt.labN||0)+1;
  }catch(e){ /* the lab must never break the test itself */ }
}
/* The parent's own verdict on the READING, which is a different question from the
   matcher's ranking. Marked "wrong" means a different word really was said, so the
   matcher not putting it first is the right answer, not a failure. */
async function vtTruth(v){
  vt.truth=v; render();
  if(labOn() && !vt.labId){ for(let i=0;i<20 && !vt.labId;i++) await new Promise(r=>setTimeout(r,150)); }
  const last=vt.log[vt.log.length-1]; if(last) last.truth=v;
  try{ S.settings.vmLog=vt.log.slice(-40); save(); }catch(e){}
  if(vt.labId && labOn()){
    try{ await fetch(API+'/lab/'+vt.labId+'/truth?family='+encodeURIComponent(familyCode())+'&truth='+v, {method:'POST'}); }catch(e){}
  }
  render();
}
async function labRefresh(){
  const el=document.getElementById('labcount'); if(el) el.textContent='…';
  try{
    const r=await fetch(API+'/lab?family='+encodeURIComponent(familyCode()));
    const j=await r.json();
    vt.labN=j.n;
    if(el) el.textContent = j.n
      ? j.n+' attempt'+(j.n===1?'':'s')+' kept · the right word came first in '+j.pct+'% of them'
        + (j.medianGap!==null?' · typical winning gap '+j.medianGap:'')
      : 'Nothing kept yet — run an attempt above.';
  }catch(e){ if(el) el.textContent='Could not reach the lab.'; }
}
async function labWipe(){
  if(!confirm('Delete every attempt kept in the test lab for this family?')) return;
  try{ await fetch(API+'/lab?family='+encodeURIComponent(familyCode()), {method:'DELETE'});
    vt.labN=0; toast('Test lab cleared'); }catch(e){ toast('Could not clear it'); }
  render();
}
function vtStop(){ try{ if(vt.mr&&vt.mr.state==='recording') vt.mr.stop(); }catch(e){} }
function vtSummary(){
  if(!vt.log.length) return null;
  /* Attempts where a different word really was said are not accuracy failures —
     there the matcher is supposed to rank the target lower. They are scored
     separately, as rejections. "Not sure" is left out of both. */
  const scored=vt.log.filter(x=>x.truth!=='wrong' && x.truth!=='unsure');
  const said  =vt.log.filter(x=>x.truth==='wrong');
  const rejected=said.filter(x=>x.rank!==1).length;
  const n=scored.length; if(!n) return { n:0, wins:0, pct:null, enough:false, medianGap:null,
    suggest:null, verdict:'more', wrongReadings:said.length, rejected,
    rejectPct: said.length?Math.round(100*rejected/said.length):null,
    unlabelled: vt.log.filter(x=>!x.truth).length };
  const wins=scored.filter(x=>x.rank===1).length;
  const gaps=scored.filter(x=>x.rank===1).map(x=>x.gap).filter(x=>isFinite(x)).sort((a,b)=>a-b);
  const pct=Math.round(100*wins/n);
  /* The margin the game will demand: the smaller end of the gaps we actually saw
     when the right word won. Set it too low and wrong words sail through; too high
     and nothing is ever confirmed. The 25th percentile keeps most true matches
     while still rejecting a decoy that merely came close. */
  const suggest = (gaps.length>=3) ? Math.max(0.05, Math.round(gaps[Math.floor(gaps.length*0.25)]*100)/100) : null;
  const enough = n>=8;
  return { n, wins, pct, enough,
           medianGap: gaps.length?Math.round(gaps[Math.floor(gaps.length/2)]*100)/100:null,
           suggest: (enough && pct>=70) ? suggest : null,
           verdict: !enough ? 'more' : pct>=80?'good' : pct>=70?'mixed' : 'poor',
           wrongReadings: said.length, rejected,
           rejectPct: said.length?Math.round(100*rejected/said.length):null,
           unlabelled: vt.log.filter(x=>!x.truth).length };
}
function vtApply(){ const s=vtSummary(); if(!s||!s.suggest) return;
