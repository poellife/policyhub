<style>
:root{
  --ground:#E9EDF3; --card:#FFFFFF; --card2:#F3F5F9; --ink:#141C2E; --ink2:#4A5468; --ink3:#8B93A5;
  --line:#D3D8E2; --accent:#B07C0A; --accent-soft:#F6E7BF; --accent-ink:#6E4C00;
  --good:#1F8A4C; --good-soft:#D7F1E1; --bad:#C3362B; --bad-soft:#F9DBD7;
  --track:#2B3346; --track-line:#F2D46B; --grass:#CFE6C9;
  --shadow:0 2px 6px rgba(20,28,46,.08), 0 12px 32px rgba(20,28,46,.08);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1524; --card:#182238; --card2:#1F2B45; --ink:#F0F3FA; --ink2:#B7C0D3; --ink3:#77839C;
    --line:#2D3A57; --accent:#F0C458; --accent-soft:#3D3113; --accent-ink:#FFE39A;
    --good:#4CC57F; --good-soft:#153826; --bad:#F0655A; --bad-soft:#4A1F1B;
    --track:#0A0F1C; --track-line:#F0C458; --grass:#1E3A2A;
    --shadow:0 2px 6px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1524; --card:#182238; --card2:#1F2B45; --ink:#F0F3FA; --ink2:#B7C0D3; --ink3:#77839C;
  --line:#2D3A57; --accent:#F0C458; --accent-soft:#3D3113; --accent-ink:#FFE39A;
  --good:#4CC57F; --good-soft:#153826; --bad:#F0655A; --bad-soft:#4A1F1B;
  --track:#0A0F1C; --track-line:#F0C458; --grass:#1E3A2A;
  --shadow:0 2px 6px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:Rubik,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.heb{font-family:"Frank Ruhl Libre","Noto Serif Hebrew","Times New Roman",serif;direction:rtl;unicode-bidi:isolate;font-weight:700;line-height:1.35}
@font-face{font-family:"Rashi Local";src:url(fonts/noto-rashi-hebrew-hebrew-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Rashi Local";src:url(fonts/noto-rashi-hebrew-hebrew-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
.heb.rashi{font-family:"Rashi Local","Noto Rashi Hebrew","Frank Ruhl Libre",serif;font-weight:700}
.choices.six{grid-template-columns:repeat(3,1fr)}
.choice.heb{font-size:54px;line-height:1.15;padding:8px}
.pair{display:flex;gap:16px;align-items:center;justify-content:center}
.pair .heb{font-size:64px}
.pair .arrow{color:var(--ink3);font-size:24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input{font:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#app{min-height:100%;display:flex;flex-direction:column;max-width:900px;margin:0 auto;padding:0 16px 32px}
@media (max-width:640px){ #app{padding-bottom:calc(210px + env(safe-area-inset-bottom,0px)) } }
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 8px;position:sticky;top:0;background:var(--ground);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:900;letter-spacing:.02em}
.brand .heb{font-size:26px;color:var(--accent);font-weight:900;line-height:1}
.brand span{font-size:15px;color:var(--ink2)}
.stats{display:flex;gap:6px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;background:var(--card);box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.pill.gold{background:var(--accent-soft);color:var(--accent-ink)}
.pill.fire{color:var(--bad)}
.pill.time{color:var(--ink2)} .pill.time.done{background:var(--good-soft);color:var(--good)}
/* the prize shelf, a tap away from the stars it is spent on */
.pill.shelf{border:0;font:inherit;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink2)}
.pill.shelf:hover{color:var(--ink)}
.pill.shelf.ready{background:var(--sun-soft,#FFF4D8);color:#8A5B00;box-shadow:0 0 0 2px var(--gold,#F2D46B) inset}
.shelf-n{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;
  border-radius:99px;background:var(--gold,#F2D46B);color:#5A3B00;font-size:11.5px;font-weight:900}
/* On a phone the row has to fit: the logo already goes home, and the streak is on
   his shelf — so those two step aside rather than pushing everything onto a
   second line. */
@media(max-width:560px){ .pill.shelf{padding:6px 9px} .stats .homebtn{display:none} .stats .pill.fire{display:none} }
.iconbtn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink2)}
.iconbtn:hover{color:var(--ink)}
h1{font-size:28px;font-weight:900;margin:18px 0 4px;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px;font-weight:700;margin:22px 0 10px}
h3{font-size:16px;font-weight:700;margin:0}
.sub{color:var(--ink2);margin:0 0 14px;max-width:60ch}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}

/* race track */
.track{position:relative;height:54px;background:var(--track);border-radius:14px;overflow:hidden;box-shadow:inset 0 2px 8px rgba(0,0,0,.35)}
.track:before{content:"";position:absolute;left:0;right:0;top:50%;height:0;border-top:3px dashed var(--track-line);opacity:.8}
.track .flag{position:absolute;right:6px;top:6px;bottom:6px;width:22px;background:repeating-conic-gradient(#fff 0 25%,#111 0 50%) 0 0/11px 11px;border-radius:4px;opacity:.95}
.track .carpos{position:absolute;top:50%;height:44px;width:96px;transform:translate(-8px,-50%);transition:left .45s cubic-bezier(.3,1.3,.5,1);filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.track .carpos.boost:after{content:"";position:absolute;left:-26px;top:16px;width:30px;height:14px;background:linear-gradient(90deg,transparent,#FF8A00,#FFD54F);border-radius:8px 0 0 8px;animation:flame .25s ease infinite alternate}
@keyframes flame{from{transform:scaleX(.7);opacity:.7}to{transform:scaleX(1.2);opacity:1}}
.track .dots{position:absolute;left:10px;right:36px;bottom:5px;display:flex;gap:3px}
.track .dots i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.18)}
.track .dots i.ok{background:var(--good)} .track .dots i.no{background:var(--bad)}
.carimg{display:block;width:100%;height:100%}
.carimg img{display:block;width:100%;height:100%;object-fit:contain}
.carimg svg{display:none;width:100%;height:100%}
.carimg.nocustom img{display:none} .carimg.nocustom svg{display:block}

/* home */
.hero{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero .word{font-size:clamp(50px,11vw,84px);line-height:1.25;flex:1;text-align:center;min-width:180px}
.hero .side{display:flex;flex-direction:column;gap:8px;align-items:center;min-width:150px}
.ring{width:84px;height:84px;flex:none}
.ring text{font:700 18px Rubik,sans-serif;fill:var(--ink);font-variant-numeric:tabular-nums}
.ring .bg{stroke:var(--line);fill:none;stroke-width:6}
.ring .fg{stroke:var(--accent);fill:none;stroke-width:6;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset .5s ease}
.goal{display:flex;flex-direction:column;gap:8px}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.goal b{font-size:18px;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px;align-items:center}
.chip{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px;box-shadow:var(--shadow);border:2px solid transparent;color:var(--ink2)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip .lvlbadge{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-left:6px;background:var(--good);color:#fff;padding:1px 6px;border-radius:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:12px}
.mode{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;flex-direction:column;gap:4px;border:2px solid transparent}
.mode:hover{border-color:var(--accent)}
.mode.main{grid-column:1/-1;background:var(--accent);color:#1A1200}
.mode.main small{color:#3B2A00}
.mode.main .tag{background:rgba(0,0,0,.12);color:#1A1200}
.mode b{font-size:17px}
.mode small{color:var(--ink2);font-size:13px}
.mode .tag{align-self:flex-start;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:2px 7px;border-radius:6px;margin-bottom:4px}
.notice{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-size:14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notice.ok{background:var(--good-soft);color:var(--good)}
.notice.gold{background:var(--accent-soft);color:var(--accent-ink)}
.mline{border-radius:8px;padding:2px 6px;transition:background .3s,box-shadow .3s}
.mline.hl{background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.mline.synct{cursor:pointer}
.mline .tstamp{color:var(--good);font-size:12px;font-weight:700;margin-inline-start:6px;font-family:ui-monospace,monospace}
.notice b{font-weight:900}
.notice .btn{padding:6px 10px;font-size:13px}

/* kid home */
.kidhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:10px}
.kidhead h1{margin:0;font-size:30px}
.kidhead .lvl{font-size:13px;color:var(--ink2);font-weight:500}
.racebtn{width:100%;border-radius:28px;background:linear-gradient(180deg,#F6D26B,#D9A00E);color:#1A1200;box-shadow:0 6px 0 #9A6F00,var(--shadow);padding:22px 20px;display:flex;align-items:center;gap:18px;text-align:left;transition:transform .08s}
.racebtn:active{transform:translateY(4px);box-shadow:0 2px 0 #9A6F00}
.racebtn .carimg{width:120px;height:56px;flex:none}
.racebtn b{font-size:30px;font-weight:900;display:block;line-height:1.05}
.racebtn small{font-size:15px;font-weight:500;opacity:.85}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.game{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent;font-weight:700;font-size:15px;text-align:center}
.game:hover{border-color:var(--accent)} .game:active{transform:scale(.97)}
.game .ico{font-size:34px;line-height:1}
.game small{font-weight:500;color:var(--ink2);font-size:12px}
.lap{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:10px}
.lap .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lap .row b{font-size:20px;font-variant-numeric:tabular-nums}
.lap .row .eyebrow{font-size:13px}
.bigmarks .mark{font-size:44px;padding:18px}
.bigmarks .mark small{font-size:15px}
.gate{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:24px;max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:12px;text-align:center}
.gate input{font-size:28px;text-align:center;letter-spacing:.3em;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:var(--ink);width:100%}
/* chores */
.chores{display:flex;flex-direction:column;gap:6px}
.chore{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:var(--card2);text-align:left;border:2px solid transparent}
.chore:hover{border-color:var(--line)}
.chore .box{width:32px;height:32px;font-size:18px;border-radius:8px;border:2px solid var(--ink3);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;flex:none}
.chore.done .box{background:var(--good);border-color:var(--good)}
.chore.done .name{text-decoration:line-through;color:var(--ink3)}
.chore .name{flex:1;font-weight:500;font-size:17px}
.chore .emo{font-size:26px;width:34px;text-align:center;flex:none}
.chore .pts{font-size:12px;color:var(--accent-ink);font-weight:700}
.chore.auto{opacity:.9}

/* garage */
.garage{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.carcard{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent;position:relative}
.carcard .carimg{height:64px}
.carcard.sel{border-color:var(--accent)}
.carcard.locked{opacity:.55}
.carcard.locked .carimg{filter:grayscale(1)}
.carcard b{font-size:14px}
.carcard small{color:var(--ink2);font-size:12px}
.carcard .lock{position:absolute;top:8px;right:10px;font-size:16px}

/* drill */
.drill{display:flex;flex-direction:column;gap:14px;flex:1}
.prompt{color:var(--ink2);font-weight:500;text-align:center;min-height:22px}
.stage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;gap:6px}
.stage .bigword{font-size:clamp(56px,14vw,116px);line-height:1.3;padding:.05em .1em}
.stage .translit{font-size:26px;font-weight:700;color:var(--accent-ink);min-height:34px;letter-spacing:.02em;visibility:hidden}
.stage .translit.show{visibility:visible}
.stage.flash-ok{animation:flashok .5s ease}
.stage.flash-no{animation:flashno .5s ease}
@keyframes flashok{0%{box-shadow:0 0 0 0 var(--good)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes flashno{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.speak{position:absolute;top:14px;left:14px;width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent-ink);font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.speak.playing{animation:pulse .8s ease infinite}
.btn.playing{animation:pulse .8s ease infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:18px 10px;font-size:22px;font-weight:700;text-align:center;border:3px solid transparent;transition:transform .08s ease,border-color .1s;min-height:72px;display:flex;align-items:center;justify-content:center}
.choice:hover{border-color:var(--line)} .choice:active{transform:scale(.97)}
.choice.ok{border-color:var(--good);background:var(--good-soft)} .choice.no{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.feedback{text-align:center;min-height:28px;font-weight:700;font-variant-numeric:tabular-nums}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
.hint{text-align:center;color:var(--ink2);font-size:14px;min-height:20px}
.bigbtn{border-radius:20px;padding:22px;font-size:24px;font-weight:900;box-shadow:var(--shadow);transition:transform .08s;display:flex;flex-direction:column;align-items:center;gap:2px}
.bigbtn:active{transform:scale(.97)}
.bigbtn small{font-size:13px;font-weight:500;opacity:.85}
.bigbtn.hear{background:var(--accent);color:#1A1200;width:100%}
.marks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mark{border-radius:18px;padding:22px;font-size:26px;font-weight:900;color:#fff;box-shadow:var(--shadow);transition:transform .08s}
.mark:active{transform:scale(.97)}
.mark.good{background:var(--good)} .mark.bad{background:var(--bad)}
.mark small{display:block;font-size:13px;font-weight:500;opacity:.9}

/* speed row */
.rowstage{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;direction:rtl}
.rowstage .it{font-size:clamp(30px,7vw,56px);padding:2px 10px;border-radius:12px;border:3px solid transparent;color:var(--ink3);transition:color .15s,border-color .15s}
.rowstage .it.cur{color:var(--ink);border-color:var(--accent);background:var(--accent-soft)}
.rowstage .it.ok{color:var(--good)} .rowstage .it.no{color:var(--bad)}
.timer{font-size:40px;font-weight:900;font-variant-numeric:tabular-nums;text-align:center;letter-spacing:.02em}
.timer.running{color:var(--accent)}

/* sheet */
.sheet{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:18px 14px;display:flex;flex-direction:column;gap:6px}
.sheet .row{display:flex;direction:rtl;justify-content:space-around;gap:6px;border-bottom:1px dashed var(--line);padding:6px 0}
.sheet .row:last-child{border-bottom:0}
.cell{display:flex;flex-direction:column;align-items:center;border-radius:12px;padding:4px 8px;min-width:64px;flex:1}
.cell:hover{background:var(--card2)}
.cell .g{font-size:clamp(28px,5.5vw,44px)}
.cell .t{font-size:13px;color:var(--accent-ink);font-weight:700;min-height:18px;direction:ltr;font-family:Rubik,sans-serif;visibility:hidden}
.cell.show .t{visibility:visible}
/* a timed run over the sheet: the word he is on, and the seconds each took */
.sheet.running .cell{opacity:.45;transition:.15s ease}
.sheet.running .cell.done{opacity:1}
.sheet.running .cell.cur{opacity:1;background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent);transform:scale(1.04)}
.sheet.running .cell .t{visibility:visible;color:var(--ink3);font-size:15px;font-weight:800;min-height:18px}
.sheet.running .cell.ok .t{color:var(--good)}
.sheet.running .cell.no .t{color:var(--bad)}
.sheet.running .cell.no .g{color:var(--bad)}
.shrun{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:2px 0 10px}
/* the robot never says he read it wrong - when it cannot tell, it points at the
   button that settles it, and points hard enough for a six-year-old to notice */
@keyframes nudgepulse{0%,100%{transform:scale(1)}45%{transform:scale(1.09)}}
.nudge{animation:nudgepulse .7s ease-in-out 4;box-shadow:0 0 0 4px var(--accent)!important;position:relative;z-index:2}
.shrun-n{font-size:34px;font-weight:800;color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.shrun-n small{display:block;font-size:12px;font-weight:700;color:var(--ink3)}
.shrun-tx b{display:block;font-size:15px}
.shrun-tx small{color:var(--ink2);font-size:13px}
.slowlist{display:flex;flex-direction:column;gap:6px;margin-top:6px;text-align:right}
.slowrow{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:8px 12px;width:100%}
.slowrow .heb{font-size:26px;flex:1;text-align:right}
.slowrow .slow-t{font-size:12.5px;color:var(--accent-ink);font-weight:700;direction:ltr}
.slowrow .slow-s{font-weight:800;color:var(--ink2);min-width:44px;text-align:left}
.slowrow.no .heb{color:var(--bad)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:11px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;border:2px solid transparent}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--accent);color:#1A1200}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.btn.danger{color:var(--bad)}
.btn.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.btn.small{padding:6px 10px;font-size:13px}

/* results */
.result{background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.stars{font-size:44px;letter-spacing:.1em;color:var(--accent)} .stars .dim{color:var(--line)}
.result .big-num{font-size:52px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1}
.result .missed{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;direction:rtl}
.result .missed button{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:4px 12px;font-size:30px;display:flex;flex-direction:column;align-items:center}
.result .missed small{font-family:Rubik;font-size:12px;direction:ltr;color:var(--ink2)}

/* parent */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;direction:rtl}
.gcell{background:var(--card2);border-radius:10px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;border:2px solid transparent}
.gcell .g{font-size:22px;line-height:1.2}
.gcell .n{font-size:10.5px;color:var(--ink2);direction:ltr;font-family:Rubik;font-variant-numeric:tabular-nums}
.gcell.m1{background:var(--bad-soft);border-color:var(--bad)} .gcell.m2{background:var(--accent-soft)} .gcell.m3{background:var(--good-soft);border-color:var(--good)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2);margin:8px 0 0}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px}
.kpi b{display:block;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink2)}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.gauge{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:8px;border:2px solid transparent}
.gauge.cur{border-color:var(--accent)}
.gauge.ready{border-color:var(--good)}
.gauge .bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.gauge .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.gauge .bar i.g{background:var(--good)}
.gauge .line{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2)}
.gauge .line b{color:var(--ink);font-variant-numeric:tabular-nums}
.gauge .status{font-size:13px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{background:var(--card2);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;display:flex;flex-direction:column;gap:2px;border:2px solid transparent}
.day b{font-size:15px;font-variant-numeric:tabular-nums}
.day.before{opacity:.35} .day.met{background:var(--good-soft);border-color:var(--good)} .day.missed{background:var(--bad-soft);border-color:var(--bad)} .day.skip{opacity:.5} .day.excused{background:var(--accent-soft)} .day.today{border-color:var(--accent)}
.day small{color:var(--ink2);font-size:10.5px}
.day button{font-size:10.5px;color:var(--accent-ink);text-decoration:underline}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
.tablewrap{overflow-x:auto}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow small{color:var(--ink2)}
.seg{display:inline-flex;background:var(--card2);border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:8px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.empty{color:var(--ink3);font-style:italic}
.editlist{display:flex;flex-direction:column;gap:6px}
.editlist .row{display:flex;gap:8px;align-items:center;background:var(--card2);border-radius:10px;padding:6px 10px}
.editlist .row span{flex:1}
.editlist input{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:14px 22px;border-radius:16px;font-weight:700;box-shadow:var(--shadow);z-index:60;text-align:center;max-width:90vw}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50}
.matchwrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:70;pointer-events:none}
.matchmark{width:min(60vw,300px);height:min(60vw,300px);border-radius:50%;background:var(--good);color:#fff;font-size:min(38vw,190px);font-weight:900;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 60px rgba(31,138,76,.55);animation:bigpop 1s ease forwards}
.matchmark.miss{background:var(--accent);color:#1A1200;box-shadow:0 10px 60px rgba(176,124,10,.5)}
@keyframes bigpop{0%{transform:scale(.15);opacity:0}22%{transform:scale(1.12);opacity:1}45%{transform:scale(.98)}75%{opacity:1}100%{transform:scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:480px){.brand span:not(.heb){display:none}.choice{font-size:18px;padding:14px 6px}.stats .pill{padding:5px 8px;font-size:12.5px}.track .carpos{width:76px;height:36px}}
/* the Shabbos sheets: made to be printed, so they are laid out as pages even on
   the screen — one page per thing to do, nothing on them that needs writing */
.shb-page{background:#fff;color:#111;border:1px solid var(--line);border-radius:14px;
  padding:22px 26px;margin:0 0 18px;max-width:820px}
.shb-head{border-bottom:2px solid #222;padding-bottom:8px;margin-bottom:12px}
.shb-head b{display:block;font-size:19px}
.shb-head small{color:#555}
.shb-sub{color:#444;font-size:14px;line-height:1.5;margin:0 0 14px}
.shb-grid{list-style:none;counter-reset:shb;padding:0;margin:0;display:grid;
  grid-template-columns:repeat(4,1fr);gap:10px 12px;direction:rtl}
.shb-grid li{counter-increment:shb;border:1px solid #ddd;border-radius:10px;padding:10px 8px;
  text-align:center;position:relative;min-height:56px;display:flex;align-items:center;justify-content:center}
.shb-grid li::before{content:counter(shb);position:absolute;top:3px;inset-inline-start:7px;
  font-size:11px;color:#999;direction:ltr}
.shb-grid .heb{font-size:30px;line-height:1.35;color:#111}
.shb-grid.rashi .heb{font-size:32px}
.shb-key{margin-top:14px;padding-top:8px;border-top:1px dashed #bbb;color:#777;font-size:11px;line-height:1.6}
.shb-lines{margin:0;padding-inline-start:22px}
.shb-lines li{margin:0 0 10px;direction:rtl;text-align:right}
.shb-lines .heb{font-size:23px;line-height:1.6;color:#111}
.shb-lines small{display:block;direction:ltr;text-align:left;color:#666;font-size:13px;margin-top:2px}
.shb-rletters{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;direction:rtl}
.shb-rletters div{border:1px solid #ddd;border-radius:10px;padding:8px 4px;text-align:center}
.shb-rletters .heb{font-size:30px;display:block;color:#111}
.shb-rletters small{color:#777;font-size:10.5px}
@media (max-width:620px){.shb-grid{grid-template-columns:repeat(2,1fr)}.shb-rletters{grid-template-columns:repeat(4,1fr)}}
/* print: a clean paper version of the progress report */
.printhead{display:none}
@media print {
  body{background:#fff !important; color:#111}
  .topbar, .toolbar, button, input, select, .hint{display:none !important}
  .printhead{display:block !important; margin:0 0 14px; padding-bottom:10px; border-bottom:2px solid #222}
  .printhead b{font-size:20px}
  .printhead small{color:#555}
  .kpis{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
  .kpi, .card{border:1px solid #ccc !important; box-shadow:none !important; background:#fff !important; page-break-inside:avoid}
  h1{font-size:20px} h2{page-break-after:avoid; font-size:15px; margin:14px 0 6px}
  .tablewrap{overflow:visible !important}
  svg{max-width:100% !important}
  a{text-decoration:none; color:inherit}
  /* one Shabbos sheet per sheet of paper */
  h1, p.sub{display:none !important}
  .shb-page{border:0 !important;border-radius:0 !important;padding:0 !important;margin:0 !important;
    page-break-after:always;break-after:page}
  .shb-page:last-child{page-break-after:auto;break-after:auto}
  .shb-grid li, .shb-rletters div{border:1px solid #999 !important}
}
/* ========================================================================== */
/* 2026 PRODUCT REDESIGN — professional, warm, kid-first                    */
/* ========================================================================== */
:root{
  --ground:#F6F8FC;
  --card:#FFFFFF;
  --card2:#F4F7FB;
  --ink:#162238;
  --ink2:#5A687E;
  --ink3:#8F9AAF;
  --line:#E2E8F0;
  --accent:#5B67E8;
  --accent2:#7C84F3;
  --accent-soft:#EEF0FF;
  --accent-ink:#414BC2;
  --sun:#F7B84B;
  --sun-soft:#FFF4D8;
  --good:#20A567;
  --good-soft:#E6F7EF;
  --bad:#E05252;
  --bad-soft:#FDECEC;
  --aqua:#38B9C7;
  --aqua-soft:#E5F8FA;
  --purple:#8D62D9;
  --purple-soft:#F2EBFC;
  --track:#263451;
  --track-line:#F6C85C;
  --grass:#CFEFD9;
  --shadow:0 10px 30px rgba(32,49,82,.07),0 2px 8px rgba(32,49,82,.05);
  --shadow-sm:0 4px 14px rgba(32,49,82,.07);
  --shadow-pop:0 14px 35px rgba(73,82,199,.20);
  --r:22px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101626;--card:#182136;--card2:#202B43;--ink:#F5F7FC;--ink2:#BCC5D7;--ink3:#7F8DA6;
    --line:#2D3952;--accent:#9097FF;--accent2:#A5AAFF;--accent-soft:#292E59;--accent-ink:#C9CCFF;
    --sun:#F3C35A;--sun-soft:#3C321C;--good:#55CB8D;--good-soft:#173A2B;--bad:#F17777;--bad-soft:#482323;
    --aqua:#62D2DC;--aqua-soft:#17383E;--purple:#B18AEE;--purple-soft:#34274B;--track:#0B1220;--track-line:#F3C35A;
    --shadow:0 12px 34px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.20);--shadow-sm:0 4px 14px rgba(0,0,0,.2);
  }
}
:root[data-theme="dark"]{
  --ground:#101626;--card:#182136;--card2:#202B43;--ink:#F5F7FC;--ink2:#BCC5D7;--ink3:#7F8DA6;
  --line:#2D3952;--accent:#9097FF;--accent2:#A5AAFF;--accent-soft:#292E59;--accent-ink:#C9CCFF;
  --sun:#F3C35A;--sun-soft:#3C321C;--good:#55CB8D;--good-soft:#173A2B;--bad:#F17777;--bad-soft:#482323;
  --aqua:#62D2DC;--aqua-soft:#17383E;--purple:#B18AEE;--purple-soft:#34274B;--track:#0B1220;--track-line:#F3C35A;
  --shadow:0 12px 34px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.20);--shadow-sm:0 4px 14px rgba(0,0,0,.2);
}
body{
  background:
    radial-gradient(circle at 8% 0%,rgba(91,103,232,.10),transparent 28rem),
    radial-gradient(circle at 100% 20%,rgba(56,185,199,.08),transparent 25rem),
    var(--ground);
  background-attachment:fixed;background-repeat:no-repeat;
  font-size:16px;
}
#app{max-width:1040px;padding:0 22px 48px}
.topbar{
  padding:16px 0 12px;
  background:color-mix(in srgb,var(--ground) 86%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid color-mix(in srgb,var(--line) 72%, transparent);
}
.brand{align-items:center;gap:10px;letter-spacing:-.01em}
.brandlogo{height:56px;width:auto;display:block;filter:drop-shadow(0 3px 8px rgba(20,30,60,.25))}
@media(max-width:480px){.brandlogo{height:44px}}
.brand .heb{
  width:48px;height:48px;border-radius:15px;display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(145deg,var(--accent),var(--purple));color:#fff;font-size:23px;
  box-shadow:0 7px 18px rgba(91,103,232,.24);position:relative;overflow:hidden;
}
.brand .heb:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.14);right:-12px;top:-10px}
.brand span:last-child{font-size:17px;color:var(--ink);font-weight:900}
.stats{gap:8px}
.pill,.iconbtn{box-shadow:none;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 94%,transparent)}
.pill{padding:7px 11px;font-size:13px}.pill.gold{background:var(--sun-soft);color:#9A6200;border-color:transparent}.pill.fire{background:var(--bad-soft);border-color:transparent}.pill.time.done{background:var(--good-soft);border-color:transparent}
.iconbtn{border-radius:14px;height:42px;transition:.18s ease}.iconbtn:hover{transform:translateY(-1px);border-color:var(--accent);color:var(--accent-ink)}
h1{font-size:clamp(28px,4vw,38px);letter-spacing:-.035em;margin:24px 0 5px;line-height:1.12}
h2{font-size:21px;letter-spacing:-.015em;margin-top:28px}.sub{font-size:15px;line-height:1.6}.eyebrow{color:var(--accent-ink);font-size:11px;letter-spacing:.14em}
.card,.hero,.lap,.stage,.sheet,.result,.gate{border:1px solid var(--line);box-shadow:var(--shadow)}

/* kid dashboard */
.kidhead{margin-top:22px;margin-bottom:14px;align-items:center}.kidhead h1{font-size:clamp(30px,5vw,43px);letter-spacing:-.045em}.kidhead .lvl{background:var(--accent-soft);color:var(--accent-ink);padding:7px 11px;border-radius:999px;font-weight:700}
.lap{padding:20px;border-radius:24px;gap:14px;position:relative;overflow:hidden}.lap:after{content:"";position:absolute;right:-30px;top:-50px;width:150px;height:150px;border-radius:50%;background:var(--accent-soft);opacity:.45;pointer-events:none}.lap .row{position:relative;z-index:1}.lap .row b{font-size:18px}
.track{height:62px;border-radius:18px;border:4px solid color-mix(in srgb,var(--track) 88%,white);box-shadow:inset 0 2px 8px rgba(0,0,0,.28)}.track .carpos{height:49px;width:104px}.track .flag{right:8px;top:7px;bottom:7px;border-radius:6px}
.racebtn{
  margin-top:16px!important;border-radius:24px!important;background:linear-gradient(135deg,var(--accent),#747EF3)!important;color:#fff!important;
  box-shadow:0 8px 0 #414BC2,var(--shadow-pop)!important;padding:23px 24px;min-height:108px;border:1px solid rgba(255,255,255,.2);
}
.racebtn:hover{transform:translateY(-2px)}.racebtn:active{transform:translateY(5px);box-shadow:0 3px 0 #414BC2,var(--shadow-sm)!important}.racebtn b{font-size:31px;letter-spacing:-.035em}.racebtn small{font-size:14px;opacity:.92;line-height:1.4}.racebtn .carimg{width:128px;height:64px;filter:drop-shadow(0 8px 7px rgba(0,0,0,.22))}
.games{gap:12px;margin-top:14px}.game{border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:18px 11px;min-height:115px;justify-content:center;transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}.game:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line));box-shadow:var(--shadow)}.game .ico{font-size:36px;margin-bottom:3px}.game small{font-size:12px;line-height:1.35}.games .game:nth-child(1){background:linear-gradient(180deg,var(--card),var(--aqua-soft))}.games .game:nth-child(2){background:linear-gradient(180deg,var(--card),var(--sun-soft))}.games .game:nth-child(3){background:linear-gradient(180deg,var(--card),var(--purple-soft))}
.games .game[style*="grid-column:1/-1"]{min-height:78px;justify-content:flex-start!important;text-align:left;padding:14px 20px;background:var(--card);border-left:4px solid var(--accent)}
.notice{border-radius:16px;padding:12px 15px;border:1px solid color-mix(in srgb,var(--bad) 18%,transparent)}.notice.ok{border-color:color-mix(in srgb,var(--good) 18%,transparent)}.notice.gold{border-color:color-mix(in srgb,var(--sun) 25%,transparent)}
.chip{box-shadow:none;border:1px solid var(--line);padding:8px 13px}.chip.on{border-color:var(--accent)}

/* chores */
.chores{gap:9px}.chore{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;box-shadow:var(--shadow-sm);transition:.15s ease}.chore:hover{transform:translateX(3px);border-color:var(--accent)}.chore .emo{width:42px;height:42px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center}.chore .name{font-weight:650}.chore .pts{background:var(--sun-soft);color:#946000;border-radius:999px;padding:4px 8px}.chore .box{border-radius:10px;border-color:var(--line);background:var(--card2)}.chore.done{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 25%,var(--line))}.chore.done .box{border-color:var(--good)}

/* practice / drills */
.drill{gap:16px}.prompt{font-weight:650;font-size:15px}.stage{border-radius:28px;min-height:270px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--accent-soft) 25%,var(--card)));position:relative}.stage:after{content:"";position:absolute;inset:10px;border:1px dashed color-mix(in srgb,var(--accent) 18%,transparent);border-radius:20px;pointer-events:none}.stage .bigword{position:relative;z-index:1}.stage .translit{color:var(--accent-ink)}.speak{z-index:2;border-radius:15px;background:var(--accent);color:#fff;box-shadow:0 6px 16px rgba(91,103,232,.22)}
.choices{gap:12px}.choice{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);min-height:82px;background:var(--card);transition:.15s ease}.choice:hover{border-color:var(--accent);transform:translateY(-2px)}.choice.ok{border:2px solid var(--good)}.choice.no{border:2px solid var(--bad)}
.bigbtn{border-radius:18px}.bigbtn.hear{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:var(--shadow-pop)}.mark{border-radius:18px;box-shadow:var(--shadow-sm)}
.rowstage{border:1px solid var(--line);border-radius:26px}.rowstage .it.cur{border-color:var(--accent);background:var(--accent-soft)}.timer{color:var(--ink)}.timer.running{color:var(--accent)}

/* buttons, toolbars and forms */
.btn{box-shadow:none;border:1px solid var(--line);border-radius:13px;min-height:42px;transition:.15s ease}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 7px 16px rgba(91,103,232,.20)}.btn.ghost{border-color:transparent}.btn.on{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
input,select,textarea{border-radius:12px!important;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--ink)!important;box-shadow:inset 0 1px 2px rgba(20,30,50,.03)}

/* garage + rewards */
.garage{gap:14px}.carcard{border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-sm);padding:15px;min-height:124px;transition:.16s ease}.carcard:hover:not(.locked){transform:translateY(-3px);border-color:var(--accent)}.carcard.sel{border:2px solid var(--accent);background:var(--accent-soft);box-shadow:0 10px 24px rgba(91,103,232,.14)}.carcard .carimg{height:70px}.carcard.locked{opacity:.64;background:var(--card2)}

/* results / parent */
.result{padding:34px;border-radius:28px;background:linear-gradient(180deg,var(--card),color-mix(in srgb,var(--sun-soft) 30%,var(--card)))}.stars{color:var(--sun);filter:drop-shadow(0 4px 7px rgba(247,184,75,.18))}.result .big-num{letter-spacing:-.05em}.gcell{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:8px 5px}.gcell.m1{border-color:var(--bad)}.gcell.m3{border-color:var(--good)}
.sheet{border-radius:26px;padding:20px}.cell{border-radius:14px}.cell:hover{background:var(--accent-soft)}

/* landing + setup polish */
.hero{border-radius:30px;padding:26px}.hero .word{color:var(--ink)}.ring .fg{stroke:var(--accent)}.mode{border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm);padding:18px;transition:.16s ease}.mode:hover{transform:translateY(-2px);border-color:var(--accent)}.mode.main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0}.mode.main small,.mode.main .tag{color:#fff}.mode.main .tag{background:rgba(255,255,255,.18)}.gate{border-radius:28px;padding:30px}.gate input{border:1px solid var(--line);background:var(--card)}

/* restrained motion + responsive */
@media (max-width:720px){
  #app{padding:0 14px 34px}.topbar{padding-top:10px;align-items:flex-start}.brand .heb{width:42px;height:42px;border-radius:13px;font-size:20px}.brand span:last-child{display:none}.stats{gap:5px;flex-wrap:wrap;justify-content:flex-end}.pill{padding:6px 8px;font-size:12px}.iconbtn{height:36px;border-radius:11px}.pctrl-lbl{display:none}.kidhead{margin-top:16px}.kidhead h1{font-size:31px}.lap{padding:16px}.track{height:58px}.racebtn{padding:20px 16px;gap:12px;min-height:98px}.racebtn .carimg{width:100px;height:54px}.racebtn b{font-size:27px}.games{grid-template-columns:1fr 1fr}.game{min-height:108px}.games .game:nth-child(3){grid-column:1/-1;min-height:82px;flex-direction:row;gap:12px}.games .game[style*="grid-column:1/-1"]{grid-column:1/-1}.choice{min-height:75px}.choice.heb{font-size:44px}.stage{min-height:235px}.pair .heb{font-size:52px}
}
@media (max-width:440px){.stats .pill.fire{display:none}.games{gap:9px}.game{padding:14px 8px}.game .ico{font-size:32px}.racebtn .carimg{width:86px}.racebtn small{font-size:12px}.chore{padding:11px 12px}.chore .name{font-size:15px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}}


/* Full redesign */
:root{--ground:#F6F8FF;--card:#fff;--card2:#F1F4FF;--ink:#18213D;--ink2:#66708A;--ink3:#9AA3B8;--line:#E3E8F4;--accent:#6257E8;--accent-soft:#ECEAFF;--accent-ink:#4036B6;--shadow:0 10px 30px rgba(49,57,107,.08);--r:22px}body{background:radial-gradient(42rem 30rem at 12% -6rem,#E9E6FF 0,transparent 100%),radial-gradient(38rem 28rem at 90% -4rem,#E3F4FF 0,transparent 100%),var(--ground);background-attachment:fixed;background-repeat:no-repeat}#app{max-width:1080px;padding:0 22px 48px}.topbar{padding:16px 0 12px;background:rgba(246,248,255,.88);backdrop-filter:blur(16px)}.brand .heb{font-size:20px;color:var(--ink)}h1{font-size:34px;letter-spacing:-.035em}.kid-shell{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:22px;margin-top:12px}.kid-side{display:flex;flex-direction:column;gap:16px}.welcome{display:flex;justify-content:space-between;align-items:center;margin:6px 0 18px}.welcome h1{margin:0}.welcome p{margin:4px 0;color:var(--ink2)}.avatar{width:64px;height:64px;border-radius:22px;background:#FFE08A;display:grid;place-items:center;font-size:34px}.quest{position:relative;overflow:hidden;border-radius:30px;padding:28px;background:linear-gradient(135deg,#6257E8,#756AF0 55%,#4F8BE8);color:#fff;box-shadow:0 18px 45px rgba(86,76,210,.22)}.quest:after{content:'א';position:absolute;right:-12px;bottom:-65px;font:900 210px 'Frank Ruhl Libre',serif;color:rgba(255,255,255,.08)}.quest .eyebrow{color:#DCD8FF}.quest h2{font-size:32px;margin:6px 0 8px}.quest p{color:#E7E5FF}.quest-progress{display:flex;align-items:center;gap:12px;margin:18px 0}.quest-bar{height:9px;flex:1;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}.quest-bar i{display:block;height:100%;background:#fff}.quest-go{position:relative;z-index:1;background:#fff;color:#4D43C8;padding:13px 20px;border-radius:15px;font-weight:900}.sectionhead{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 11px}.sectionhead h2{margin:0}.sectionhead span{font-size:13px;color:var(--ink2)}.learn-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.learn-card{min-height:116px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;text-align:left;display:flex;gap:14px;box-shadow:0 5px 18px rgba(49,57,107,.05)}.learn-card:hover{transform:translateY(-2px);border-color:#CFCBF9}.learn-card .li{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:25px;background:var(--accent-soft)}.learn-card:nth-child(2n) .li{background:#E7F7FF}.learn-card:nth-child(3n) .li{background:#FFF3D9}.learn-card b{display:block;font-size:16px;margin:3px 0 5px}.learn-card small{display:block;color:var(--ink2);font-size:12.5px}.learn-card.wide{grid-column:1/-1;min-height:auto}.sidecard{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 18px rgba(49,57,107,.05)}.sidecard h3{margin-bottom:12px}.mini-stat{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}.mini-stat span{color:var(--ink2);font-size:13px}.daily-ring{width:100px;height:100px;margin:5px auto 10px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--pct),#ECEFFA 0);position:relative}.daily-ring:before{content:'';position:absolute;inset:10px;border-radius:50%;background:#fff}.daily-ring strong{position:relative}.side-chores{display:flex;flex-direction:column;gap:7px}.side-chore{display:flex;align-items:center;gap:8px;width:100%;padding:8px;border-radius:12px;text-align:left}.side-chore:hover{background:var(--card2)}.side-chore .tick{width:25px;height:25px;border:2px solid var(--line);border-radius:8px;display:grid;place-items:center}.side-chore.done .tick{background:var(--good);color:#fff}.side-chore .cn{font-size:13px;flex:1}.side-chore.done .cn{text-decoration:line-through;color:var(--ink3)}.side-chore .cp{font-size:11px;color:var(--accent-ink);font-weight:700}@media(max-width:820px){.kid-shell{grid-template-columns:1fr}.kid-side{display:grid;grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){#app{padding:0 14px 34px}.kid-side,.learn-grid{grid-template-columns:1fr}.learn-card.wide{grid-column:auto}.quest{padding:22px}.quest h2{font-size:27px}.brand span,.pctrl-lbl{display:none}}
/* ---- racing coach (mascot) ---- */

/* first-run setup checklist, pinned top right until fully complete */
#setupwidget{position:fixed;top:74px;right:12px;z-index:900;width:198px;background:var(--card);border:1.5px solid var(--accent);border-radius:14px;padding:11px 12px;box-shadow:0 10px 30px rgba(30,20,90,.18);font-size:13px}
#setupwidget .swhead{display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;margin-bottom:7px}
#setupwidget .swhead b{flex:1;font-weight:800}
#setupwidget .swcount{color:var(--accent);font-weight:800}
#setupwidget .swx{background:none;border:0;font:inherit;font-size:15px;line-height:1;color:var(--ink3);cursor:pointer;padding:0 2px}
#setupwidget.mini{width:auto;max-width:min(70vw,260px);padding:8px 12px;cursor:pointer}
#setupwidget.mini .swlist{display:none}
#setupwidget.mini .swhead{margin:0}
.setuptask{display:block;width:100%;text-align:left;background:none;border:0;padding:5px 2px;font:inherit;font-weight:600;color:#B3242F;cursor:pointer;border-radius:7px}
.setuptask:hover:not(:disabled){background:var(--accent-soft)}
.setuptask.ok{color:#177A43;cursor:default;text-decoration:line-through;opacity:.75}
@media (max-width:640px){#setupwidget{top:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:12px;right:auto;width:186px;font-size:12px}}
/* the simple screen for a child who cannot read the app yet: big targets, few words */
/* ==== THE RACETRACK LOOK (his home screen) =================================
   A child's home screen should read like the front of a game, not the front of a
   worksheet: sky behind it, a banner with his name and his own car on a track,
   his fuel and his stars where he can see them, and four fat coloured buttons
   for the four things he can do. Everything below the banner — the track, the
   jobs, the prizes — is the app as it was, dressed to match. */
body.kidsky{background:linear-gradient(180deg,#CFE7FF 0%,#E2F0FF 42%,var(--ground) 100%) no-repeat fixed;
  background-size:100% 100%}
body.kidsky .topbar{background:transparent;border-bottom:0;backdrop-filter:none}
.s-hero{position:relative;overflow:hidden;border-radius:26px;margin:2px 0 14px;
  background:linear-gradient(180deg,#5AB4FF 0%,#3E86F5 58%,#2E63D8 100%);
  box-shadow:0 14px 34px rgba(30,70,150,.28);color:#fff;isolation:isolate}
.s-hero-sky{position:absolute;inset:0;z-index:0}
.s-hero-sky svg{width:100%;height:100%;display:block}
.s-hero-in{position:relative;z-index:2;padding:16px 16px 0}
.s-hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.s-hero-hi b{display:block;font-size:clamp(20px,6.2vw,27px);line-height:1.12;letter-spacing:-.01em;
  text-shadow:0 2px 10px rgba(12,40,90,.35)}
.s-hero-hi span{display:block;font-size:14px;font-weight:700;opacity:.92;margin-top:3px}
.s-hero-gar,.s-hero-gar.s-garage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;
  background:rgba(255,255,255,.94);border:0;border-radius:16px;padding:6px 10px 5px;box-shadow:0 6px 16px rgba(10,30,70,.25)}
.s-hero-gar small{font-size:11px;font-weight:800;color:#5B6B85}
.s-hero-gar .s-garage-car{width:62px;height:32px;display:block;overflow:hidden}
.s-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.s-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.95);color:#1B2A44;
  border-radius:999px;padding:7px 13px;font-size:14px;font-weight:800;box-shadow:0 4px 12px rgba(10,30,70,.2)}
.s-chip.fuel{padding-inline-end:9px}
.s-chip .bar{display:block;width:74px;height:9px;border-radius:99px;background:#DCE4F2;overflow:hidden}
.s-chip .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC940,#FF9500)}
.s-hero-stage{position:relative;height:100px;margin-top:6px}
.s-hero-car{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);width:182px;height:80px;z-index:3;
  filter:drop-shadow(0 10px 14px rgba(5,20,50,.45))}
.s-hero-car .carimg{width:100%;height:100%}
.s-hero-car .carimg img,.s-hero-car .carimg svg{width:100%;height:100%;object-fit:contain}
.s-ribbon{position:relative;z-index:4;margin:0 -6px;transform:translateY(8px);
  background:linear-gradient(180deg,#FFD873,#F5A623);color:#402A00;text-align:center;
  font-size:14.5px;font-weight:900;letter-spacing:.01em;padding:9px 12px;
  border-top:2px solid rgba(255,255,255,.55);box-shadow:0 -4px 14px rgba(10,30,70,.18)}
@media (max-width:360px){ .s-hero-hi b{font-size:23px} .s-hero-car{width:140px;height:64px} .s-hero-stage{height:84px} }
/* the four big buttons */
.s-quad{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:0 0 16px}
.s-quad button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  border:0;border-radius:18px;padding:13px 4px 11px;cursor:pointer;font:inherit;font-size:13px;font-weight:800;
  color:#fff;line-height:1.15;text-align:center;box-shadow:0 8px 18px rgba(20,50,110,.22);
  transition:transform .12s ease, box-shadow .12s ease}
.s-quad button:active{transform:translateY(2px);box-shadow:0 4px 10px rgba(20,50,110,.2)}
.s-quad .qi{font-size:25px;line-height:1}
.s-quad .learn{background:linear-gradient(180deg,#45CC7A,#22A85C)}
.s-quad .race {background:linear-gradient(180deg,#4E9BFF,#2F6BFF)}
.s-quad .jobs {background:linear-gradient(180deg,#FFC24D,#F09000);color:#3A2600}
.s-quad .prize{background:linear-gradient(180deg,#A277FF,#7B2CBF)}
.s-quad button[disabled],.s-quad .shut{background:linear-gradient(180deg,#C8D2E4,#AAB7CC);color:#5B6B85;box-shadow:none;cursor:default}
/* when one of the four buttons sends him down the page, the thing it sent him to
   says so for a moment, or he has no idea what just happened */
@keyframes flashme{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,0)}
  20%,70%{box-shadow:0 0 0 5px rgba(47,107,255,.45)}}
.flashme{animation:flashme 1.4s ease-out}
@media (max-width:400px){ .s-quad{gap:7px} .s-quad button{font-size:11.5px;padding:11px 2px 9px} .s-quad .qi{font-size:22px} }
.simple{max-width:560px;margin:0 auto;padding:6px 4px 20px}
.s-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
.s-hello{font-size:26px;font-weight:800;text-align:left;flex:1 1 120px;min-width:0}
/* his car is his own corner of the screen, not one of the practice buttons */
.s-garage{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 10px 5px;box-shadow:var(--shadow-sm)}
.s-garage small{font-size:11.5px;font-weight:800;color:var(--ink3)}
.s-garage-car{width:64px;height:34px;display:block;overflow:hidden}
/* do NOT set display here: .carimg.nocustom img{display:none} is what hides the
   broken photo and shows the drawn car, and an equal-specificity rule beat it */
.s-garage-car .carimg{width:100%;height:100%}
.s-garage-car .carimg img,.s-garage-car .carimg svg{width:100%;height:100%;object-fit:contain}
@media (max-width:360px){ .s-hello{font-size:22px} .s-garage-car{width:52px;height:28px} }
.s-go{display:flex;align-items:center;gap:18px;width:100%;border:0;cursor:pointer;
  background:linear-gradient(135deg,#5B4BE0,#8B5CF6);color:#fff;border-radius:26px;
  padding:26px 24px;box-shadow:0 14px 34px rgba(70,50,190,.34);text-align:left}
.s-go:active{transform:scale(.98)}
.s-go-ic{font-size:60px;line-height:1}
.s-go-tx b{display:block;font-size:40px;font-weight:900;letter-spacing:.02em;line-height:1}
.s-go-tx small{display:block;font-size:19px;font-weight:600;opacity:.92;margin-top:3px}
.s-done{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--good-soft);
  color:var(--good);border-radius:26px;padding:24px}
.s-done b{font-size:26px}
.s-done small{font-size:16px;font-weight:600}
.s-fuel{margin:16px 2px 18px}
.s-fuel-bar{height:18px;background:var(--line);border-radius:99px;overflow:hidden}
.s-fuel-bar>i{display:block;height:100%;background:linear-gradient(90deg,#F2B24B,#F2D46B);transition:width .4s}
.s-fuel-tx{text-align:center;font-weight:800;font-size:17px;margin-top:6px;color:var(--ink2)}
.s-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.s-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  min-height:114px;border:2px solid var(--line);background:var(--card);color:var(--ink);
  border-radius:20px;font:inherit;font-weight:800;font-size:15px;line-height:1.2;text-align:center;cursor:pointer;padding:10px 6px}
.s-tile:active{transform:scale(.97)}
.s-tile-ic{font-size:40px;line-height:1}
.s-tile-ic.heb{font-family:"SBL Hebrew","Times New Roman",serif;direction:rtl}
.s-race{display:flex;align-items:center;gap:16px;width:100%;margin:0 0 16px;cursor:pointer;
  border:2px solid var(--gold,#F2D46B);background:var(--card);color:var(--ink);border-radius:22px;padding:18px 20px;text-align:left;font:inherit}
.s-race b{display:block;font-size:24px;font-weight:900}
.s-race small{display:block;font-size:15px;font-weight:600;color:var(--ink3)}
.s-race.shut{opacity:.6;cursor:default;border-color:var(--line)}
/* his jobs for the day — big enough to tap without help, and worth points */
.s-chores{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 8px;margin:16px 0 0;
  box-shadow:var(--shadow-sm)}
.s-chores.all{border-color:var(--good);background:var(--good-soft)}
.s-chores-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 9px}
.s-chores-hd b{font-size:19px;font-weight:900}
.s-chores-hd span{font-size:14px;font-weight:800;color:var(--ink3)}
.s-chores-list{display:flex;flex-direction:column;gap:7px}
.s-chore{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--card2);border:2px solid transparent;border-radius:14px;padding:10px 12px}
.s-chore-tick{flex:0 0 auto;width:28px;height:28px;border-radius:9px;border:2px solid var(--line);background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:#fff}
.s-chore-ic{font-size:22px;flex:0 0 auto}
.s-chore-nm{flex:1;font-size:17px;font-weight:800;color:var(--ink)}
.s-chore-pt{font-size:13px;font-weight:800;color:var(--ink3)}
.s-chore.on{background:var(--good-soft);border-color:var(--good)}
.s-chore.on .s-chore-tick{background:var(--good);border-color:var(--good)}
.s-chore.on .s-chore-nm{color:var(--good);text-decoration:line-through}
/* kriah as the box its games live in */
.s-goalbox{background:var(--card);border:2px solid var(--gold,#F2D46B);border-radius:22px;padding:12px 12px 14px;margin:0 0 14px;
  box-shadow:var(--shadow-sm)}
.s-goalbox.done{border-color:var(--good);background:var(--good-soft)}
.s-goalhd{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.s-goalic{flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:23px}
.s-goalbox.done .s-goalic{background:var(--good);color:#fff}
.s-goalnm{flex:1;font-size:21px;font-weight:900;line-height:1.1}
.s-goalnm small{display:block;font-size:12.5px;font-weight:700;color:var(--ink3)}
.s-goalmin{font-size:13px;font-weight:800;color:var(--ink2);white-space:nowrap}
.s-goalbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:0 2px 11px}
.s-goalbar i{display:block;height:100%;border-radius:99px;background:var(--gold,#F2D46B)}
.s-goalbox.done .s-goalbar i{background:var(--good)}
.s-goalbox .s-grid{margin:0}
.s-pts{text-align:center;font-size:22px;font-weight:900;margin-top:18px;color:var(--ink2)}
.s-tile.shut{opacity:.55;border-style:dashed}
.s-tile.shut.fin{opacity:.8;border-style:solid;border-color:var(--good);color:var(--good)}
/* the way in to the prize shelf, beside his car at the top of the screen */
.s-shelf{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font:inherit;
  background:var(--card);border:2px solid var(--line);border-radius:20px;padding:9px 13px;min-width:98px;box-shadow:var(--shadow-sm)}
.s-shelf-ic{font-size:30px;line-height:1.1}
.s-shelf small{font-size:12.5px;font-weight:800;color:var(--ink2)}
.s-shelf-pts{font-size:12px;font-weight:900;color:var(--ink3)}
.s-shelf.ready{border-color:var(--gold,#F2D46B);background:var(--sun-soft,#FFF4D8)}
.s-shelf.ready .s-shelf-pts{color:#8A5B00}
.s-prizehero{display:flex;align-items:center;gap:14px;margin:6px 0 4px}
.s-prizehero-ic{font-size:46px}
/* the shelf itself, sized for a child */
.s-prizes{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px 12px 10px;margin:14px 0 0;
  box-shadow:var(--shadow-sm)}
.s-prizes.ready{border-color:var(--gold,#F2D46B);background:var(--sun-soft,#FFF4D8)}
.s-prizes-hd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 9px}
.s-prizes-hd b{font-size:19px;font-weight:900}
.s-prizes-hd span{font-size:14px;font-weight:800;color:var(--ink3)}
.s-prize-list{display:flex;flex-direction:column;gap:7px}
.s-prize{display:flex;align-items:center;gap:11px;background:var(--card2);border:2px solid transparent;border-radius:15px;padding:10px 12px}
.s-prize.can{border-color:var(--good);background:var(--good-soft)}
.s-prize.done{opacity:.8;border-color:var(--line)}
.s-prize-ic{font-size:26px;flex:0 0 auto}
.s-prize-tx{flex:1;min-width:0}
.s-prize-tx b{display:block;font-size:17px;font-weight:900;line-height:1.2}
.s-prize-tx small{display:block;font-size:13px;font-weight:700;color:var(--ink3)}
.s-prize-bar{display:block;height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:5px;max-width:220px}
.s-prize-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.s-prize-cost{font-size:14px;font-weight:900;color:var(--ink3);white-space:nowrap}
.s-prize-get{font:inherit;font-size:15px;font-weight:900;cursor:pointer;white-space:nowrap;
  background:var(--good);color:var(--card);border:0;border-radius:13px;padding:10px 14px}
.s-prize-ask{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.s-prize-yes{font:inherit;font-weight:900;cursor:pointer;background:var(--good);color:var(--card);border:0;border-radius:13px;padding:10px 13px}
.s-prize-no{font:inherit;font-weight:800;cursor:pointer;background:var(--card);color:var(--ink3);border:1px solid var(--line);border-radius:13px;padding:10px 12px}
/* trophies: what stays after the points are spent */
.s-trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.s-trophy{background:var(--card2);border:2px solid transparent;border-radius:16px;padding:11px 10px;text-align:center}
.s-trophy.got{background:var(--sun-soft,#FFF4D8);border-color:var(--gold,#F2D46B)}
.s-trophy-ic{display:block;font-size:30px;line-height:1.2;filter:grayscale(1);opacity:.5}
.s-trophy.got .s-trophy-ic{filter:none;opacity:1}
.s-trophy-nm{display:block;font-size:14px;font-weight:900;line-height:1.15;margin-top:2px}
.s-trophy small{display:block;font-size:11.5px;font-weight:700;color:var(--ink3);margin-top:2px}
.s-trophy.got small{color:#8A5B00}
.s-trophy-bar{display:block;height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.s-trophy-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
/* the handover between two stops of his lineup */
.hop{max-width:520px;margin:0 auto;text-align:center;padding:18px 0 8px}
.hop-done{background:var(--good-soft);color:var(--good);border-radius:20px;padding:16px 18px;font-size:28px}
.hop-done b{display:block;font-size:26px;font-weight:900;margin-top:2px}
.hop-done small{display:block;font-size:15px;font-weight:700;opacity:.85}
.hop-road{height:74px;position:relative;margin:6px 0;
  background:repeating-linear-gradient(90deg,var(--line) 0 16px,transparent 16px 32px) center/100% 4px no-repeat}
.hop-car{position:absolute;left:0;top:6px;width:120px;animation:hopdrive 2.6s ease-in-out forwards}
.hop-car svg,.hop-car img{width:100%;height:auto}
@keyframes hopdrive{from{left:0}to{left:calc(100% - 120px)}}
@media (prefers-reduced-motion: reduce){ .hop-car{animation:none;left:calc(50% - 60px)} }
.hop-next{background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:16px 18px}
.hop-next-ic{font-size:40px;display:block}
.hop-next b{display:block;font-size:27px;font-weight:900}
.hop-next small{display:block;font-size:16px;font-weight:700;color:var(--ink3)}
.hop-go{margin-top:12px;font-size:17px;font-weight:800;color:var(--ink3)}
/* the sheet his rebbi sent home — it sits above the track, because tonight it is
   the thing he was actually asked to do */
.s-hw{background:var(--card);border:2px solid var(--sun,#F7B84B);border-radius:22px;padding:12px 12px 13px;margin:0 0 16px;
  box-shadow:var(--shadow-sm)}
.s-hw-hd{margin:0 4px 9px;font-size:19px;line-height:1.25}
.s-hw-hd b{font-size:19px;font-weight:900}
.s-hw-hd small{display:block;font-size:13px;font-weight:700;color:var(--ink3);margin-top:1px}
.s-hw-row{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--card2);border:2px solid transparent;border-radius:16px;padding:11px 12px;margin-bottom:7px}
.s-hw-row:last-child{margin-bottom:0}
.s-hw-row.done{background:var(--good-soft);border-color:var(--good)}
.s-hw-ic{flex:0 0 auto;width:42px;height:42px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:22px}
.s-hw-row.done .s-hw-ic{background:var(--good);border-color:var(--good);color:#fff}
.s-hw-tx{flex:1;min-width:0}
.s-hw-tx b{display:block;font-size:17px;font-weight:900;line-height:1.15}
.s-hw-tx small{display:block;font-size:13px;font-weight:700;color:var(--ink3);margin-bottom:5px}
.s-hw-bar{display:block;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.s-hw-bar i{display:block;height:100%;border-radius:99px;background:var(--sun,#F7B84B)}
.s-hw-bar i.g{background:var(--good)}
.s-hw-go{flex:0 0 auto;font-size:13px;font-weight:900;letter-spacing:.4px;color:#8A5B00;
  background:var(--sun-soft,#FFF4D8);border-radius:99px;padding:7px 12px}
.s-hw-row.done .s-hw-go{background:var(--card);color:var(--ink3)}
/* The day as a circuit: an asphalt road winding down the screen, a marker at every
   step, a chequered checkpoint at every goal, and the child's own car parked on the
   one he is meant to drive next. */
.s-circuit{position:relative;margin:0 0 18px}
.s-road{position:absolute;inset:0;width:100%;height:100%}
.rd-edge{fill:none;stroke:var(--ink);opacity:.16;stroke-width:44px;stroke-linecap:round}
.rd-top {fill:none;stroke:#3B4256;stroke-width:38px;stroke-linecap:round}
.rd-mid {fill:none;stroke:#FFF;opacity:.5;stroke-width:3px;stroke-linecap:round;stroke-dasharray:9 11}
.rd-done{fill:none;stroke:var(--accent);opacity:.55;stroke-width:38px;stroke-linecap:round}
.s-flag{position:absolute;transform:translate(-50%,-50%);font-size:11px;font-weight:900;letter-spacing:.09em;
  color:#fff;background:rgba(0,0,0,.42);border-radius:999px;padding:3px 11px;white-space:nowrap;z-index:5}
.s-flag.finish{background:var(--ink);font-size:12px}
.s-flag.finish.won{background:var(--good)}
.s-mark{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:9px;
  background:none;border:0;padding:0;font:inherit;cursor:pointer;z-index:3;white-space:nowrap}
.s-mark.lbl-l{flex-direction:row-reverse}
.mk{flex:0 0 auto;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:var(--card);border:4px solid #FFF;box-shadow:0 5px 14px rgba(10,15,40,.34)}
.s-mark.goal .mk{width:64px;height:64px;font-size:29px;border-color:var(--gold,#F2D46B);background:#FFF7DF}
.mk-lbl{display:flex;flex-direction:column;text-align:left;background:var(--card);border-radius:12px;
  padding:5px 11px;box-shadow:0 3px 10px rgba(10,15,40,.16);max-width:44vw;overflow:hidden}
.s-mark.lbl-l .mk-lbl{text-align:right}
.mk-lbl b{font-size:16px;font-weight:800;line-height:1.15;color:var(--ink)}
.s-mark.goal .mk-lbl b{font-size:19px;font-weight:900}
.mk-lbl small{font-size:12.5px;font-weight:700;color:var(--ink3)}
.s-mark.done .mk{background:var(--good);border-color:#FFF;color:#fff}
/* the label must never go translucent: it sits ON the road, and a see-through one
   is the road showing through the words. Grey the text, keep the card solid. */
.s-mark.done .mk-lbl b{text-decoration:line-through;color:var(--ink3)}
.s-mark.done .mk-lbl small{color:var(--ink3)}
.s-mark.now{z-index:4}
.s-mark.now .mk{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft),0 7px 18px rgba(70,50,190,.4);
  animation:mkPulse 1.7s ease-in-out infinite}
.s-mark.now .mk-lbl{background:var(--accent);box-shadow:0 6px 16px rgba(70,50,190,.42)}
.s-mark.now .mk-lbl b,.s-mark.now .mk-lbl small{color:#fff}
.s-mark.shut{cursor:default}
.s-mark.shut .mk{opacity:.5}
.s-mark.shut .mk-lbl b{color:var(--ink3)}
.s-mark.shut .mk-lbl small{color:var(--warn,#B7791F)}
@keyframes mkPulse{0%,100%{box-shadow:0 0 0 6px var(--accent-soft),0 7px 18px rgba(70,50,190,.4)}
  50%{box-shadow:0 0 0 12px rgba(98,87,232,.16),0 7px 18px rgba(70,50,190,.4)}}
.mk-car{position:absolute;left:50%;top:-30px;transform:translateX(-50%);width:60px;height:34px;pointer-events:none}
.mk-car .carimg{width:60px;height:34px;display:block}
.mk-car .carimg img{width:100%;height:100%;object-fit:contain}
.s-mark.lbl-l .mk-here,.s-mark .mk-here{position:absolute;left:50%;top:44px;transform:translateX(-50%);
  background:var(--accent);color:#fff;border-radius:8px;padding:3px 9px;font-size:10.5px;font-weight:900;
  letter-spacing:.05em;box-shadow:0 4px 10px rgba(70,50,190,.4)}
.s-mark.goal .mk-here{top:50px}
@media (max-width:390px){ .mk-lbl b{font-size:15px} .mk{width:50px;height:50px;font-size:24px} }
/* the checkpoint: a goal made of the steps above it. Drawn as a banner across the
   road rather than another marker, because it is not another thing to do — it is the
   total of the ones he has already driven. */
.s-gate{position:absolute;left:0;right:0;transform:translateY(-50%);z-index:4;display:flex;justify-content:center;
  background:none;border:0;padding:0;font:inherit;color:inherit;text-align:center}
.s-gate-in{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:66%;max-width:88%;
  background:var(--card);border:2px solid var(--gold,#F2D46B);border-radius:16px;padding:9px 16px 10px;
  box-shadow:0 6px 18px rgba(10,15,40,.2);position:relative;overflow:hidden}
.s-gate-in::before{content:"";position:absolute;left:0;right:0;top:0;height:7px;
  background-image:linear-gradient(45deg,#2B2F3E 25%,transparent 25%,transparent 75%,#2B2F3E 75%),
                   linear-gradient(45deg,#2B2F3E 25%,#FFF 25%,#FFF 75%,#2B2F3E 75%);
  background-size:14px 14px;background-position:0 0,7px 7px}
.s-gate-hd{font-size:20px;font-weight:900;margin-top:5px;line-height:1.15}
.s-gate-sub{font-size:12.5px;font-weight:700;color:var(--ink3)}
.s-gate-bar{width:100%;max-width:220px;height:9px;border-radius:99px;background:var(--line);overflow:hidden}
.s-gate-bar i{display:block;height:100%;border-radius:99px;background:var(--gold,#F2D46B)}
.s-gate-min{font-size:13px;font-weight:800;color:var(--ink2)}
.s-gate.done .s-gate-in{border-color:var(--good);background:var(--good-soft,#E3F6EA)}
.s-gate.done .s-gate-bar i{background:var(--good)}
.s-gate.done .s-gate-hd{color:var(--good)}
.s-gate.now{cursor:pointer}
.s-gate.now .s-gate-in{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent-soft),0 7px 18px rgba(70,50,190,.34)}
.s-gate.now .s-gate-bar i{background:var(--accent)}
.s-gate.shut .s-gate-in{opacity:.75}
.s-gate .mk-car{top:-34px}
/* the microphone is the main move: say it first, listen only if you need to */
.bigbtn.ear{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;width:100%;
  box-shadow:var(--shadow-pop,0 10px 24px rgba(70,50,190,.34))}
.bigbtn.ear .ear-lbl{display:inline-flex;align-items:center;gap:10px;font-size:30px;line-height:1.1}
.bigbtn.ear .ear-ic{font-size:32px}
.bigbtn.ear.playing{animation:earPulse 1.1s ease-in-out infinite}
@keyframes earPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
.bigbtn.hear.second{background:var(--card);color:var(--ink);border:2px solid var(--line);
  box-shadow:var(--shadow-sm);font-size:19px;padding:13px 18px}
.bigbtn.hear.second small{color:var(--ink3);opacity:1}
/* the three steps of a Read & Listen round, as pictures */
.kidsteps{display:flex;align-items:center;justify-content:center;gap:6px;margin:2px 0 10px}
.kidsteps .ks{display:flex;flex-direction:column;align-items:center;gap:1px;opacity:.45;min-width:62px}
.kidsteps .ks b{font-size:24px;line-height:1.1;font-weight:400}
.kidsteps .ks small{font-size:11.5px;font-weight:800;color:var(--ink3)}
.kidsteps .ks.on{opacity:1;transform:scale(1.12)}
.kidsteps .ks.on small{color:var(--accent)}
.kidsteps .ks.ok{opacity:.9}
.kidsteps .ks.ok b{color:var(--good)}
.kidsteps .ks-dash{flex:0 0 18px;height:3px;border-radius:2px;background:var(--line)}
.s-tap{text-align:center;font-size:17px;font-weight:800;color:var(--accent);margin:10px 0 16px}
/* the sheet as it is printed: teitch on the left, dash, Hebrew on the right */
.hwsheet{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;
  max-height:340px;overflow:auto}
.hws-hd{font-weight:900;font-size:15px;text-align:right;direction:rtl;text-decoration:underline;margin:12px 0 6px}
.hws-hd:first-child{margin-top:2px}
.hws-row{display:flex;align-items:baseline;justify-content:flex-end;gap:8px;padding:2px 0;flex-wrap:wrap}
.hws-en{color:var(--ink2);font-size:14.5px;text-align:right;flex:1;min-width:0}
.hws-dash{color:var(--ink3)}
.hws-he{direction:rtl;font-family:'Frank Ruhl Libre',serif;font-size:19px;font-weight:600;white-space:nowrap}
/* the daily jobs, day by day: a dot for each day, filled when it was ticked */
.jobs{display:flex;flex-direction:column;gap:2px}
.jobrow{display:grid;grid-template-columns:minmax(120px,1.1fr) auto minmax(70px,.9fr) auto;align-items:center;gap:12px;
  padding:9px 2px;border-top:1px solid var(--line)}
.jobrow:first-child{border-top:0}
.jobnm{font-weight:800;font-size:15px}
.jobdots{display:flex;flex-wrap:wrap;gap:3px;max-width:365px}
.jobdots i{width:9px;height:9px;border-radius:3px;background:var(--line)}
@media(max-width:900px){ .jobdots i{width:7px;height:7px} }
.jobdots i.on{background:var(--good)}
.jobdots i.off{background:var(--line)}
.jobdots i.skip{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.jobbar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.jobbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.jobbar i.g{background:var(--good)}
.jobbar i.b{background:var(--warn,#B7791F)}
.jobn{font-size:13px;color:var(--ink3);white-space:nowrap;font-variant-numeric:tabular-nums}
.jobn b{color:var(--ink2)}
@media(max-width:640px){ .jobrow{grid-template-columns:1fr auto;gap:6px} .jobbar{grid-column:1/-1} .jobdots{max-width:none} }
.hwprev{margin-top:12px}
.hwprev > b{font-size:13px;color:var(--ink3)}
/* the same sheet, but sized for the child to LOOK at before anyone tests him:
   the Hebrew big on its own line, the teitch under it, one phrase per card */
.hwlook{margin:14px 0 0;padding-bottom:4px}
.hwlook-hd{font-family:'Frank Ruhl Libre',serif;direction:rtl;text-align:right;font-size:22px;font-weight:800;
  background:var(--sun-soft,#FFF4D8);color:#8A5B00;border-radius:14px;padding:9px 14px;margin:18px 0 10px}
.hwlook-hd:first-child{margin-top:0}
.hwlook-row{display:flex;align-items:baseline;gap:12px;width:100%;text-align:left;font:inherit;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px}
.hwlook-row.on{border-color:var(--accent);background:var(--accent-soft)}
.hwlook-n{flex:0 0 auto;font-size:12.5px;font-weight:800;color:var(--ink3);min-width:22px}
/* the tick that puts a word in his test */
.hwtick{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card2);
  display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:var(--ink3);
  align-self:center}
.hwlook-row.on .hwtick{background:var(--accent);border-color:var(--accent);color:var(--card);font-size:18px}
.hwsolid{flex:0 0 auto;width:16px;text-align:center;font-size:13px;font-weight:900;color:var(--good);align-self:center}
.hwpickbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:14px 0 2px}
.hwpickbar > b{font-size:14.5px;font-weight:800;color:var(--ink2)}
.s-go.off{background:var(--card2);color:var(--ink3);box-shadow:none}
/* the homework clock a parent set */
.hwclock{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:11px 14px;margin:12px 0 0}
.hwclock.done{border-color:var(--good);background:var(--good-soft)}
.hwclock-ic{font-size:26px;flex:0 0 auto}
.hwclock-tx{flex:1;min-width:0}
.hwclock-tx b{display:block;font-size:17px;font-weight:900}
.hwclock-tx small{display:block;font-size:13px;font-weight:600;color:var(--ink3);margin-bottom:5px}
.hwclock-bar{display:block;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.hwclock-bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.hwclock.done .hwclock-bar i{background:var(--good)}
/* the same list inside the parent portal, tighter and scrolling in its own box */
.hwlook.parent{max-height:360px;overflow:auto;padding:2px 2px 4px}
.hwlook.parent .hwlook-row{padding:7px 10px;margin-bottom:5px;border-radius:11px}
.hwlook.parent .hwlook-he{font-size:20px}
.hwlook.parent .hwlook-en{font-size:14px}
.hwlook.parent .hwtick{width:25px;height:25px;font-size:13px}
.hwlook.parent .hwlook-hd{font-size:17px;padding:6px 11px;margin:10px 0 7px}
.hwlook-tx{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:flex-end;gap:9px;flex-wrap:wrap-reverse}
.hwlook-he{direction:rtl;text-align:right;font-family:'Frank Ruhl Libre',serif;
  font-size:27px;font-weight:600;line-height:1.6;white-space:nowrap}
.hwlook-en{flex:1;min-width:0;font-size:16px;font-weight:600;color:var(--ink2);text-align:right}
.hwlook-dash{color:var(--ink3);font-weight:700}
.hwlook.hide-en .hwlook-dash{visibility:hidden}
.hwlook.hide-en .hwlook-en{visibility:hidden}
.hwstudy-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hwstudy-go{position:sticky;bottom:10px;margin-top:18px}
.hwstudy-go .s-go-ic{font-size:42px}
.hwstudy-go .s-go-tx b{font-size:26px}
.hwstudy-go .s-go-tx small{font-size:15px}
/* a homework sheet a parent photographed */
.hwbox{background:var(--card2);border-left:3px solid var(--sun,#F7B84B);border-radius:0 12px 12px 0;padding:12px 14px;margin:0 0 12px}
.hwbox b{font-size:14px}
.hwbox textarea{width:100%;box-sizing:border-box;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font:inherit;font-size:15px;line-height:1.6;resize:vertical;direction:rtl;text-align:right}
.hwshots{display:flex;gap:8px;flex-wrap:wrap}
.hwshots img{width:110px;height:150px;object-fit:cover;border-radius:10px;border:1px solid var(--line);background:var(--card)}
/* Rashi sitting under the pasuk — quiet until it is asked for */
.chrashi{margin:10px auto 0;max-width:660px;text-align:center}
.chrashi-body{margin-top:8px;background:var(--card2);border:1px solid var(--line);border-radius:12px;
  padding:10px 14px;text-align:right;direction:rtl}
.chrashi-row{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.65;direction:rtl;text-align:right}
.chrashi-row:last-child{border-bottom:0}
.chrashi-row span{direction:ltr;unicode-bidi:isolate;display:inline;text-align:left}
.chrashi-d{display:block;font-size:19px;margin-bottom:3px;color:var(--accent-ink)}
/* the Rashi itself, in Rashi script, the way it is printed in his chumash — the
   dibur hamaschil first, then the piece, with the teitch under it in English */
.chrashi-hd{display:block;font-size:23px;line-height:1.5;margin-bottom:2px;color:var(--accent-ink)}
.chrashi-he{font-size:22px;line-height:1.8;margin-bottom:6px}
.chrashi-row .chrashi-he,.chrashi-row .chrashi-hd{direction:rtl;text-align:right}
.chrashi-row span{color:var(--ink2);font-size:14.5px}
.chrashi-body small{display:block;margin-top:6px;direction:ltr;text-align:left}
/* the two ways a sheet can reach him: as a picture, or as words to practise */
.hwpick2{margin:2px 0 14px}
.hwpick2-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.hwpick2-card{flex:1;min-width:230px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;
  padding:12px 14px;display:flex;flex-direction:column;gap:7px;align-items:flex-start}
.hwpick2-card.on{border-color:var(--good);background:var(--good-soft)}
.hwpick2-card small{color:var(--ink2);font-size:12.5px;line-height:1.5}
/* the page itself, on his screen — readable without pinching, bigger when tapped */
.hwpages{display:flex;flex-direction:column;gap:12px;margin:10px 0 16px}
.hwpage{width:100%;border-radius:14px;border:1px solid var(--line);background:#fff;cursor:zoom-in;display:block}
.hwpage.zoom{max-width:none;width:190%;cursor:zoom-out}
/* the founding families are the product's compass — ask them, on the screen they
   actually land on, not in a box under the settings */
.fbnudge{display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;margin:14px 0 4px;
  background:var(--sun-soft);border:1.5px solid var(--sun);border-radius:16px;padding:12px 14px}
.fbnudge b{font-size:15px}
.fbnudge small{color:var(--ink2);font-size:12.5px}
/* how much of your voice is in — the one number that decides whether it works */
.vhero{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.vring{width:82px;height:82px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative}
.vring::after{content:"";position:absolute;inset:9px;background:var(--card);border-radius:50%}
.vring span{position:relative;z-index:1;font-size:17px;font-weight:900}
/* the parent portal: four tabs, one job each */
.ptabs{display:flex;gap:6px;margin:12px 0 16px;background:var(--card2);padding:5px;border-radius:16px}
.ptab{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:800;color:var(--ink3);
  padding:7px 2px 8px;border-radius:12px;cursor:pointer;line-height:1.25}
.ptab b{display:block;font-size:19px;font-weight:400}
.ptab.on{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
.phero{background:linear-gradient(140deg,var(--accent),var(--accent2));color:#fff;border-radius:20px;
  padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow-pop)}
.phero-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.phero-big{font-size:34px;font-weight:900;line-height:1.05}
