# Render Blueprint (paid plans): creates the web service AND a Postgres database that never expires.
# In Render: New + -> Blueprint -> pick the repo -> Apply. Needs a payment method on the account.
services:
  - type: web
    name: my-torah-helper
    runtime: node
    plan: starter          # $7/mo: always on, no sleeping
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: my-torah-helper-db
          property: connectionString
      - key: NODE_VERSION
        value: "20"

databases:
  - name: my-torah-helper-db
    plan: basic-256mb      # $6/mo: no 30-day expiry
    databaseName: kriah
    user: kriah
