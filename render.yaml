# Render Blueprint - deploys the valuation app as a web service.
# In the Render dashboard: New + -> Blueprint -> select this repo.
services:
  - type: web
    name: policy-valuation
    runtime: python
    plan: starter          # change to 'free' to test (spins down when idle)
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 2 --max-requests 25 --max-requests-jitter 5 -t 300 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: APP_USER
        sync: false        # set in dashboard - basic-auth username
      - key: APP_PASSWORD
        sync: false        # set in dashboard - basic-auth password
      - key: ANTHROPIC_API_KEY
        sync: false        # optional - enables PDF illustration extraction
